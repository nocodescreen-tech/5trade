<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5trade — Pilote</title>
<style>
  /* Bulles de conversation. Palette alignée sur l'application : fond profond,
     accent unique, aucune couleur décorative en plus. */
  :root{
    --fond:#0b0d12; --surface:#141821; --surface-2:#1b2130; --ligne:#262d3d;
    --texte:#e8ecf5; --dim:#8b93a7; --accent:#f4772e; --accent-doux:#3a2416;
    --ok:#3ddc97; --err:#ff6b6b;
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--fond); color:var(--texte);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:12px;
    padding:14px 18px; border-bottom:1px solid var(--ligne); background:var(--surface);
    position:sticky; top:0; z-index:2;
  }
  .logo{
    width:32px;height:32px;border-radius:9px;background:var(--accent);
    display:grid;place-items:center;font-weight:800;color:#120b05;font-size:15px;
  }
  .titre{font-weight:650;letter-spacing:-.01em}
  .sous{font-size:12px;color:var(--dim)}
  header .droite{margin-left:auto;display:flex;gap:8px;align-items:center}
  .pastille{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
  .point{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .point.off{background:var(--err)}
  button{
    font:inherit; color:var(--texte); background:var(--surface-2);
    border:1px solid var(--ligne); border-radius:10px; padding:8px 12px; cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  button:hover{background:#232a3a;border-color:#323a4d}
  button:disabled{opacity:.5;cursor:default}

  #fil{flex:1; overflow-y:auto; padding:22px 18px 8px; scroll-behavior:smooth}
  .rangee{display:flex; gap:10px; margin:0 0 16px; align-items:flex-end}
  .rangee.moi{flex-direction:row-reverse}
  .bulle{
    max-width:min(680px,78%); padding:12px 15px; border-radius:var(--r);
    background:var(--surface); border:1px solid var(--ligne);
    white-space:pre-wrap; word-break:break-word;
    box-shadow:0 1px 0 rgba(255,255,255,.02) inset;
  }
  .rangee.moi .bulle{
    background:var(--accent-doux); border-color:#5a3a22; border-bottom-right-radius:6px;
  }
  .rangee.ia .bulle{border-bottom-left-radius:6px}
  .avatar{
    width:28px;height:28px;border-radius:8px;background:var(--surface-2);
    border:1px solid var(--ligne); display:grid;place-items:center;
    font-size:12px;font-weight:700;color:var(--dim); flex:0 0 auto;
  }
  .rangee.moi .avatar{background:var(--accent);color:#120b05;border-color:transparent}
  .meta{font-size:11px;color:var(--dim);margin-top:6px}
  .rangee.moi .meta{text-align:right}

  .heure{font-size:11px;color:var(--dim);align-self:flex-end;padding-bottom:2px}

  /* Indicateur de frappe */
  .frappe{display:inline-flex;gap:4px;padding:4px 2px}
  .frappe i{
    width:6px;height:6px;border-radius:50%;background:var(--dim);
    animation:saut 1.2s infinite ease-in-out;
  }
  .frappe i:nth-child(2){animation-delay:.15s}
  .frappe i:nth-child(3){animation-delay:.3s}
  @keyframes saut{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-4px);opacity:1}}

  .raccourcis{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 10px}
  .raccourcis button{font-size:12.5px;padding:6px 10px;border-radius:999px;color:var(--dim)}
  .raccourcis button:hover{color:var(--texte)}

  .confirm{display:flex;gap:8px;margin-top:10px}
  .confirm button{padding:6px 14px;font-size:13px}
  .confirm .oui{background:var(--accent);color:#120b05;border-color:transparent;font-weight:650}

  footer{
    border-top:1px solid var(--ligne); background:var(--surface); padding:12px 18px 16px;
    position:sticky; bottom:0;
  }
  .saisie{display:flex; gap:10px; align-items:flex-end; max-width:980px; margin:0 auto}
  textarea{
    flex:1; resize:none; max-height:170px; min-height:46px; padding:12px 14px;
    background:var(--surface-2); color:var(--texte); border:1px solid var(--ligne);
    border-radius:12px; font:inherit; line-height:1.4; outline:none;
  }
  textarea:focus{border-color:#3a4459}
  .envoyer{background:var(--accent); color:#120b05; border-color:transparent; font-weight:700; padding:12px 18px}
  .aide{max-width:980px;margin:8px auto 0;font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between;gap:10px}
  @media (max-width:560px){ .bulle{max-width:88%} .raccourcis{overflow-x:auto;flex-wrap:nowrap} }
</style>
</head>
<body>
<header>
  <div class="logo">5</div>
  <div>
    <div class="titre">Pilote 5trade</div>
    <div class="sous">Supervision · diagnostic · administration</div>
  </div>
  <div class="droite">
    <span class="pastille"><span class="point" id="etat"></span><span id="etatTxt">connexion…</span></span>
    <button id="effacer" title="Effacer la conversation">Effacer</button>
  </div>
</header>

<div id="fil" aria-live="polite"></div>

<div class="raccourcis" id="raccourcis">
  <button data-t="montre l'état du système">État du système</button>
  <button data-t="montre les positions">Positions</button>
  <button data-t="montre les scénarios en attente">Scénarios</button>
  <button data-t="montre les stratégies actives">Stratégies</button>
  <button data-t="qu'est-ce que tu as appris cette semaine ?">Apprentissage</button>
  <button data-t="aide">Aide</button>
</div>

<footer>
  <div class="saisie">
    <textarea id="champ" rows="1" placeholder="Écris une commande… (« montre les scénarios », « désactive strategy_trend »)"></textarea>
    <button class="envoyer" id="envoyer">Envoyer</button>
  </div>
  <div class="aide"><span>Entrée pour envoyer · Maj+Entrée pour un retour à la ligne</span><span id="compteur"></span></div>
</footer>

<script>
const fil = document.getElementById('fil');
const champ = document.getElementById('champ');
const envoyer = document.getElementById('envoyer');
const etat = document.getElementById('etat');
const etatTxt = document.getElementById('etatTxt');

const heure = iso => {
  const d = iso ? new Date(iso) : new Date();
  return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
};

/** Ajoute une bulle. role: 'user' | 'assistant'. */
function bulle(role, texte, quand, options = {}) {
  const rangee = document.createElement('div');
  rangee.className = 'rangee ' + (role === 'user' ? 'moi' : 'ia');

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? 'M' : '5';

  const bloc = document.createElement('div');
  const b = document.createElement('div');
  b.className = 'bulle';
  b.textContent = texte;
  bloc.appendChild(b);

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = quand || heure();
  bloc.appendChild(meta);

  // Une réponse qui demande confirmation propose directement les deux boutons.
  if (options.confirmation) {
    const c = document.createElement('div');
    c.className = 'confirm';
    const oui = document.createElement('button');
    oui.className = 'oui'; oui.textContent = 'Oui';
    const non = document.createElement('button');
    non.textContent = 'Non';
    oui.onclick = () => { c.remove(); expedier('oui'); };
    non.onclick = () => { c.remove(); expedier('non'); };
    c.append(oui, non);
    bloc.appendChild(c);
  }

  rangee.append(av, bloc);
  fil.appendChild(rangee);
  fil.scrollTop = fil.scrollHeight;
  return rangee;
}

function frappe() {
  const r = document.createElement('div');
  r.className = 'rangee ia';
  r.id = 'frappe';
  const av = document.createElement('div');
  av.className = 'avatar'; av.textContent = '5';
  const b = document.createElement('div');
  b.className = 'bulle';
  b.innerHTML = '<span class="frappe"><i></i><i></i><i></i></span>';
  r.append(av, b);
  fil.appendChild(r);
  fil.scrollTop = fil.scrollHeight;
}

const stopFrappe = () => { const f = document.getElementById('frappe'); if (f) f.remove(); };

async function chargerHistorique() {
  try {
    const r = await fetch('/api/chat/historique?limite=80', { credentials: 'same-origin' });
    if (r.status === 401) { etat.classList.add('off'); etatTxt.textContent = 'non authentifié'; return; }
    const d = await r.json();
    if (!d.messages || !d.messages.length) {
      bulle('assistant', "Bonjour. Je pilote le système : je peux montrer l'état, les positions, "
        + "les scénarios, les stratégies, et en désactiver une après confirmation.\n"
        + "Tape « aide » pour la liste des commandes.");
    } else {
      for (const m of d.messages) bulle(m.role, m.texte, heure(m.creeAt));
    }
    etat.classList.remove('off');
    etatTxt.textContent = 'en ligne';
  } catch (e) {
    etat.classList.add('off');
    etatTxt.textContent = 'hors ligne';
  }
}

async function expedier(texte) {
  const t = String(texte || '').trim();
  if (!t) return;
  bulle('user', t);
  champ.value = '';
  champ.style.height = 'auto';
  envoyer.disabled = true;
  frappe();
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ message: t })
    });
    const d = await r.json();
    stopFrappe();
    const reponse = d.texte || (d.resultat && d.resultat.texte) || d.error
      || (d.success ? 'Action exécutée.' : 'Réponse vide.');
    const attendConfirmation = /Confirmer \? \(oui\/non\)/i.test(reponse);
    bulle('assistant', reponse, null, { confirmation: attendConfirmation });
  } catch (e) {
    stopFrappe();
    bulle('assistant', 'Erreur réseau : ' + e.message);
  } finally {
    envoyer.disabled = false;
    champ.focus();
  }
}

envoyer.onclick = () => expedier(champ.value);
champ.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); expedier(champ.value); }
});
champ.addEventListener('input', () => {
  champ.style.height = 'auto';
  champ.style.height = Math.min(170, champ.scrollHeight) + 'px';
});

document.getElementById('raccourcis').addEventListener('click', e => {
  const b = e.target.closest('button[data-t]');
  if (b) expedier(b.dataset.t);
});

document.getElementById('effacer').onclick = async () => {
  if (!confirm('Effacer tout l’historique de conversation ?')) return;
  await fetch('/api/chat/historique', { method: 'DELETE', credentials: 'same-origin' });
  fil.innerHTML = '';
  bulle('assistant', 'Historique effacé.');
};

chargerHistorique();
champ.focus();
</script>
</body>
</html>
