<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5trade — Pilote</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --bg-card: #131826;
      --bg-input: #1a2030;
      --border: #232a3d;
      --text: #e4e7ee;
      --text-muted: #8b94a8;
      --accent: #4f7cff;
      --accent-hover: #6b91ff;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --mono: 'JetBrains Mono', 'Courier New', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 16px; font-weight: 600; }
    header .badge {
      font-size: 11px;
      padding: 3px 8px;
      background: rgba(79, 124, 255, 0.15);
      color: var(--accent);
      border-radius: 4px;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
    }
    .msg.system {
      align-self: flex-start;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 13px;
    }
    .msg.system pre {
      background: var(--bg-input);
      padding: 8px;
      border-radius: 6px;
      margin: 8px 0;
      overflow-x: auto;
    }
    .msg.system code {
      background: var(--bg-input);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 12px;
      color: var(--accent);
    }
    .input-container {
      padding: 16px 20px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    .input-container textarea {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 200px;
      transition: border-color 0.2s;
    }
    .input-container textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .input-container button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .input-container button:hover { background: var(--accent-hover); }
    .input-container button:disabled {
      background: var(--border);
      cursor: not-allowed;
    }
    .suggestions {
      padding: 0 20px 8px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: var(--bg-card);
    }
    .suggestion {
      font-size: 12px;
      padding: 5px 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .suggestion:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .typing {
      align-self: flex-start;
      color: var(--text-muted);
      font-size: 13px;
      font-style: italic;
      padding: 8px 12px;
    }
    .typing::after {
      content: '...';
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>5trade — Pilote</h1>
    <span class="badge">Chat CRUD</span>
  </header>

  <div class="chat-container" id="chat">
    <div class="msg system">Bienvenue dans le Pilote. Tape une commande ou « aide » pour la liste.</div>
  </div>

  <div class="suggestions" id="suggestions">
    <span class="suggestion" onclick="send('montre l\'état du système')">État du système</span>
    <span class="suggestion" onclick="send('qu\'est-ce que tu as appris cette semaine ?')">Apprentissage</span>
    <span class="suggestion" onclick="send('montre les 5 derniers trades')">Derniers trades</span>
    <span class="suggestion" onclick="send('qu\'est-ce que tu sais sur XAUUSD ?')">Mémoire XAUUSD</span>
    <span class="suggestion" onclick="send('aide')">Aide</span>
  </div>

  <div class="input-container">
    <textarea id="input" placeholder="Tape ta commande..." rows="1"
              onkeydown="handleKey(event)"
              oninput="autoResize(this)"></textarea>
    <button id="send" onclick="sendFromInput()">Envoyer</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(200, el.scrollHeight) + 'px';
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendFromInput();
      }
    }

    function sendFromInput() {
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      autoResize(input);
      send(msg);
    }

    function send(msg) {
      addMessage('user', msg);
      sendBtn.disabled = true;
      const typing = addMessage('system', 'Le système réfléchit');
      typing.classList.add('typing');
      typing.textContent = 'Le système réfléchit';

      fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ message: msg })
      })
        .then(r => r.json())
        .then(data => {
          typing.remove();
          if (data.error) {
            addMessage('system', 'Erreur : ' + data.error);
          } else {
            // Formate le markdown simple en HTML
            const html = formatText(data.texte || '');
            addMessage('system', html, true);
          }
        })
        .catch(e => {
          typing.remove();
          addMessage('system', 'Erreur réseau : ' + e.message);
        })
        .finally(() => {
          sendBtn.disabled = false;
          input.focus();
        });
    }

    function addMessage(role, content, isHtml = false) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      if (isHtml) div.innerHTML = content;
      else div.textContent = content;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function formatText(text) {
      // Échappe le HTML
      let s = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      // Code inline
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      // Blocs de code ```
      s = s.replace(/```([\s\S]+?)```/g, '<pre>$1</pre>');
      // Titres markdown
      s = s.replace(/^### (.+)$/gm, '<strong>$1</strong>');
      s = s.replace(/^## (.+)$/gm, '<strong style="font-size:15px">$1</strong>');
      s = s.replace(/^# (.+)$/gm, '<strong style="font-size:16px">$1</strong>');
      // Listes
      s = s.replace(/^- (.+)$/gm, '• $1');
      return s;
    }

    input.focus();
  </script>
</body>
</html>
