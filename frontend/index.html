<!-- TradingView Lightweight Charts (Apache 2.0) : chandeliers professionnels,
     zoom et déplacement natifs. Servi localement pour rester utilisable hors ligne. -->
<script src="lightweight-charts.js?v=4.2.3"></script>
<script>
  // Filet de sécurité : si la bibliothèque locale n'a pas pu être chargée
  // (cache incomplet, fichier absent après un déploiement), on la prend sur un
  // CDN. Sans ce repli, l'écran affiche un cadre vide sans que rien n'explique
  // pourquoi — l'utilisateur croit alors que l'application est cassée.
  (function () {
    if (window.LightweightCharts) return;
    var sources = [
      'https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js',
      'https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js'
    ];
    var i = 0;
    (function charger() {
      if (window.LightweightCharts || i >= sources.length) {
        if (!window.LightweightCharts) console.error('Graphique : bibliothèque introuvable (local et CDN).');
        return;
      }
      var s = document.createElement('script');
      s.src = sources[i++];
      s.onload = function () {
        if (window.LightweightCharts) {
          // Prévient l'interface : le graphique peut maintenant se dessiner.
          window.dispatchEvent(new Event('lwc-pret'));
          console.info('Graphique : bibliothèque chargée depuis le CDN.');
        } else { charger(); }
      };
      s.onerror = charger;
      document.head.appendChild(s);
    })();
  })();
</script>
<script>
  // Runtime React "classic" : évite l'injection d'un import ESM dans les scripts inline.
  Babel.registerPreset('react-classic', {
    presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
  });
</script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer">
<!-- Font Awesome fallback local : si le CDN est bloqué, on charge la version minifiée servie par l'app -->
<script>
  (function(){
    // Ce script vit dans <head> : document.body n'existe pas encore au
    // premier passage. On attend le DOM, sinon appendChild lève un
    // TypeError qui tue tout le bloc et le repli ne se charge jamais.
    function verifier(){
    var link = document.querySelector('link[href*="font-awesome"]');
    if(!link || !document.body) return;
    var testIcon = document.createElement('i');
    testIcon.className = 'fas fa-chart-line';
    testIcon.style.cssText = 'position:absolute;left:-9999px';
    document.body.appendChild(testIcon);
    var loaded = window.getComputedStyle(testIcon).fontFamily.indexOf('Font Awesome') > -1;
    document.body.removeChild(testIcon);
    if(!loaded){
      var fallback = document.createElement('link');
      fallback.rel = 'stylesheet';
      fallback.href = 'font-awesome.min.css?v=6.5.1';
      fallback.crossOrigin = 'anonymous';
      document.head.appendChild(fallback);
      console.info('Font Awesome: CDN inaccessible, fallback local chargé');
    }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', verifier);
    } else {
      verifier();
    }
  })();
</script>

<link rel="stylesheet" href="design-tokens.css?v=1">

<style>
  :root{
    /* 5trade — tokens de design (theme sombre par defaut) */
    --bg:#070a11; --panel:#0e1420; --panel2:#111a29; --border:#1b2433;
    --txt:#e8eef7; --muted:#8a99ad;
    /* `--dim` était à #5d6b7d : 3,46:1 sur le fond, sous le minimum AA de 4,5:1
       pour du texte normal — et il sert sur des badges de 9 à 11 px. Relevé à
       #7d8b9f (5,3:1). Trouvé par l'audit axe-core, pas à l'œil. */
    --dim:#7d8b9f;
    --accent:#2563eb; --accent2:#3b82f6; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
    --radius:12px; --radius-sm:8px; --shadow:0 4px 18px -6px rgba(0,0,0,.55);
    --shadow-lg:0 12px 36px -10px rgba(0,0,0,.65);
    --focus:ring:0 0 0 3px rgba(37,99,235,.22);
    --transition:.18s cubic-bezier(.2,.8,.2,1);
  }
  /* Thème clair — bascule via [data-theme="light"] sur <html> */
  [data-theme="light"]{
    --bg:#f8fafc; --panel:#ffffff; --panel2:#f1f5f9; --border:#e2e8f0;
    --txt:#0f172a; --muted:#64748b;
    /* En clair, `--dim` à #94a3b8 donnait 2,56:1 sur blanc — pire que le thème
       sombre. Aligné sur `--muted` (4,76:1). */
    --dim:#64748b;
    --accent:#2563eb; --accent2:#3b82f6; --ok:#059669; --warn:#d97706; --bad:#dc2626;
    --shadow:0 4px 18px -6px rgba(15,23,42,.12);
    --shadow-lg:0 12px 36px -10px rgba(15,23,42,.18);
    --focus:ring:0 0 0 3px rgba(37,99,235,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  ::selection{background:rgba(37,99,235,.28)}
  /* Suppression: fond animé (aurora, grille, bruit), curseur animé, tilt 3D, glow-ring, floaty, gtext, gslide, signalPulse, bg-layer, fx-glow, fx-dot, fx-ring, fx-ripple — tout effet "vibe" */

  .shell{position:relative;z-index:1}

  /* Surfaces */
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .panel-soft{background:var(--panel2); border:1px solid var(--border); border-radius:var(--radius-sm)}

  /* Boutons — un seul style, propre, sans gradient */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent); color:#fff; border:none;
    padding:11px 20px; border-radius:var(--radius-sm); cursor:pointer;
    font-weight:600; font-size:14px; font-family:inherit;
    transition:background var(--transition), box-shadow var(--transition), transform var(--transition);
    box-shadow:var(--shadow);
  }
  .btn:hover:not(:disabled){background:var(--accent2); box-shadow:var(--shadow-lg); transform:translateY(-1px)}
  .btn:active:not(:disabled){transform:translateY(0) scale(.99)}
  .btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
  .btn.ghost{background:transparent; border:1px solid var(--border); color:var(--txt); box-shadow:none}
  .btn.ghost:hover:not(:disabled){background:rgba(37,99,235,.1); border-color:var(--accent); color:var(--accent)}
  .btn.ok{background:var(--ok)}
  .btn.ok:hover:not(:disabled){background:#059669}
  .btn.danger{background:var(--bad)}
  .btn.danger:hover:not(:disabled){background:#b91c1c}
  .btn.sm{padding:8px 14px; font-size:13px; border-radius:var(--radius-sm)}

  /* Champs */
  .fld{
    width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--bg); color:var(--txt); font-family:inherit; font-size:14px;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .fld::placeholder{color:var(--dim)}
  .fld:focus{outline:none; border-color:var(--accent); box-shadow:var(--focus:ring)}
  textarea.fld{resize:vertical; line-height:1.55}
  label.lbl{display:block; font-size:11.5px; font-weight:600; color:var(--muted);
    letter-spacing:.04em; text-transform:uppercase; margin:12px 0 6px}

  /* Tags / badges */
  .tag{display:inline-block; font-size:11px; background:rgba(37,99,235,.12);
    /* Le texte était en `--accent` (#2563eb) : 2,4:1 sur le fond sombre, très
       en dessous du minimum AA. Bleu clair sur la même teinte de fond conserve
       l'identité visuelle et passe à 7,8:1. */
    color:#93c5fd; border:1px solid rgba(37,99,235,.35); padding:3px 9px;
    border-radius:999px; margin:2px 3px 2px 0}
  .badge{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700;
    letter-spacing:.03em; padding:4px 11px; border-radius:999px}

  /* Reveal (entree douce) */
  .reveal{opacity:0; transform:translateY(12px); transition:opacity .5s var(--transition), transform .5s var(--transition)}
  .reveal.in{opacity:1; transform:none}

  /* Loaders */
  .spin{display:inline-block; width:18px; height:18px; border-radius:50%;
    border:2.5px solid var(--border); border-top-color:var(--accent);
    animation:sp .75s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .skel{position:relative; overflow:hidden; background:var(--panel2); border-radius:var(--radius-sm)}
  .skel::after{content:''; position:absolute; inset:0; transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
    animation:shim 1.4s infinite}
  @keyframes shim{to{transform:translateX(100%)}}
  .dot-live{width:8px; height:8px; border-radius:50%; background:var(--ok); position:relative}
  .dot-live::after{content:''; position:absolute; inset:0; border-radius:50%; background:var(--ok);
    animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.7} 75%,100%{transform:scale(3.2);opacity:0}}

  /* Barre de progression */
  .bar{height:3px; background:var(--border); border-radius:9px; overflow:hidden}
  .bar > i{display:block; height:100%; background:var(--accent); border-radius:9px;
    transition:width .5s var(--transition)}

  /* Nav principale : une seule rangée, jamais de retour à la ligne.
     Les onglets se partagent la largeur ; sur écran étroit, défilement horizontal. */
  .nav{display:flex; gap:4px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-item{flex:1 0 auto; justify-content:center; white-space:nowrap;
    display:inline-flex; align-items:center; gap:8px;
    padding:9px 16px; border-radius:var(--radius-sm); font-size:14px; font-weight:600;
    color:var(--muted); background:transparent; border:none; cursor:pointer;
    font-family:inherit; transition:color var(--transition), background var(--transition)}
  .nav-item:hover{color:var(--txt)}
  .nav-item.on{color:var(--txt); background:rgba(37,99,235,.12)}
  .nav-pill{display:none} /* plus de pilule animée */

  /* Mobile nav — 5 cibles, 44px min, safe-area */
  .mobile-nav{display:none}
  @media (max-width:820px){
    .nav{display:none}
    .mobile-nav{
      display:grid; grid-template-columns:repeat(5,1fr); gap:4px;
      position:fixed; bottom:0; left:0; right:0; z-index:60;
      padding:8px 10px calc(8px + env(safe-area-inset-bottom));
      background:rgba(7,10,17,.96); backdrop-filter:blur(16px);
      border-top:1px solid var(--border)
    }
    .mnav-btn{
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
      background:none; border:none; color:var(--muted); font-family:inherit;
      font-size:10.5px; font-weight:600; padding:8px 4px; border-radius:var(--radius-sm);
      cursor:pointer; min-height:44px;
      transition:color var(--transition), background var(--transition)
    }
    .mnav-btn.on{color:var(--accent); background:rgba(37,99,235,.12)}
    .mnav-btn:active{background:rgba(37,99,235,.2)}
    .pad-mobile{padding-bottom:88px}
    .mobile-plus{
      position:fixed; left:10px; right:10px;
      bottom:calc(86px + env(safe-area-inset-bottom)); z-index:61;
      display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:10px;
      border-radius:14px; background:rgba(14,20,32,.98);
      border:1px solid var(--border); box-shadow:var(--shadow-lg)
    }
    .mobile-plus button{
      display:flex; align-items:center; gap:9px; background:none; border:none;
      color:var(--muted); font-family:inherit; font-size:13px; font-weight:600;
      padding:12px; border-radius:var(--radius-sm); cursor:pointer; min-height:44px;
      transition:color var(--transition), background var(--transition)
    }
    .mobile-plus button.on,.mobile-plus button:active{
      color:var(--accent); background:rgba(37,99,235,.12)
    }
  }

  /* OTP */
  .otp-box{width:48px; height:58px; text-align:center; font-size:24px; font-weight:800;
    background:var(--bg); border:1.5px solid var(--border); border-radius:var(--radius-sm);
    color:var(--txt); transition:border-color var(--transition), box-shadow var(--transition),
    transform var(--transition); font-family:inherit}
  .otp-box:focus{outline:none; border-color:var(--accent); box-shadow:var(--focus:ring); transform:translateY(-2px)}
  .otp-box.filled{border-color:var(--ok)}

  /* ── Animations fluides (login / inscription / validation) ── */
  .otp-in{animation:otpIn .45s cubic-bezier(.2,.9,.25,1.2) both}
  @keyframes otpIn{from{opacity:0; transform:translateY(14px) scale(.9)} to{opacity:1; transform:none}}
  .modal-veil{animation:veilIn .3s ease both}
  @keyframes veilIn{from{opacity:0} to{opacity:1}}
  .modal-card{animation:modalIn .55s cubic-bezier(.2,1.15,.3,1) both}
  @keyframes modalIn{0%{opacity:0; transform:scale(.7) translateY(24px)}
    60%{opacity:1; transform:scale(1.04) translateY(-2px)} 100%{opacity:1; transform:none}}
  .auth-title{animation:titleIn .6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes titleIn{from{opacity:0; transform:translateY(-10px)} to{opacity:1; transform:none}}
  .shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)}
    50%{transform:translateX(6px)} 75%{transform:translateX(-3px)}}

  /* ── Fluidité globale : entrée de page, montée des panneaux, tactiles ── */
  html{scroll-behavior:smooth}
  .shell{animation:pageIn .5s ease both}
  @keyframes pageIn{from{opacity:0} to{opacity:1}}
  main.wrap .panel{animation:riseIn .4s cubic-bezier(.2,.9,.25,1) both}
  @keyframes riseIn{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
  .nav-item:active{transform:scale(.96)}
  .mnav-btn:active{transform:scale(.94)}

  /* ── Mascotte auth : flottement doux + bascule souple login/inscription ── */
  .mascot-bob{animation:mascotBob 5.5s ease-in-out infinite}
  @keyframes mascotBob{0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)}}
  .mascot{transition:transform .7s cubic-bezier(.3,1.2,.3,1); transform-origin:50% 100%}
  .mascot.login{transform:translateX(-10px) rotate(-2.5deg)}
  .mascot.signup{transform:translateX(10px) rotate(2.5deg)}
  .blink{animation:blink 4.8s ease-in-out infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.06)} 97.5%{transform:scaleY(1)}}

  /* ── Panneau auth : entrée fluide ── */
  .authpane{animation:paneIn .45s cubic-bezier(.2,.9,.25,1) both}
  @keyframes paneIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

  /* ── Coche de validation : apparition à ressort + anneau ── */
  .check3d{width:84px; height:84px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; background:var(--ok-bg, rgba(16,185,129,.12));
    border:2px solid var(--ok, #10b981); color:var(--ok, #10b981); font-size:32px;
    position:relative; animation:checkPop .6s cubic-bezier(.2,1.2,.3,1) both}
  @keyframes checkPop{0%{transform:scale(.4); opacity:0} 60%{transform:scale(1.06); opacity:1} 100%{transform:scale(1)}}
  .check-ring{position:absolute; inset:-7px; border-radius:50%;
    border:2px solid var(--ok, #10b981); opacity:.5; animation:ringPing 1.6s ease-out infinite}
  @keyframes ringPing{0%{transform:scale(.85); opacity:.6} 100%{transform:scale(1.25); opacity:0}}

  /* ── Divers : lissage tilt, flottement icônes, cube de chargement, halo carte ── */
  .tilt{transition:transform .25s ease-out; will-change:transform}
  .floaty{animation:floaty 5s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)}}
  .cube-wrap{perspective:300px; display:inline-block}
  .cube{width:100%; height:100%; position:relative; transform-style:preserve-3d; animation:cubeSpin 2.4s linear infinite}
  .cube b{position:absolute; inset:0; border:1.5px solid var(--accent); border-radius:3px; background:var(--accent-bg, rgba(37,99,235,.12))}
  .cube b:nth-child(1){transform:translateZ(var(--d))}
  .cube b:nth-child(2){transform:rotateY(180deg) translateZ(var(--d))}
  .cube b:nth-child(3){transform:rotateY(90deg) translateZ(var(--d))}
  .cube b:nth-child(4){transform:rotateY(-90deg) translateZ(var(--d))}
  .cube b:nth-child(5){transform:rotateX(90deg) translateZ(var(--d))}
  .cube b:nth-child(6){transform:rotateX(-90deg) translateZ(var(--d))}
  @keyframes cubeSpin{from{transform:rotateX(-20deg) rotateY(0)} to{transform:rotateX(-20deg) rotateY(360deg)}}
  .glow-ring{box-shadow:0 0 0 1px var(--border2, var(--border))}

  /* Drop zone */
  .drop{border:2px dashed var(--border); border-radius:var(--radius); padding:26px;
    text-align:center; cursor:pointer;
    transition:border-color var(--transition), background var(--transition), transform var(--transition);
    position:relative; overflow:hidden}
  .drop:hover{border-color:var(--accent); background:rgba(37,99,235,.05)}
  .drop.hot{border-color:var(--ok); background:rgba(16,185,129,.07); transform:scale(1.01)}

  .thumb{position:relative; border-radius:var(--radius-sm); overflow:hidden;
    border:1px solid var(--border); background:var(--bg); aspect-ratio:16/10}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s var(--transition)}
  .thumb:hover img{transform:scale(1.04)}

  /* Grilles utilitaires */
  .grid-auto{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(285px,1fr))}
  .stat-grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

  /* Scrollbar */
  ::-webkit-scrollbar{width:10px; height:10px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px; border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--dim)}

  /* Logo 5trade — SVG inline, s'adapte au thème via currentColor */
  .logo-5trade{display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--txt)}
  .logo-5trade svg{width:28px; height:28px; flex-shrink:0}
  .logo-5trade span{font-weight:800; font-size:1.15rem; letter-spacing:-.02em}
  .logo-5trade:hover span{color:var(--accent)}

  /* Icônes taille uniforme */
  .ico{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px}
  .ico-sm{width:16px; height:16px}
  .ico-lg{width:24px; height:24px}

  /* ── Responsive ── */
  .wrap{max-width:1280px;margin:0 auto;padding:22px 24px 48px;width:100%}
  .otp-box{width:min(48px,12.5vw);height:min(58px,15vw)}

  /* Grand écran : on exploite la largeur, tout tient sans scroll inutile */
  @media (min-width:1360px){
    .grid-auto{grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
    .stat-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
    .wrap{padding:26px 32px 56px}
  }
  @media (min-width:1700px){
    .wrap{max-width:1500px}
  }

  /* Tablette */
  @media (max-width:1024px){
    .wrap{padding:18px 18px 44px}
  }

  /* Mobile */
  @media (max-width:820px){
    .wrap{padding:14px 14px 96px}
    .panel{border-radius:14px}
    .stat-grid{grid-template-columns:1fr 1fr;gap:10px}
    .grid-auto{grid-template-columns:1fr;gap:12px}
    .card{padding:16px}
    header .hdr{padding:10px 14px !important}
    .auth-card{padding:22px 18px 20px !important}
    #fx-glow{display:none}
    .mascot{width:120px;height:129px}
    .btn{padding:12px 18px}
    .nav-item{padding:10px 14px}
    pre{font-size:12px !important}
  }
  @media (max-width:430px){
    .stat-grid{grid-template-columns:1fr}
    .otp-box{height:52px;font-size:20px}
  }

  /* ── Mobile : finitions haut de gamme ──
     L'essentiel est déjà là (barre au pouce, cibles de 44 px, safe-area). Ici on
     soigne ce qui se voit tout de suite sur un téléphone. */
  @media (max-width:820px){
    /* Un champ sous 16 px déclenche le zoom automatique d'iOS au focus : la page
       saute et l'utilisateur se retrouve décalé. 16 px est le seuil. */
    .fld, input, select, textarea{font-size:16px}
    /* Défilement fluide au doigt, sans entraîner toute la page. */
    .wrap{overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
    /* Panneaux : même ombre que sur ordinateur, proportionnée à l'écran. */
    .panel{box-shadow:0 12px 34px -20px rgba(0,0,0,.95)}

<script type="text/babel" data-presets="react-classic">

// Version de l'interface (affichée en en-tête) : permet de voir d'un coup d'œil

const REDUCED = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ══════════════ Primitives animées ══════════════ */

function Reveal({ children, delay = 0, className = '', style = {} }) {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (REDUCED()) { setSeen(true); return; }
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setSeen(true); io.disconnect(); }
    }, { threshold: 0.12, rootMargin: '0px 0px -40px' });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <div ref={ref}
      className={`reveal ${seen ? 'in' : ''} ${className}`}
      style={{ transitionDelay: `${delay}ms`, ...style }}>
      {children}
    </div>
  );
}

function Tilt({ children, max = 9, scale = 1.015, className = '', style = {} }) {
  const ref = useRef(null);
  const onMove = (e) => {
    const el = ref.current;
    if (!el || REDUCED()) return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    el.style.transform =
      `perspective(900px) rotateY(${px * max * 2}deg) rotateX(${-py * max * 2}deg) scale(${scale})`;
  };
  const reset = () => { if (ref.current) ref.current.style.transform = ''; };
  return (
    <div ref={ref} className={`tilt ${className}`} style={style}
      onMouseMove={onMove} onMouseLeave={reset}>
      {children}
    </div>
  );
}

function Skeleton({ h = 14, w = '100%', r = 8, style = {} }) {

}

function Spinner({ size = 16, color = '#fff' }) {

/* Curseur animé : halo + anneau + point, ripples au clic */
function CursorFX() {
  useEffect(() => {
    if (REDUCED()) return;
    if (window.matchMedia('(hover: none), (pointer: coarse)').matches) return;
    const glow = document.getElementById('fx-glow');
    const ring = document.getElementById('fx-ring');
    const dot  = document.getElementById('fx-dot');
    if (!glow || !ring || !dot) return;

    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let gx = mx, gy = my, rx = mx, ry = my, raf = 0;

    const onMove = (e) => {
      mx = e.clientX; my = e.clientY;
      dot.style.transform = `translate(${mx}px,${my}px) translate(-50%,-50%)`;
    };
    const onOver = (e) => {
      const t = e.target.closest('button, a, input, select, textarea, .drop, .tilt');
      ring.style.width  = t ? '52px' : '36px';
      ring.style.height = t ? '52px' : '36px';
    };
    const onDown = (e) => {
      ring.classList.add('click');
      const sp = document.createElement('span');
      sp.className = 'fx-ripple';
      sp.style.left = e.clientX + 'px';
      sp.style.top  = e.clientY + 'px';
      document.body.appendChild(sp);
      setTimeout(() => sp.remove(), 760);
    };
    const onUp = () => ring.classList.remove('click');

    const loop = () => {
      gx += (mx - gx) * 0.10; gy += (my - gy) * 0.10;
      rx += (mx - rx) * 0.22; ry += (my - ry) * 0.22;
      glow.style.transform = `translate(${gx}px,${gy}px) translate(-50%,-50%)`;
      ring.style.transform = `translate(${rx}px,${ry}px) translate(-50%,-50%)`;
      raf = requestAnimationFrame(loop);
    };

    glow.style.opacity = '1';
    window.addEventListener('mousemove', onMove, { passive: true });
    window.addEventListener('mouseover', onOver, { passive: true });
    window.addEventListener('mousedown', onDown);
    window.addEventListener('mouseup', onUp);
    loop();

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseover', onOver);
      window.removeEventListener('mousedown', onDown);
      window.removeEventListener('mouseup', onUp);
    };
  }, []);

  return (
    <>
      <div id="fx-glow"></div>
      <div id="fx-ring"></div>
      <div id="fx-dot"></div>
    </>
  );
}

function StatTile({ icon, label, value, decimals = 0, suffix = '', color = '#60a5fa', delay = 0 }) {

/* ══════════════ AUTH ══════════════ */

function Auth({ onLogin }) {
  const [mode, setMode] = useState('login');
  const [step, setStep] = useState('creds');
  const [form, setForm] = useState({ username:'', email:'', password:'' });
  const [digits, setDigits] = useState(['','','','','','']);
  const [ctx, setCtx] = useState({ username:'', purpose:'', email:'' });
  const [err, setErr] = useState('');
  const [info, setInfo] = useState('');
  const [busy, setBusy] = useState(false);
  const [cooldown, setCooldown] = useState(0);
  const [tick, setTick] = useState(0);
  const [focus, setFocus] = useState(null);
  const [ok, setOk] = useState(false);
  const boxes = useRef([]);

  useEffect(() => {
    api('/account-exists').then(r => r.json()).then(d => {
      if (d.exists) setMode('login');
      else { setMode('signup'); setForm(f => ({ ...f, email: d.ownerEmail || '' })); }
    }).catch(() => {});
  }, []);

  useEffect(() => {
    if (cooldown <= 0) return;
    const t = setTimeout(() => setCooldown(c => c - 1), 1000);
    return () => clearTimeout(t);
  }, [cooldown]);

  const submitCreds = async (e) => {
    e.preventDefault(); setBusy(true); setErr(''); setInfo('');
    try {
      const r = await api(`/${mode}`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(form)
      });
      const d = await r.json();
      if (d.success && d.otpRequired) {
        setCtx({ username: form.username, purpose: d.purpose, email: d.email });
        setDigits(['','','','','','']); setStep('otp'); setCooldown(60);
        setInfo(`Code envoyé à ${d.email}`);
        setTimeout(() => boxes.current[0] && boxes.current[0].focus(), 120);
      } else if (d.success && d.user) onLogin(d.user);
      else setErr(d.error || 'Erreur');
    } catch { setErr('Serveur injoignable'); }
    finally { setBusy(false); }
  };

  const setDigit = (i, v) => {
    const c = v.replace(/\D/g, '');
    if (!c) { const n=[...digits]; n[i]=''; setDigits(n); return; }
    if (c.length > 1) {  // coller le code complet
      const n = [...digits];
      c.slice(0,6).split('').forEach((ch,k) => { if (i+k < 6) n[i+k] = ch; });
      setDigits(n);
      const last = Math.min(i + c.length, 5);
      boxes.current[last] && boxes.current[last].focus();
      return;
    }
    const n = [...digits]; n[i] = c; setDigits(n);
    if (i < 5) boxes.current[i+1] && boxes.current[i+1].focus();
  };

  const onKey = (i, e) => {
    if (e.key === 'Backspace' && !digits[i] && i > 0) boxes.current[i-1] && boxes.current[i-1].focus();
    if (e.key === 'ArrowLeft' && i > 0) boxes.current[i-1].focus();
    if (e.key === 'ArrowRight' && i < 5) boxes.current[i+1].focus();
  };

  const code = digits.join('');

  const submitOtp = async (e) => {
    if (e) e.preventDefault();
    if (code.length !== 6 || busy) return;
    setBusy(true); setErr('');
    try {
      const r = await api('/verify-otp', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username: ctx.username, code, purpose: ctx.purpose })
      });
      const d = await r.json();
      if (d.success) {
        setOk(true);
        setTimeout(() => onLogin(d.user), 1150);
      } else { setErr(d.error || 'Code invalide'); setDigits(['','','','','','']); boxes.current[0] && boxes.current[0].focus(); }
    } catch { setErr('Serveur injoignable'); }
    finally { setBusy(false); }
  };

  useEffect(() => { if (code.length === 6) submitOtp(); }, [code]);

  const resend = async () => {
    if (cooldown > 0) return;
    setErr('');
    try {
      const r = await api('/resend-otp', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ username: ctx.username, purpose: ctx.purpose })
      });
      const d = await r.json();
      if (d.success) { setInfo(`Nouveau code envoyé à ${d.email}`); setCooldown(60); }
      else setErr(d.error || 'Erreur');
    } catch { setErr('Serveur injoignable'); }
  };

  const pwd = form.password || '';
  const strength = (pwd.length >= 8 ? 1 : 0) + (/[A-Z]/.test(pwd) ? 1 : 0) +
                   (/[a-z]/.test(pwd) ? 1 : 0) + (/[0-9]/.test(pwd) ? 1 : 0) +
                   (/[^A-Za-z0-9]/.test(pwd) ? 1 : 0);

  return (
    <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:20 }}>
      <div style={{ width:'100%', maxWidth:440 }}>
        <Reveal>
          <Tilt max={6} scale={1}>
            <SpotlightCard className="panel glow-ring" spotlightColor="rgba(37,99,235,.25)">
              <div className="auth-card" style={{ padding:'30px 28px 26px', position:'relative', overflow:'hidden' }}>
                {ok && (
                  <div className="modal-veil" style={{ position:'absolute', inset:0, zIndex:9, display:'flex',
                    alignItems:'center', justifyContent:'center', background:'rgba(7,10,17,.9)',
                    backdropFilter:'blur(8px)', borderRadius:16 }}>
                    <div className="modal-card">
                      <Check3D label="Identité vérifiée" />
                    </div>
                  </div>
                )}

                <div style={{ textAlign:'center', marginBottom:24 }}>
                  <div className="auth-title" style={{ fontSize:38, fontWeight:800, letterSpacing:'-1px', color:'var(--txt)' }}>
                    5trade
                  </div>
                  <div style={{ marginTop:9, fontSize:12.5, color:'var(--txt-muted)' }}>
                    Plateforme d'analyse de trading assistée par IA
                  </div>
                </div>

                {step === 'creds' && <AuthMascot mode={mode} focus={focus} />}

                {step === 'creds' && (<div className="authpane" key={mode}>
                  <div className="nav" style={{ marginBottom:18 }}>
                    {['login','signup'].map(m => (
                      <button key={m} className={`nav-item ${mode===m?'on':''}`} type="button"
                        style={{ flex:1, justifyContent:'center' }}
                        onClick={()=>{setMode(m);setErr('');setInfo('')}}>
                        <i className={`fas ${m==='login'?'fa-right-to-bracket':'fa-user-plus'}`}></i>
                        {m==='login' ? 'Connexion' : 'Inscription'}
                      </button>
                    ))}
                  </div>

                  <form onSubmit={submitCreds}>
                    <label className="lbl">Nom d'utilisateur</label>
                    <input className="fld" value={form.username} autoFocus required
                      onFocus={()=>setFocus('username')} onBlur={()=>setFocus(null)}
                      onChange={e=>setForm({...form, username:e.target.value})} />

                    {mode==='signup' && (<>
                      <label className="lbl">Email de vérification</label>
                      <input className="fld" type="email" value={form.email}
                        onFocus={()=>setFocus('email')} onBlur={()=>setFocus(null)}
                        onChange={e=>setForm({...form, email:e.target.value})} />
                    </>)}

                    <label className="lbl">Mot de passe</label>
                    <input className="fld" type="password" value={form.password} required
                      onFocus={()=>setFocus('password')} onBlur={()=>setFocus(null)}
                      onChange={e=>setForm({...form, password:e.target.value})} />

                    {mode==='signup' && (<>
                      <div style={{ display:'flex', gap:5, marginTop:9 }}>
                        {[0,1,2,3,4].map(i => (
                          <span key={i} style={{
                            flex:1, height:4, borderRadius:9,
                            background: i < strength
                              ? (strength<=2 ? '#ef4444' : strength<=3 ? '#f59e0b' : '#10b981')
                              : 'rgba(27,36,51,.9)',
                            transition:'background .3s'
                          }}></span>
                        ))}
                      </div>
                      <p style={{ fontSize:11, color:'var(--dim)', marginTop:7, lineHeight:1.5 }}>
                        8 caractères minimum, avec majuscule, minuscule et chiffre. Un code de vérification sera envoyé par email.
                      </p>
                    </>)}

                    {err && <div style={{ background:'rgba(239,68,68,.12)', border:'1px solid rgba(239,68,68,.35)',
                      color:'#fca5a5', padding:11, borderRadius:11, marginTop:12, fontSize:13 }}>
                      <i className="fas fa-circle-exclamation" style={{marginRight:7}}></i>{err}</div>}
                    {info && <div style={{ background:'rgba(16,185,129,.1)', border:'1px solid rgba(16,185,129,.3)',
                      color:'#6ee7b7', padding:11, borderRadius:11, marginTop:12, fontSize:13 }}>
                      <i className="fas fa-circle-check" style={{marginRight:7}}></i>{info}</div>}

                    <button className="btn" type="submit" disabled={busy} style={{ width:'100%', marginTop:16 }}>
                      {busy ? <Spinner /> : <i className={`fas ${mode==='login'?'fa-right-to-bracket':'fa-user-plus'}`}></i>}
                      {mode==='login' ? 'Se connecter' : "S'inscrire"}
                    </button>
                  </form>
                </div>)}

                {step === 'otp' && (
                  <form onSubmit={submitOtp} className="authpane" key="otp">
                    <div style={{ textAlign:'center', marginBottom:16 }}>
                      <div className="floaty" style={{ display:'inline-flex', width:52, height:52, borderRadius:15,
                        alignItems:'center', justifyContent:'center', background:'rgba(37,99,235,.14)',
                        border:'1px solid rgba(37,99,235,.3)' }}>
                        <i className="fas fa-shield-halved" style={{ fontSize:21, color:'#60a5fa' }}></i>
                      </div>
                      <p style={{ color:'var(--muted)', fontSize:13, marginTop:11, lineHeight:1.6 }}>
                        Saisissez le code à 6 chiffres envoyé à<br/>
                        <b style={{ color:'var(--txt)' }}>{ctx.email}</b>
                      </p>
                    </div>

                    <div style={{ display:'flex', gap:8, justifyContent:'center' }}>
                      {digits.map((d,i) => (
                        <input key={i} ref={el => boxes.current[i] = el}
                          className={`otp-box otp-in ${d ? 'filled' : ''}`}
                          style={{ animationDelay: `${i * 55}ms` }}
                          value={d} inputMode="numeric" maxLength={6}
                          autoComplete={i===0 ? 'one-time-code' : 'off'}
                          onChange={e => setDigit(i, e.target.value)}
                          onKeyDown={e => onKey(i, e)}
                          onFocus={e => e.target.select()} />
                      ))}
                    </div>

                    {busy && (
                      <div style={{ display:'flex', justifyContent:'center', marginTop:16 }}>
                        <Loader3D size={40} label="Vérification du code…" />
                      </div>
                    )}

                    {err && <div className="shake" style={{ background:'rgba(239,68,68,.12)', border:'1px solid rgba(239,68,68,.35)',
                      color:'#fca5a5', padding:11, borderRadius:11, marginTop:12, fontSize:13, textAlign:'center' }}>{err}</div>}
                    {info && <div style={{ background:'rgba(16,185,129,.1)', border:'1px solid rgba(16,185,129,.3)',
                      color:'#6ee7b7', padding:11, borderRadius:11, marginTop:12, fontSize:13, textAlign:'center' }}>{info}</div>}

                    <button className="btn ok" type="submit" disabled={busy || code.length!==6}
                      style={{ width:'100%', marginTop:16 }}>
                      {busy ? <Spinner /> : <i className="fas fa-check"></i>}Valider
                    </button>

                    <div style={{ display:'flex', justifyContent:'space-between', marginTop:12 }}>
                      <button type="button" className="btn ghost sm"
                        onClick={()=>{setStep('creds');setErr('');setInfo('');setDigits(['','','','','','']);}}>
                        <i className="fas fa-arrow-left"></i>Retour
                      </button>
                      <button type="button" className="btn ghost sm" onClick={resend} disabled={cooldown>0}>
                        <i className="fas fa-rotate-right"></i>
                        {cooldown>0 ? `Renvoyer (${cooldown}s)` : 'Renvoyer le code'}
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </SpotlightCard>
          </Tilt>
        </Reveal>
        <p style={{ textAlign:'center', color:'var(--dim)', fontSize:11.5, marginTop:16 }}>
          <i className="fas fa-lock" style={{marginRight:6}}></i>
          Connexion sécurisée · session httpOnly · validation par code à usage unique
        </p>
      </div>
    </div>
  );
}

/* ══════════════ ANALYSE ══════════════ */

function Analyzer({ onDone }) {
  const [files, setFiles] = useState([]);
  const [tfs, setTfs] = useState('M5, M30, H1');
  const [pair, setPair] = useState('XAUUSD');
  const [notes, setNotes] = useState('');
  const [maxStrat, setMaxStrat] = useState(3);
  const [busy, setBusy] = useState(false);
  const [prog, setProg] = useState(0);
  const [hot, setHot] = useState(false);
  const [err, setErr] = useState('');
  const [phase, setPhase] = useState('');
  const timer = useRef(null);

  const add = (fl) => {
    const arr = Array.from(fl).filter(f => f.type.startsWith('image/'));
    setFiles(prev => [...prev, ...arr].slice(0, 4));
  };

  const stepLabels = ['Analyse des graphiques…','Recherche dans la base…','Combinaison des stratégies…','Génération du plan…'];

  const run = async () => {
    if (!files.length) { setErr('Ajoutez au moins une capture.'); return; }
    setBusy(true); setErr(''); setProg(8); setPhase(stepLabels[0]);
    let i = 0;
    timer.current = setInterval(() => {
      i = Math.min(i + 1, stepLabels.length - 1);
      setPhase(stepLabels[i]);
      setProg(p => Math.min(p + 22, 88));
    }, 2200);

    const fd = new FormData();
    files.forEach(f => fd.append('charts', f));
    fd.append('pair', pair); fd.append('timeframes', tfs);
    fd.append('notes', notes); fd.append('maxStrategies', String(maxStrat));

    try {
      const r = await api('/analyze', { method:'POST', body: fd });
      const d = await r.json();
      if (d.success) { setProg(100); setPhase('Terminé');
        setTimeout(() => { onDone(d); setBusy(false); setProg(0); setPhase(''); }, 420); }
      else { setErr(d.error || 'Erreur d\'analyse'); setBusy(false); setProg(0); }
    } catch (e) { setErr('Erreur: ' + e.message); setBusy(false); setProg(0); }
    finally { clearInterval(timer.current); }
  };

  return (
    <Reveal>
      <SpotlightCard className="panel" spotlightColor="rgba(37,99,235,.2)">
        <div style={{ padding:'22px 22px 24px' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:10, marginBottom:16 }}>
            <h2 style={{ fontSize:18, fontWeight:800, display:'flex', alignItems:'center', gap:10 }}>
              <i className="fas fa-images" style={{ color:'#60a5fa' }}></i>Analyse multi-timeframe
            </h2>
            <span className="badge" style={{ background:'rgba(37,99,235,.14)', color:'#8fb4ff' }}>
              <i className="fas fa-layer-group"></i>jusqu'à 4 captures
            </span>
          </div>

          <div style={{ display:'grid', gap:14, gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))' }}>
            <div>
              <label className="lbl" style={{marginTop:0}}>Paire</label>
              <input className="fld" value={pair} onChange={e=>setPair(e.target.value.toUpperCase())} />
            </div>
            <div>
              <label className="lbl" style={{marginTop:0}}>Timeframes (ordre des images)</label>
              <input className="fld" value={tfs} onChange={e=>setTfs(e.target.value)} placeholder="M5, M30, H1" />
            </div>
            <div>
              <label className="lbl" style={{marginTop:0}}>Stratégies à combiner</label>
              <select className="fld" aria-label="Nombre maximum de stratégies analysées" value={maxStrat} onChange={e=>setMaxStrat(e.target.value)}>
                {[2,3,4].map(n=> <option key={n} value={n}>{n}</option>)}
              </select>
            </div>
          </div>

          <label className="lbl">Contexte du trader (optionnel)</label>
          <textarea className="fld" rows="2" value={notes} onChange={e=>setNotes(e.target.value)}
            placeholder="Ex : scalp London sur XAUUSD, biais H1 haussier…" />

          <div className={`drop ${hot?'hot':''}`} style={{ marginTop:16 }}
            onClick={()=>document.getElementById('f-charts').click()}
            onDragOver={e=>{e.preventDefault();setHot(true)}}
            onDragLeave={()=>setHot(false)}
            onDrop={e=>{e.preventDefault();setHot(false);add(e.dataTransfer.files)}}>
            <input id="f-charts" type="file" accept="image/*" multiple style={{display:'none'}}
              onChange={e=>add(e.target.files)} />
            <div className="floaty" style={{ display:'inline-flex', width:52, height:52, borderRadius:15,
              alignItems:'center', justifyContent:'center', background:'rgba(37,99,235,.12)' }}>
              <i className="fas fa-cloud-arrow-up" style={{ fontSize:22, color:'#60a5fa' }}></i>
            </div>
            <p style={{ color:'var(--muted)', marginTop:10, fontSize:13.5, fontWeight:600 }}>
              Glissez vos captures TradingView ici
            </p>
            <p style={{ color:'var(--dim)', fontSize:11.5, marginTop:4 }}>ou cliquez · PNG / JPG · 4 max</p>
          </div>

          {files.length > 0 && (
            <div style={{ display:'grid', gap:12, gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))', marginTop:14 }}>
              {files.map((f,i) => (
                <div key={i} className="thumb">
                  <img src={URL.createObjectURL(f)} alt={f.name} />
                  <div style={{ position:'absolute', top:6, left:6, background:'rgba(7,10,17,.82)',
                    border:'1px solid var(--border)', borderRadius:8, padding:'2px 8px',
                    fontSize:10.5, fontWeight:700, color:'#8fb4ff' }}>
                    {(tfs.split(',')[i]||`#${i+1}`).trim()}
                  </div>
                  <button onClick={()=>setFiles(files.filter((_,j)=>j!==i))}
                    style={{ position:'absolute', top:6, right:6, width:24, height:24, borderRadius:8,
                      border:'1px solid rgba(239,68,68,.4)', background:'rgba(7,10,17,.82)',
                      color:'#f87171', cursor:'pointer', fontSize:11 }}>
                    <i className="fas fa-times"></i>
                  </button>
                </div>
              ))}
            </div>
          )}

          {busy && (
            <div style={{ marginTop:16 }}>
              <div className="bar"><i style={{ width:`${prog}%` }}></i></div>
              <div style={{ display:'flex', alignItems:'center', gap:10, marginTop:10, color:'var(--muted)', fontSize:12.5 }}>
                <Spinner size={15} color="#60a5fa" />
                <span>{phase}</span>
                <span style={{ marginLeft:'auto', color:'var(--dim)' }}>{prog}%</span>
              </div>
            </div>
          )}

          {err && <div style={{ background:'rgba(239,68,68,.12)', border:'1px solid rgba(239,68,68,.35)',
            color:'#fca5a5', padding:11, borderRadius:11, marginTop:12, fontSize:13 }}>{err}</div>}

          <button className="btn ok" style={{ width:'100%', marginTop:16, padding:'13px' }}
            onClick={run} disabled={busy || !files.length}>
            {busy ? <Spinner /> : <i className="fas fa-bolt"></i>}
            {busy ? 'Analyse en cours…' : "Lancer l'analyse"}
          </button>
        </div>
      </SpotlightCard>
    </Reveal>
  );
}

/* ══════════════ RÉSULTAT ══════════════ */

function Result({ result, onToJournal }) {
  const [open, setOpen] = useState(false);
  const { analysis, recommendations: rec } = result;

  // On ne devine jamais un prix : le plan est textuel (zone/déclencheur).
  // On reporte paire, sens, stratégies et le plan en notes ; le trader saisit
  // ses vrais niveaux dans le journal.
  const toJournal = () => onToJournal && onToJournal({
    pair: analysis.pair,
    direction: rec.action === 'SELL' ? 'SELL' : 'BUY',
    strategyIds: (rec.strategiesUsed || []).map(s => s.id).filter(Boolean),
    originAnalysisId: analysis.analysisId || null,
    notes: [
      `Plan ${rec.action} (${rec.confidence})`,
      rec.reason,
      rec.entry && rec.entry.zone ? `Zone : ${rec.entry.zone}` : null,
      rec.entry && rec.entry.trigger ? `Déclencheur : ${rec.entry.trigger}` : null
    ].filter(Boolean).join('\n')
  });

  const KV = ({ k, v }) => (
    <div style={{ display:'flex', justifyContent:'space-between', gap:12, padding:'6px 0',
      borderBottom:'1px solid rgba(27,36,51,.55)' }}>
      <span style={{ color:'var(--muted)', fontSize:12.5 }}>{k}</span>
      <span style={{ fontWeight:600, fontSize:13, textAlign:'right' }}>{v || '—'}</span>
    </div>
  );

  return (
    <div style={{ marginTop:18 }}>
      <Reveal>
        <SpotlightCard className="panel" spotlightColor="rgba(16,185,129,.18)">
          <div style={{ padding:'22px' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:12 }}>
              <h2 style={{ fontSize:19, fontWeight:800, display:'flex', alignItems:'center', gap:10 }}>
                <i className="fas fa-crosshairs" style={{ color:'#34d399' }}></i>
                Plan d'action — {analysis.pair}
              </h2>
              <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
                <ActionBadge action={rec.action} />
                <span className="badge" style={{ background:'rgba(148,163,184,.12)', color:'var(--muted)' }}>
                  <i className="fas fa-gauge-high"></i>{rec.confidence}
                </span>
                <span className="badge" style={{ background:'rgba(148,163,184,.12)', color:'var(--muted)' }}>
                  <i className="fas fa-image"></i>{analysis.imagesAnalyzed}
                </span>
                {onToJournal && (
                  <button className="btn sm" onClick={toJournal}
                    title="Reporter ce plan dans le journal de trades">
                    <i className="fas fa-receipt"></i>Enregistrer ce trade
                  </button>
                )}
              </div>
            </div>

            <div style={{ marginTop:14, padding:15, borderRadius:13,
              background:'linear-gradient(135deg,rgba(16,185,129,.11),rgba(37,99,235,.07))',
              borderLeft:'3px solid #10b981', fontSize:13.5, lineHeight:1.7 }}>
              {rec.reason}
              {rec.strategiesCombined && rec.strategiesCombined.length > 0 && (
                <div style={{ marginTop:9 }}>
                  <span style={{ fontSize:11.5, color:'var(--muted)', fontWeight:600 }}>COMBINAISON : </span>
                  {rec.strategiesCombined.map((s,i)=> <span key={i} className="tag">{s}</span>)}
                </div>
              )}
            </div>
          </div>
        </SpotlightCard>
      </Reveal>

      <div style={{ display:'grid', gap:14, gridTemplateColumns:'repeat(auto-fit,minmax(290px,1fr))', marginTop:14 }}>
        {[
          { t:'Entrée', ic:'fa-sign-in-alt', c:'#60a5fa', rows:[
              ['Zone', rec.entry?.zone], ['Déclencheur', rec.entry?.trigger], ['Timeframe', rec.entry?.timeframe] ] },
          { t:'Stop Loss & Risque', ic:'fa-shield-halved', c:'#f87171', rows:[
              ['Stop loss', rec.stopLoss?.level], ['Logique', rec.stopLoss?.reason],
              ['Risque / trade', rec.riskManagement?.riskPerTrade], ['R:R', rec.riskManagement?.rr] ] }
        ].map((box, idx) => (
          <Reveal key={box.t} delay={80 + idx*70}>
            <div className="panel" style={{ padding:18, height:'100%' }}>
              <h3 style={{ fontWeight:700, fontSize:14, marginBottom:10, display:'flex', alignItems:'center', gap:9 }}>
                <i className={`fas ${box.ic}`} style={{ color:box.c }}></i>{box.t}
              </h3>
              {box.rows.map(([k,v]) => <KV key={k} k={k} v={v} />)}
            </div>
          </Reveal>
        ))}
      </div>

      {rec.takeProfit && rec.takeProfit.length > 0 && (
        <Reveal delay={140}>
          <div className="panel" style={{ padding:18, marginTop:14 }}>
            <h3 style={{ fontWeight:700, fontSize:14, marginBottom:10, display:'flex', alignItems:'center', gap:9 }}>
              <i className="fas fa-bullseye" style={{ color:'#34d399' }}></i>Objectifs
            </h3>
            {rec.takeProfit.map((tp,i) => (
              <div key={i} style={{ display:'flex', gap:12, alignItems:'center', padding:'9px 12px',
                borderRadius:10, background:'rgba(16,185,129,.07)', marginBottom:7, border:'1px solid rgba(16,185,129,.18)' }}>
                <span className="badge" style={{ background:'rgba(16,185,129,.18)', color:'#34d399' }}>TP{i+1}</span>
                <b style={{ fontSize:13.5 }}>{tp.level}</b>
                <span style={{ color:'var(--muted)', fontSize:12.5 }}>{tp.reason}</span>
              </div>
            ))}
          </div>
        </Reveal>
      )}

      {rec.executionPlan && rec.executionPlan.length > 0 && (
        <Reveal delay={180}>
          <div className="panel" style={{ padding:18, marginTop:14 }}>
            <h3 style={{ fontWeight:700, fontSize:14, marginBottom:12, display:'flex', alignItems:'center', gap:9 }}>
              <i className="fas fa-list-ol" style={{ color:'#fbbf24' }}></i>Plan d'exécution
            </h3>
            {rec.executionPlan.map((s,i) => (
              <div key={i} style={{ display:'flex', gap:12, marginBottom:12 }}>
                <div style={{ flexShrink:0, width:28, height:28, borderRadius:9,
                  background:'rgba(245,158,11,.16)', border:'1px solid rgba(245,158,11,.35)',
                  color:'#fbbf24', fontWeight:800, fontSize:12.5, display:'flex',
                  alignItems:'center', justifyContent:'center' }}>{s.step}</div>
                <div style={{ flex:1, paddingBottom:8, borderBottom:'1px solid rgba(27,36,51,.5)' }}>
                  <div style={{ fontSize:12.5, fontWeight:700, color:'#fbbf24' }}>{s.when}</div>
                  <div style={{ fontSize:13.5, marginTop:3, lineHeight:1.6 }}>{s.do}</div>
                  {s.before && <div style={{ fontSize:12, color:'var(--muted)', marginTop:3 }}>
                    <i className="fas fa-arrow-left" style={{marginRight:5}}></i>Avant : {s.before}</div>}
                </div>
              </div>
            ))}
          </div>
        </Reveal>
      )}

      {rec.nextSteps && rec.nextSteps.length > 0 && (
        <Reveal delay={210}>
          <div className="panel" style={{ padding:18, marginTop:14 }}>
            <h3 style={{ fontWeight:700, fontSize:14, marginBottom:9, display:'flex', alignItems:'center', gap:9 }}>
              <i className="fas fa-forward" style={{ color:'#60a5fa' }}></i>Ensuite
            </h3>
            {rec.nextSteps.map((s,i) => (
              <div key={i} style={{ fontSize:13.5, color:'#c9d4e0', padding:'4px 0', display:'flex', gap:9 }}>
                <i className="fas fa-chevron-right" style={{ color:'#2563eb', fontSize:10, marginTop:6 }}></i>{s}
              </div>
            ))}
          </div>
        </Reveal>
      )}

      {rec.invalidation && (
        <Reveal delay={240}>
          <div style={{ marginTop:14, padding:14, borderRadius:12,
            background:'rgba(239,68,68,.1)', border:'1px solid rgba(239,68,68,.3)' }}>
            <b style={{ fontSize:13, color:'#f87171' }}>
              <i className="fas fa-ban" style={{marginRight:7}}></i>Invalidation</b>
            <span style={{ fontSize:13, color:'#fca5a5', marginLeft:7 }}>{rec.invalidation}</span>
          </div>
        </Reveal>
      )}

      <Reveal delay={260}>
        <div style={{ marginTop:16 }}>
          <button className="btn ghost sm" onClick={()=>setOpen(!open)}>
            <i className={`fas fa-chevron-${open?'up':'down'}`}></i>
            {open ? 'Masquer' : 'Voir'} l'analyse visuelle détaillée
          </button>
          {open && (
            <pre className="panel-soft" style={{ marginTop:11, padding:16, whiteSpace:'pre-wrap',
              wordBreak:'break-word', fontSize:13, lineHeight:1.65, color:'#c9d4e0',
              fontFamily:'ui-monospace,Consolas,monospace', maxHeight:400, overflow:'auto' }}>
              {analysis.visionAnalysis}
            </pre>
          )}
          <div style={{ marginTop:12, fontSize:11.5, color:'var(--dim)' }}>
            {rec.candidatesFound} stratégie(s) trouvée(s) · {rec.strategiesUsed?.length || 0} retenue(s) pour la combinaison
          </div>
        </div>
      </Reveal>
    </div>
  );
}
