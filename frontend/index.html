          <div style={{ marginTop:12, display:'grid', gap:10 }}>
            {signal.levels && Number.isFinite(signal.levels.entry) && (
              <div style={{ display:'flex', gap:18, flexWrap:'wrap', fontSize:13 }}>
                <span><span style={{ color:'var(--muted)' }}>Entrée </span><b>{fmt(signal.levels.entry)}</b></span>
                <span><span style={{ color:'var(--muted)' }}>Invalidation </span>
                  <b style={{ color:'#f87171' }}>{fmt(signal.levels.stop)}</b></span>
                <span><span style={{ color:'var(--muted)' }}>Objectif 1 </span>
                  <b style={{ color:'#34d399' }}>{fmt(signal.levels.target1)}</b></span>
                <span><span style={{ color:'var(--muted)' }}>Objectif 2 </span>
                  <b style={{ color:'#34d399' }}>{fmt(signal.levels.target2)}</b></span>
              </div>
            )}

            {/* Statut NEUTRE : pas de direction, donc pas d'entrée unique — mais
                les DEUX plans restent calculés et consultables. Les masquer
                contredisait le commentaire juste au-dessus. Chaque scénario dit
                son déclencheur : c'est le chiffre qui manquait pour agir. */}
            {!signal.levels && signal.levelsRaison && (
              <div style={{ fontSize:12.5, color:'var(--muted)', lineHeight:1.6 }}>
                <i className="fas fa-compass" style={{ marginRight:6, color:'#60a5fa' }}></i>
                {signal.levelsRaison}
                <div style={{ marginTop:6, display:'grid', gap:4 }}>
                  {[['achat', signal.scenarios && signal.scenarios.bullish],
                    ['vente', signal.scenarios && signal.scenarios.bearish]]
                    .filter(([, sc]) => sc && (sc.entry != null || sc.trigger))
                    .map(([nom, sc]) => (
                      <div key={nom} style={{ display:'flex', gap:14, flexWrap:'wrap' }}>
                        <span style={{ color:'#cbd5e1', minWidth:44 }}>{nom}</span>
                        <span><span style={{ color:'var(--muted)' }}>si </span>{sc.trigger || '—'}</span>
                        {sc.entry != null && (
                          <span><span style={{ color:'var(--muted)' }}>entrée </span><b>{fmt(sc.entry)}</b></span>
                        )}
                        {sc.stop != null && (
                          <span><span style={{ color:'var(--muted)' }}>inval. </span>
                            <b style={{ color:'#f87171' }}>{fmt(sc.stop)}</b></span>
                        )}
                        {sc.target1 != null && (
                          <span><span style={{ color:'var(--muted)' }}>obj </span>
                            <b style={{ color:'#34d399' }}>{fmt(sc.target1)}</b></span>
                        )}
                        {sc.target2 != null && (
                          <span><b style={{ color:'#34d399' }}>{fmt(sc.target2)}</b></span>
                        )}
                      </div>
                    ))}
                </div>
              </div>
            )}

            {signal.missing && signal.missing.length > 0 && (
              <div style={{ fontSize:12.5, color:'#fbbf24' }}>
                <i className="fas fa-circle-info" style={{ marginRight:6 }}></i>
                Pour confirmer : {signal.missing.join(' · ')}
              </div>
            )}

            {signal.biais && (
              <div style={{ fontSize:12.5, color:'var(--muted)' }}>
                <i className="fas fa-compass" style={{ marginRight:6,
                  color: signal.biais === 'haussier' ? '#34d399' : signal.biais === 'baissier' ? '#f87171' : 'var(--dim)' }}></i>
                Biais <b style={{ color: signal.biais === 'haussier' ? '#34d399'
                  : signal.biais === 'baissier' ? '#f87171' : '#e2e8f0' }}>{signal.biais}</b> — {signal.raisonBiais}
              </div>
            )}

            {signal.scenarios && (
              <div style={{ display:'grid', gap:8, gridTemplateColumns:'repeat(auto-fit,minmax(270px,1fr))' }}>
                {[['bullish', 'ACHAT', '#34d399', 'fa-arrow-trend-up'],
                  ['bearish', 'VENTE', '#f87171', 'fa-arrow-trend-down']].map(([k, lab, col, ico]) => {
                  const s = signal.scenarios[k];
                  if (!s) return null;
                  const privilegie = s.priorite === 'principale';
                  // La hiérarchie visuelle se fait par la bordure et le fond, PAS
                  // par l'opacité du texte : `opacity:.75` faisait tomber le
                  // contraste sous le minimum AA (6 éléments signalés par axe-core).
                  return (
                    <div key={k} style={{ border: privilegie ? `1px solid ${col}55` : '1px solid rgba(27,36,51,.7)',
                      background: privilegie ? `${col}0d` : 'transparent',
                      borderRadius:8, padding:'10px 12px' }}>
                      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between',
                        fontSize:12.5, color:col, fontWeight:600, marginBottom:6 }}>
                        <span><i className={`fas ${ico}`} style={{ marginRight:6 }}></i>Scénario {lab}</span>
                        <span className="tag" style={{ fontSize:10.5,
                          background: privilegie ? `${col}22` : 'rgba(148,163,184,.1)',
                          color: privilegie ? col : 'var(--dim)',
                          borderColor: privilegie ? `${col}55` : 'rgba(148,163,184,.25)' }}>
                          {privilegie ? 'privilégié' : 'alternatif'}
                        </span>
                      </div>
                      <div style={{ fontSize:12, color:'var(--muted)', lineHeight:1.6 }}>
                        <div><b style={{ color:'#cbd5e1' }}>Déclencheur</b> : {s.trigger}</div>
                        <div><b style={{ color:'#cbd5e1' }}>Contexte</b> : {s.context}</div>
                        <div style={{ marginTop:6 }}>
                          entrée <b style={{ color:'#e2e8f0' }}>{fmt(s.entry)}</b>
                          {' · '}invalidation <b style={{ color:'#f87171' }}>{fmt(s.stop)}</b>
                          {' · '}objectifs <b style={{ color:'#34d399' }}>{fmt(s.target1)}</b> / {fmt(s.target2)}
                        </div>
                        {s.objectifProche && (
                          <div style={{ marginTop:5, color:'#fbbf24', fontSize:11.5 }}>
                            <i className="fas fa-bullseye" style={{ marginRight:5 }}></i>
                            cible la plus proche : {s.objectifProche}
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {signal.checklist && (
              <div style={{ display:'flex', gap:8, flexWrap:'wrap', fontSize:12 }}>
                {signal.checklist.map(c => (
                  <span key={c.key} className="tag" title={c.detail}
                    style={{ background: c.ok ? 'rgba(34,211,138,.1)' : 'rgba(148,163,184,.08)',
                      borderColor: c.ok ? 'rgba(34,211,138,.35)' : 'rgba(148,163,184,.25)',
                      color: c.ok ? '#6ee7b7' : 'var(--muted)' }}>
                    <i className={`fas ${c.ok ? 'fa-circle-check' : 'fa-circle-minus'}`} style={{ marginRight:5 }}></i>
                    {c.label}
                  </span>
                ))}
              </div>
            )}
          </div>
        )}

        {/* ── STRUCTURE DU MARCHÉ ─────────────────────────────────────────
            Avant de lister des signaux, il faut savoir OÙ est le marché :
            tendance, dernière cassure de structure, position dans le range,
            zone la plus proche, liquidité, session. Sans ce cadre, un marteau
            est une forme ; avec ce cadre, c'est une décision. */}
        {signal && signal.carte && (() => {
          const k = signal.carte;
          const tend = k.tendance === 'bullish' ? 'haussière' : k.tendance === 'bearish' ? 'baissière' : 'range';
          const col = k.tendance === 'bullish' ? '#34d399' : k.tendance === 'bearish' ? '#f87171' : '#94a3b8';
          const ev = k.evenement;
          const pos = k.position;
          const z = k.zoneLaPlusProche;
          const liq = (k.liquidite || []).slice().sort((a, b) => (a.distanceAtr ?? 99) - (b.distanceAtr ?? 99))[0];
          const item = (label, valeur, couleur) => (
            <div style={{ display:'flex', flexDirection:'column', gap:2, minWidth:120 }}>
              <span style={{ fontSize:10.5, color:'var(--dim)', textTransform:'uppercase', letterSpacing:'.3px' }}>{label}</span>
              <span style={{ fontSize:12.5, color:couleur || '#e2e8f0', fontWeight:600 }}>{valeur}</span>
            </div>
          );
          return (
            <div className="panel" style={{ padding:'12px 16px', marginBottom:14 }}>
              <div style={{ display:'flex', alignItems:'center', gap:9, marginBottom:10, flexWrap:'wrap' }}>
                <i className="fas fa-sitemap" style={{ color:'#60a5fa' }}></i>
                <b style={{ fontSize:13, color:'#fff' }}>Structure du marché</b>
                {signal.synthese && signal.synthese.biais && (
                  <span className="badge" style={{ fontSize:10, background:'rgba(96,165,250,.13)', color:'#93c5fd' }}
                    title="Comptage des signaux retenus par sens">
                    biais {signal.synthese.biais}
                  </span>
                )}
                {k.session && k.session.killZone && k.session.killZone !== 'aucune en ce moment' && (
                  <span className="badge" style={{ fontSize:10, background:'rgba(245,158,11,.14)', color:'#fbbf24' }}
                    title={`Session : ${k.session.courante}`}>
                    kill zone {k.session.killZone}
                  </span>
                )}
              </div>
              <div style={{ display:'flex', gap:22, flexWrap:'wrap' }}>
                {item('Tendance', tend, col)}
                {ev ? item('Dernière cassure', `${ev.type} ${ev.sens === 'long' ? 'haussier' : 'baissier'} @ ${fmt(ev.niveau)}`,
                  ev.sens === 'long' ? '#34d399' : '#f87171')
                  : item('Dernière cassure', 'aucune (range)', 'var(--muted)')}
                {pos ? item('Position', `${pos.zone} · équilibre ${fmt(pos.equilibre)}`, pos.zone === 'premium' ? '#fca5a5' : '#6ee7b7') : null}
                {z ? item('Zone la plus proche', `${z.type} à ${z.distanceAtr} ATR${z.dansLaZone ? ' (dedans)' : ''}`,
                  z.sens === 'long' ? '#34d399' : '#f87171') : null}
                {liq ? item('Liquidité', `${liq.type} ${fmt(liq.prix)} (${liq.distanceAtr} ATR)`, '#fbbf24') : null}
                {Number.isFinite(k.atr) ? item('ATR', fmt(k.atr), 'var(--muted)') : null}
              </div>
            </div>
          );
        })()}

        {/* ── SIGNAUX DÉTECTÉS ────────────────────────────────────────────
            Le signal n'est pas UN : chaque stratégie sélectionnée rend son
            propre verdict, et chaque motif de bougie (doji, marteau, double
            bottom, trendline…) est un signal à part entière, avec SON sens et
            SES conditions. Les fondre en un seul verdict effaçait le travail de
            l'utilisateur : il choisissait cinq stratégies et n'en voyait aucune. */}
        {signal && Array.isArray(signal.signaux) && signal.signaux.length > 0 && (() => {
          const tous = signal.signaux;
          const rang = s => (s.status === 'confirme' ? 0 : s.status === 'surveiller' ? 1 : 2);
          const tries = [...tous].sort((a, b) =>
            rang(a) - rang(b) || (Number(b.force) || 0) - (Number(a.force) || 0));
          const actifs = tries.filter(s => rang(s) < 2);
          const montres = voirToutSignaux ? tries : actifs;
          const nbAchat = actifs.filter(s => s.sens === 'long').length;
          const nbVente = actifs.filter(s => s.sens === 'short').length;
          const nbStrat = tous.filter(s => s.source === 'strategie').length;
          const nbMotif = tous.length - nbStrat;
          const teinte = s => s.sens === 'long' ? '#34d399' : s.sens === 'short' ? '#f87171' : '#94a3b8';
          const fond = s => s.status === 'confirme'
            ? (s.sens === 'long' ? 'rgba(34,211,138,.07)' : s.sens === 'short' ? 'rgba(242,84,91,.07)' : 'rgba(148,163,184,.05)')
            : 'rgba(148,163,184,.035)';
          const bord = s => s.status === 'confirme'
            ? (s.sens === 'long' ? 'rgba(34,211,138,.34)' : s.sens === 'short' ? 'rgba(242,84,91,.34)' : 'rgba(148,163,184,.2)')
            : 'rgba(148,163,184,.12)';
          return (
            <div style={{ marginTop:16 }}>
              <div style={{ display:'flex', alignItems:'center', gap:9, flexWrap:'wrap', marginBottom:9 }}>
                <i className="fas fa-layer-group" style={{ color:'#60a5fa' }}></i>
                <b style={{ fontSize:13, color:'#fff' }}>Signaux détectés ({tous.length})</b>
                <span className="badge" style={{ fontSize:10, background:'rgba(167,139,250,.13)', color:'#c4b5fd' }}
                  title="Une entrée par stratégie que tu as sélectionnée.">
                  {nbStrat} stratégie(s)
                </span>
                <span className="badge" style={{ fontSize:10, background:'rgba(96,165,250,.13)', color:'#93c5fd' }}
                  title="Doji, marteau, avalement, double top/bottom, trendline, support/résistance, compression…">
                  {nbMotif} motif(s)
                </span>
                {nbAchat > 0 && <span className="badge" style={{ fontSize:10, border:'1px solid rgba(34,211,138,.45)', background:'transparent', color:'#34d399' }}>{nbAchat} achat</span>}
                {nbVente > 0 && <span className="badge" style={{ fontSize:10, border:'1px solid rgba(242,84,91,.45)', background:'transparent', color:'#f87171' }}>{nbVente} vente</span>}
                {/* Ce que le moteur a REFUSÉ doit se voir : un signal qui disparaît
                    en silence laisse croire qu'il n'a jamais existé. */}
                {signal.synthese && signal.synthese.ecartesFrais > 0 && (
                  <span className="badge" style={{ fontSize:10, background:'rgba(245,158,11,.14)', color:'#fbbf24' }}
                    title="Configurations refusées : le spread dépasse une part trop grande du risque.">
                    {signal.synthese.ecartesFrais} écarté(s) par les frais
                  </span>
                )}
                {signal.synthese && signal.synthese.ecartesModele > 0 && (
                  <span className="badge" style={{ fontSize:10, background:'rgba(167,139,250,.14)', color:'#c4b5fd' }}
                    title="Configurations refusées : le modèle leur attribue une espérance négative (ou sous le seuil).">
                    {signal.synthese.ecartesModele} écarté(s) par le modèle
                  </span>
                )}
                {signal.synthese && signal.synthese.ecartesRR > 0 && (
                  <span className="badge" style={{ fontSize:10, background:'rgba(56,189,248,.14)', color:'#7dd3fc' }}
                    title="Configurations refusées : objectif inutilisable, ou rapport risque/rendement sous le seuil demandé.">
                    {signal.synthese.ecartesRR} objectif(s) inutilisable(s)
                  </span>
                )}
                {signal.synthese && signal.synthese.modele && signal.synthese.modele.disponible && (
                  <span className="badge" style={{ fontSize:10, background:'rgba(34,211,138,.12)', color:'#34d399' }}
                    title={`Modèle v${signal.synthese.modele.version} · marchés ${(signal.synthese.modele.marches || []).join(', ')}`}>
                    modèle actif
                  </span>
                )}
                <span style={{ flex:'1 1 auto' }}></span>
                {tous.length > actifs.length && (
                  <button className="btn-ghost" onClick={() => setVoirToutSignaux(v => !v)}
                    style={{ fontSize:11.5, whiteSpace:'nowrap' }}>
                    {voirToutSignaux ? 'masquer les non-remplis' : `voir les ${tous.length - actifs.length} non-remplis`}
                  </button>
                )}
              </div>

              {montres.length === 0 && (
                <div style={{ fontSize:12.5, color:'var(--muted)', padding:'8px 10px', borderRadius:8, background:'rgba(148,163,184,.05)' }}>
                  <i className="fas fa-circle-minus" style={{ marginRight:7 }}></i>
                  Aucun signal exploitable sur cette bougie : {tous.length} concept(s) évalué(s), conditions non remplies.
                  C'est une information — le moteur ne force pas un signal quand le marché n'en donne pas.
                </div>
              )}

              <div style={{ display:'grid', gap:6 }}>
                {(() => {
                  // UNE configuration = une décision. Quinze concepts peuvent
                  // décrire le MÊME trade (même sens, même entrée, même stop) :
                  // les afficher quinze fois fait croire à quinze opportunités.
                  // On garde le premier (la liste est déjà triée par espérance) et
                  // on compte les autres — rien n'est caché, tout est replié.
                  const parCle = new Map();
                  for (const s of montres) {
                    const aDesNiveaux = Number.isFinite(s.entree) && Number.isFinite(s.stop);
                    const cle = aDesNiveaux ? `${s.sens}|${s.entree}|${s.stop}` : `id:${s.id}`;
                    if (!parCle.has(cle)) parCle.set(cle, { ...s, _memes: [] });
                    else parCle.get(cle)._memes.push(s.nom || s.id);
                  }
                  return [...parCle.values()];
                })().map(s => {
                  const ok = (s.conditions || []).filter(c => c.ok).length;
                  const tot = (s.conditions || []).length;
                  return (
                    <div key={s.id} style={{ padding:'8px 10px', borderRadius:8, background:fond(s), border:`1px solid ${bord(s)}` }}>
                      <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
                        <span className="badge" style={{ fontSize:9.5,
                          background: s.source === 'strategie' ? 'rgba(167,139,250,.15)' : s.source === 'structure' ? 'rgba(245,158,11,.15)' : 'rgba(96,165,250,.15)',
                          color: s.source === 'strategie' ? '#c4b5fd' : s.source === 'structure' ? '#fbbf24' : '#93c5fd' }}>
                          {s.source === 'strategie' ? 'STRATÉGIE' : s.source === 'structure' ? 'STRUCTURE' : 'MOTIF'}
                        </span>
                        <b style={{ fontSize:12.5, color:'#e2e8f0' }}>{s.nom}</b>
                        {s._memes && s._memes.length > 0 && (
                          <span className="badge" style={{ fontSize:9, background:'rgba(148,163,184,.12)', color:'var(--muted)' }}
                            title={`Même sens, même entrée, même stop : ${s._memes.join(' · ')}`}>
                            +{s._memes.length} concept(s) sur cette configuration
                          </span>
                        )}
                        <span className="badge" style={{ fontSize:9.5, background:'transparent', border:`1px solid ${teinte(s)}`, color:teinte(s) }}>
                          {s.sens === 'long' ? 'ACHAT' : s.sens === 'short' ? 'VENTE' : 'NEUTRE'}
                        </span>
                        <span style={{ fontSize:11, color: s.status === 'confirme' ? '#34d399' : s.status === 'surveiller' ? '#fbbf24' : 'var(--dim)' }}>
                          {s.status === 'confirme' ? 'confirmé' : s.status === 'surveiller' ? 'à surveiller' : 'non rempli'}
                        </span>
                        {tot > 0 && (
                          <span style={{ fontSize:11, color:'var(--dim)', title:'Conditions remplies sur conditions évaluées' }}>
                            {ok}/{tot} condition(s)
                          </span>
                        )}
                        <span style={{ flex:'1 1 auto' }}></span>
                        {/* Le R attendu du modèle, à côté de la force : c'est le
                            chiffre qui dit si le trade vaut le risque. Absent si
                            le marché n'est pas couvert par le modèle. */}
                        {s.modele && Number.isFinite(s.modele.rAttendu) && (
                          <span className="badge" style={{ fontSize:10,
                            background: s.modele.rAttendu > 0 ? 'rgba(34,211,138,.12)' : 'rgba(242,84,91,.12)',
                            color: s.modele.rAttendu > 0 ? '#34d399' : '#f87171' }}
                            title={`R attendu d'après le modèle v${s.modele.version} (${s.modele.marche}) — ce n'est pas une probabilité.`}>
                            {s.modele.rAttendu > 0 ? '+' : ''}{s.modele.rAttendu} R attendu
                          </span>
                        )}
                        {s.ecarteModele && (
                          <span className="badge" style={{ fontSize:10, background:'rgba(242,84,91,.14)', color:'#f87171' }}
                            title={s.raison || 'espérance négative selon le modèle'}>
                            écarté par le modèle
                          </span>
                        )}
                        {s.ecarteFrais && (
                          <span className="badge" style={{ fontSize:10, background:'rgba(245,158,11,.14)', color:'#fbbf24' }}
                            title={s.raison || 'coût trop élevé face au risque'}>
                            écarté par les frais
                          </span>
                        )}
                        {/* Marché absent du modèle : il faut le DIRE, sinon l'absence
                            de R attendu se lit comme une panne du modèle. */}
                        {s.modele && s.modele.horsPerimetre && (
                          <span className="badge" style={{ fontSize:10, background:'rgba(148,163,184,.12)', color:'#94a3b8' }}
                            title="Le modèle n'a pas été entraîné sur ce marché : aucune note, et aucun filtrage par le modèle.">
                            modèle : marché non couvert
                          </span>
                        )}
                        <span style={{ fontSize:11, color:'var(--muted)' }} title="Score interne de solidité, PAS une probabilité de réussite.">
                          force {Number(s.force || 0).toFixed(2)}
                        </span>
                      </div>

                      {tot > 0 && (
                        <div style={{ display:'flex', gap:'4px 14px', flexWrap:'wrap', marginTop:5, fontSize:11 }}>
                          {(s.conditions || []).map((c, i) => (
                            <span key={i} style={{ color: c.ok ? '#6ee7b7' : '#94a3b8' }}>
                              <i className={`fas ${c.ok ? 'fa-check' : 'fa-xmark'}`} style={{ fontSize:9, marginRight:4 }}></i>
                              {c.nom} = {String(c.valeur)}{c.seuil ? ` (seuil ${c.seuil})` : ''}
                            </span>
                          ))}
                        </div>
                      )}

                      {s.entree != null && (
                        <div style={{ marginTop:4, fontSize:11, color:'var(--muted)' }}>
                          entrée {fmt(s.entree)} · invalidation <span style={{ color:'#f87171' }}>{fmt(s.stop)}</span>
                          {(s.objectifs || []).length > 0 && <> · objectifs <span style={{ color:'#34d399' }}>{(s.objectifs || []).map(fmt).join(' / ')}</span></>}
                          {Number.isFinite(s.rr) && s.rr > 0 ? ` · G/R ${s.rr.toFixed(2)}` : ''}
                        </div>
                      )}

                      {s.structureContexte && (
                        <div style={{ marginTop:3, fontSize:10.5,
                          color: s.structureContexte.ajustement >= 0 ? '#6ee7b7' : '#fca5a5' }}
                          title={`Force ${s.forceDetail ? s.forceDetail.avant : '—'} ajustée de ${s.structureContexte.ajustement} par la structure`}>
                          <i className="fas fa-sitemap" style={{ fontSize:9, marginRight:5 }}></i>
                          {s.structureContexte.lecture}
                        </div>
                      )}

                      {s.status !== 'confirme' && s.raison && (
                        <div style={{ marginTop:3, fontSize:10.5, color:'var(--dim)' }}>{s.raison}</div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}

        {signal && signal.strategies && signal.strategies.length > 0 && (
          <div style={{ marginTop:12 }}>
            <div style={{ fontSize:12, color:'var(--muted)', marginBottom:6 }}>
              <i className="fas fa-book" style={{ marginRight:6 }}></i>Stratégies de ta base qui s'appliquent
            </div>
            <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
              {signal.strategies.map(s => (
                <span key={s.id} className="tag" title={`${s.type} · pertinence ${s.relevanceScore}`}>
                  {s.title.slice(0, 46)}
                </span>
              ))}
            </div>
          </div>
        )}

        {/* Alignement multi-timeframes : le signal n'est confirmé que si les
            unités de temps racontent la même histoire. C'est la vue « sniper ». */}
        {confluence && confluence.confluence && (
          <div className="panel" style={{ padding:'12px 14px', marginTop:12 }}>
            <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8, flexWrap:'wrap' }}>
              <b style={{ fontSize:13 }}>
                <i className="fas fa-crosshairs" style={{ marginRight:6, color:'#fbbf24' }}></i>
                Alignement des unités de temps
              </b>
              <span className="badge" style={{
                background: confluence.confluence.aligne ? 'rgba(16,185,129,.14)' : 'rgba(245,158,11,.14)',
                color: confluence.confluence.aligne ? '#34d399' : '#fbbf24' }}>
                {confluence.confluence.aligne ? 'ALIGNÉ' : 'NON ALIGNÉ'}
                {' · '}{confluence.confluence.nbAlignes}/{confluence.confluence.detail.length}
                {' · seuil '}{confluence.confluence.seuilAlignes}
              </span>
              {confluence.strategieAppliquee && (
                <span className="badge" style={{ background:'rgba(96,165,250,.1)', color:'#93c5fd' }}
                  title={confluence.strategieAppliquee.titre}>
                  {(confluence.strategieAppliquee.nombre || 1)} stratégie(s)
                  {confluence.strategieAppliquee.style ? ` · ${confluence.strategieAppliquee.style}` : ''}
                </span>
              )}
            </div>
            <div style={{ display:'grid', gap:6 }}>
              {confluence.confluence.detail.map(t => (
                <div key={t.tf} style={{ display:'flex', alignItems:'center', gap:10, fontSize:12.5 }}>
                  <b style={{ width:46 }}>{t.tf}</b>
                  <span style={{ width:70, color: t.tendance === 'bullish' ? '#34d399'
                    : t.tendance === 'bearish' ? '#f87171' : '#f59e0b' }}>{t.tendance}</span>
                  <span style={{ flex:1, color:'var(--muted)' }}>
                    {t.status}{t.direction && t.direction !== 'NEUTRE' ? ' · ' + t.direction : ''}
                    {t.regles && t.regles.length ? ' · ' + t.regles.join('+') : ''}
                  </span>
                  <i className={`fas ${t.confirme ? 'fa-circle-check' : 'fa-circle-minus'}`}
                    style={{ color: t.confirme ? '#34d399' : 'var(--muted)' }}></i>
                </div>
              ))}
            </div>
            <p style={{ margin:'8px 0 0', fontSize:11.5, color:'var(--dim)' }}>
              {confluence.confluence.motif} — le signal n'est confirmé que si ce seuil est atteint.
            </p>
          </div>
        )}

        {/* Cheminement par type de trade : prérequis, étapes, point de blocage.
            Un scalp, une chasse à la liquidité, un intraday et un swing n'ont ni
            les mêmes prérequis ni les mêmes étapes : les mélanger produit des
            signaux contradictoires. */}
        {playbooks && playbooks.length > 0 && (() => {
          const liste = typeTrade === 'auto' ? playbooks : playbooks.filter(p => p.type === typeTrade);
          if (!liste.length) return null;
          return (
            <div className="panel" style={{ padding:'12px 14px', marginTop:12 }}>
              <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:9, flexWrap:'wrap' }}>
                <b style={{ fontSize:13 }}>
                  <i className="fas fa-route" style={{ marginRight:6, color:'var(--ai-purple)' }}></i>
                  Cheminement du signal
                </b>
                <select className="fld" aria-label="Filtre des signaux affichés" style={{ width:'auto', margin:0, padding:'3px 8px', fontSize:12 }}
                  value={typeTrade} onChange={e=>setTypeTrade(e.target.value)}>
                  <option value="auto">Tous les types</option>
                  {playbooks.map(p => <option key={p.type} value={p.type}>{p.nom}</option>)}
                </select>
              </div>
              <div style={{ display:'grid', gap:10 }}>
                {liste.map(pb => (
                  <div key={pb.type} className="panel"
                    style={{ padding:'10px 12px', background:'rgba(7,10,17,.45)' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap', marginBottom:6 }}>
                      <b style={{ fontSize:12.5 }}>{pb.nom}</b>
                      <span className="badge" style={{
                        background: pb.pret ? 'rgba(16,185,129,.14)' : 'rgba(245,158,11,.12)',
                        color: pb.pret ? '#34d399' : '#fbbf24' }}>
                        {pb.pret ? 'signal valable' : pb.avancement}
                      </span>
                      <span style={{ fontSize:11.5, color:'var(--dim)' }}>
                        prérequis {pb.prerequisOk}/{pb.prerequisTotal}
                        {/* Le dénominateur est le nombre d'étapes OBLIGATOIRES, pas le
                            total : « étapes 4/5 » alors que les cinq sont franchies
                            (dont une facultative, non évaluable sur ce graphique) se
                            lisait comme un manque. Les facultatives sont nommées à part. */}
                        {' · '}étapes {pb.etapesOk}/{pb.etapesObligatoires ?? pb.etapesTotal}
                        {Array.isArray(pb.etapesFacultatives) && pb.etapesFacultatives.length > 0
                          ? ` · ${pb.etapesFacultatives.length} facultative(s)` : ''}
                      </span>
                      <span style={{ fontSize:11.5, color:'var(--dim)', marginLeft:'auto' }}>
                        {pb.duree} · {pb.timeframes.join('/')}
                      </span>
                    </div>
                    <div style={{ display:'grid', gap:3, fontSize:12 }}>
                      {pb.prerequis.map((p, i) => (
                        <div key={'p'+i} style={{ color: p.ok ? 'var(--muted)' : 'var(--dim)' }}>
                          <i className={`fas ${p.ok ? 'fa-circle-check' : 'fa-circle-xmark'}`}
                            style={{ marginRight:6, fontSize:10, color: p.ok ? '#34d399' : '#f87171' }}></i>
                          {p.label}{p.detail ? ` — ${p.detail}` : ''}
                        </div>
                      ))}
                      {pb.etapes.map(e => (
                        <div key={'e'+e.numero}
                          style={{ marginLeft:6, color: e.ok ? 'var(--muted)' : 'var(--dim)' }}>
                          <i className={`fas ${e.ok === null ? 'fa-ellipsis' : (e.ok ? 'fa-check' : 'fa-xmark')}`}
                            style={{ marginRight:6, fontSize:10,
                              color: e.ok === null ? '#64748b' : (e.ok ? '#34d399' : '#f87171') }}></i>
                          {e.numero}. {e.label}{e.detail ? ` — ${e.detail}` : ''}
                        </div>
                      ))}
                    </div>
                    {!pb.pret && pb.blocage && (
                      <div style={{ fontSize:11.5, color:'#fbbf24', marginTop:7 }}>
                        <i className="fas fa-arrow-right" style={{ marginRight:6 }}></i>
                        Pour avancer : {pb.blocage}{pb.detailBlocage ? ` (${pb.detailBlocage})` : ''}
                      </div>
                    )}
                    {pb.pret && (
                      <div style={{ fontSize:11.5, color:'#34d399', marginTop:7 }}>
                        <i className="fas fa-circle-check" style={{ marginRight:6 }}></i>
                        Tous les prérequis remplis et toutes les étapes franchies.
                      </div>
                    )}
                  </div>
                ))}
              </div>
              <p style={{ margin:'9px 0 0', fontSize:11.5, color:'var(--dim)' }}>
                Chaque étape est mesurée sur CE graphique. Un type n'est « valable » que si ses
                prérequis sont remplis et ses étapes franchies : c'est ce qui empêche un scalp
                et un swing de donner des signaux contradictoires.
              </p>
            </div>
          );
        })()}

        {/* Termes évalués : chaque terme vérifié sur CE graphique avec sa valeur.
            Le moteur expose son raisonnement au lieu de l'affirmer. */}
        {vocabulaire && vocabulaire.length > 0 && (
          <details className="panel" style={{ padding:'12px 14px', marginTop:12 }}>
            <summary style={{ cursor:'pointer', fontSize:13, fontWeight:600 }}>
              <i className="fas fa-list-check" style={{ marginRight:8, color:'#60a5fa' }}></i>
              Termes vérifiés sur ce graphique
              {' · '}{vocabulaire.filter(t => t.present).length}/{vocabulaire.length}
              <span style={{ marginLeft:8, fontWeight:400, fontSize:11.5, color:'var(--dim)' }}>
                l'analyse s'appuie sur ces mesures
              </span>
            </summary>
            <div style={{ display:'grid', gap:4, marginTop:10 }}>
              {vocabulaire.map(t => (
                <div key={t.sigle} style={{ display:'flex', gap:10, alignItems:'baseline',
                  fontSize:12.5, opacity: t.present ? 1 : 0.4 }}>
                  <i className={`fas ${t.present ? 'fa-circle-check' : 'fa-circle-minus'}`}
                    style={{ width:12, color: t.present ? '#34d399' : 'var(--muted)', fontSize:11 }}></i>
                  <b style={{ width:108, color: t.present ? '#93c5fd' : 'var(--muted)' }}>{t.sigle}</b>
                  <span style={{ flex:1, color: t.present ? 'var(--muted)' : 'var(--dim)' }}>
                    {t.valeur || t.lecture}
                  </span>
                </div>
              ))}
            </div>
            <p style={{ margin:'10px 0 0', fontSize:11.5, color:'var(--dim)' }}>
              Un terme grisé est absent de ce graphique : il ne pèse donc pas dans le verdict.
              Le détail de chacun est dans l'onglet Termes.
            </p>
          </details>
        )}

        {alerts.length > 0 && (
          <details style={{ marginTop:12 }}>
            <summary style={{ fontSize:12, color:'var(--muted)', cursor:'pointer' }}>
              Signaux confirmés reçus depuis l'ouverture ({alerts.length})
            </summary>
            <div style={{ marginTop:8, display:'grid', gap:6 }}>
              {alerts.map((a, i) => (
                <div key={i} style={{ display:'flex', justifyContent:'space-between', gap:10, fontSize:12.5 }}>
                  <span style={{ color: a.direction === 'BUY' ? '#6ee7b7' : '#fca5a5' }}>
                    {a.direction === 'BUY' ? 'ACHAT' : 'VENTE'} · force {a.forceNiveau || '—'} ({Number(a.strength || 0).toFixed(2)}/1)
                    · {(a.rules || []).map(r => r.name).join(' + ')}
                  </span>
                  <span style={{ color:'var(--dim)' }}>
                    {new Date(a.receivedAt).toLocaleTimeString('fr-FR')}
                  </span>
                </div>
              ))}
            </div>
          </details>
        )}
      </div>

      {err && (
        <div className="panel" style={{ padding:'12px 16px', marginBottom:16,
          borderColor:'rgba(239,68,68,.45)', color:'#fca5a5', fontSize:13 }}>
          <i className="fas fa-triangle-exclamation" style={{ marginRight:8 }}></i>{err}
        </div>
      )}

      <div className="panel" style={{ padding:18, marginBottom:16 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline',
          flexWrap:'wrap', gap:10, marginBottom:10 }}>
          <div style={{ display:'flex', alignItems:'baseline', gap:12 }}>
            <b style={{ fontSize:20, color:'#fff' }}>{fmt(last && last.c)}</b>
            {change !== null && (
              <span style={{ fontSize:13, color: change >= 0 ? '#34d399' : '#f87171' }}>
                <i className={`fas ${change >= 0 ? 'fa-caret-up' : 'fa-caret-down'}`} style={{marginRight:4}}></i>
                {change >= 0 ? '+' : ''}{change.toFixed(3)} %
              </span>
            )}
            {last && <span style={{ fontSize:12, color:'var(--muted)' }}>
              O {fmt(last.o)} · H {fmt(last.h)} · L {fmt(last.l)}
            </span>}
          </div>
          <span style={{ fontSize:12, color:'var(--muted)' }}>
            {report ? `${report.candles} bougies · ATR ${report.atr14}` : ''}
          </span>
        </div>
        {tick && (
          <div style={{ display:'flex', alignItems:'baseline', gap:12, margin:'4px 0 10px', flexWrap:'wrap' }}>
            <span style={{ fontSize:24, fontWeight:800, letterSpacing:'-0.5px',
              fontVariantNumeric:'tabular-nums',
              color: tick.prec === null || tick.prec === undefined ? '#e2e8f0'
                : tick.prix > tick.prec ? '#34d399'
                : tick.prix < tick.prec ? '#f87171' : '#e2e8f0' }}>
              {fmt(tick.prix)}
            </span>
            <span className="badge" style={{ background:'rgba(16,185,129,.12)', color:'#34d399' }}
              title="Ticks bruts reçus de la source, par seconde. C'est le marché qui bat, pas une bougie reconstruite.">
              <span className="dot-live"></span>{tickRate} tick/s
            </span>
            <span style={{ fontSize:11.5, color:'var(--dim)' }}>
              tick réel · {new Date(tick.t).toLocaleTimeString('fr-FR')} · source {tick.source}
            </span>
          </div>
        )}

        {vue === 'app' ? (
          <PriceChart candles={candles} report={report} levels={report ? report.levels : []} signal={signal}
            height={big ? (etroi ? 460 : 620) : (etroi ? 300 : 430)} symbol={symbol} tf={tf} />
        ) : (
          <TradingViewChart
            symbole={(meta.symbols.find(s => s.symbol === symbol && s.provider === provider) || {}).tv}
            tf={tf} height={big ? (etroi ? 460 : 620) : (etroi ? 300 : 430)} />
        )}
        <p style={{ margin:'8px 0 0', fontSize:11.5, color:'var(--dim)' }}>
          {vue === 'app'
            ? <>Vue app — molette = zoom, glisser = déplacer, double-clic = revenir au prix. Bougies en UTC.
                Zones vertes = support/OB/FVG haussier, rouges = baissier, orange = liquidité.
                Les niveaux tracés sont calculés par l'app.</>
            : <>Vue TradingView officielle — tous leurs outils (dessin, indicateurs, fuseaux, comparaison).
                Le signal et les niveaux de l'app restent affichés au-dessus.</>}
        </p>
      </div>

      {report && (
        <div style={{ display:'grid', gap:14, gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))', marginBottom:16 }}>
          <div className="panel" style={{ padding:18 }}>
            <h3 style={{ margin:'0 0 10px', fontSize:14 }}>
              <i className="fas fa-sitemap" style={{ color:'#60a5fa', marginRight:8 }}></i>Structure calculée
            </h3>
            <div style={{ fontSize:13, display:'grid', gap:7 }}>
              <div style={{ display:'flex', justifyContent:'space-between' }}>
                <span style={{ color:'var(--muted)' }}>Tendance</span>
                <b style={{ color: report.structure.trend === 'bullish' ? '#34d399'
                  : report.structure.trend === 'bearish' ? '#f87171' : '#f59e0b' }}>{report.structure.trend}</b>
              </div>
              {report.structure.event && (
                <div style={{ display:'flex', justifyContent:'space-between' }}>
                  <span style={{ color:'var(--muted)' }}>{report.structure.event.type}</span>
                  <b>{fmt(report.structure.event.level)} <span style={{color:'var(--dim)'}}>({report.structure.event.direction})</span></b>
                </div>
              )}
              {report.premiumDiscount && (<>
                <div style={{ display:'flex', justifyContent:'space-between' }}>
                  <span style={{ color:'var(--muted)' }}>Range</span>
                  <b>{fmt(report.premiumDiscount.low)} – {fmt(report.premiumDiscount.high)}</b>
                </div>
                <div style={{ display:'flex', justifyContent:'space-between' }}>
                  <span style={{ color:'var(--muted)' }}>Position</span>
                  <b style={{ color: report.premiumDiscount.position === 'premium' ? '#f87171' : '#34d399' }}>
                    {report.premiumDiscount.position}</b>
                </div>
              </>)}
              {report.sessions && (<>
                <div style={{ display:'flex', justifyContent:'space-between' }}>
                  <span style={{ color:'var(--muted)' }}>Session</span>
                  <b>{report.sessions.sessionCourante}</b>
                </div>
                <div style={{ display:'flex', justifyContent:'space-between' }}>
                  <span style={{ color:'var(--muted)' }}>Kill zone</span>
                  <b style={{ color: report.sessions.killZone === 'aucune en ce moment' ? 'var(--muted)' : '#fbbf24' }}>
                    {report.sessions.killZone}</b>
                </div>
              </>)}
              <div style={{ display:'flex', justifyContent:'space-between' }}>
                <span style={{ color:'var(--muted)' }}>Récent</span>
                <span style={{ fontSize:12 }}>
                  {(report.structure.recent || []).map(r => `${r.label} ${fmt(r.price)}`).join(' · ') || '—'}
                </span>
              </div>
              {(report.displacements || []).length > 0 && (
                <div style={{ display:'flex', justifyContent:'space-between' }}>
                  <span style={{ color:'var(--muted)' }}>Déplacements</span>
                  <span style={{ fontSize:12 }}>
                    {report.displacements.slice(-3).map(d => `${d.direction} ${d.multiple}×`).join(' · ')}
                  </span>
                </div>
              )}
            </div>
          </div>

          <div className="panel" style={{ padding:18 }}>
            <h3 style={{ margin:'0 0 10px', fontSize:14 }}>
              <i className="fas fa-wave-square" style={{ color:'#f472b6', marginRight:8 }}></i>
              Fibonacci &amp; périodes de référence
            </h3>
            <div style={{ fontSize:12.5, display:'grid', gap:6 }}>
              {report.fibLevels ? (
                <>
                  <div style={{ color:'var(--muted)', fontSize:12, marginBottom:2 }}>
                    dernier swing {report.fibLevels.sens}
                  </div>
                  {Object.entries(report.fibLevels.levels).map(([k, v]) => (
                    <div key={k} style={{ display:'flex', justifyContent:'space-between' }}>
                      <span style={{ color:'var(--muted)' }}>Retracement {k}</span>
                      <b>{fmt(v)}</b>
                    </div>
                  ))}
                </>
              ) : <span style={{ color:'var(--dim)' }}>Swing insuffisant</span>}
              {report.previousLevels && Object.entries(report.previousLevels).map(([k, v]) => (
                <div key={k} style={{ display:'flex', justifyContent:'space-between' }}>
                  <span style={{ color:'var(--muted)' }}>{k}</span><b>{fmt(v)}</b>
                </div>
              ))}
              {(report.breakers || []).length > 0 && (
                <div style={{ marginTop:6 }}>
                  <div style={{ color:'var(--muted)', fontSize:12, marginBottom:3 }}>Breakers (zones retournées)</div>
                  {report.breakers.slice(-3).map((b, i) => (
                    <div key={i} style={{ display:'flex', justifyContent:'space-between' }}>
                      <span style={{ color:'var(--muted)' }}>{b.type}</span>
                      <b>{fmt(b.low)}–{fmt(b.high)}</b>
                    </div>
                  ))}
                </div>
              )}
              {(report.sweeps || []).length > 0 && (
                <div style={{ marginTop:6 }}>
                  <div style={{ color:'var(--muted)', fontSize:12, marginBottom:3 }}>Balayages de liquidité</div>
                  {report.sweeps.slice(-3).map((s, i) => (
                    <div key={i} style={{ display:'flex', justifyContent:'space-between' }}>
                      <span style={{ color:'var(--muted)' }}>{s.type} ({s.depth} %)</span>
                      <b>{fmt(s.level)}</b>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div className="panel" style={{ padding:18 }}>
            <h3 style={{ margin:'0 0 10px', fontSize:14 }}>
              <i className="fas fa-ruler-combined" style={{ color:'var(--ai-purple)', marginRight:8 }}></i>
              {report.levels.length} niveaux exploitables
            </h3>
            {/* Zone défilante : sans tabIndex, elle est inatteignable au clavier
                (violation axe « scrollable-region-focusable »). */}
            <div tabIndex={0} role="region" aria-label="Liste des éléments du marché"
              style={{ maxHeight:210, overflowY:'auto', display:'grid', gap:6 }}>
              {report.levels.map((l, i) => (
                <div key={i} style={{ display:'flex', justifyContent:'space-between', gap:10, fontSize:12.5,
                  paddingBottom:5, borderBottom:'1px solid rgba(27,36,51,.5)' }}>
                  <span style={{ color:'var(--muted)' }}>{l.kind}</span>
                  <span>
                    <b>{fmt(l.price)}</b>
                    {l.zone && <span style={{ color:'var(--dim)', marginLeft:6 }}>{fmt(l.zone[0])}–{fmt(l.zone[1])}</span>}
                  </span>
                </div>
              ))}
            </div>
          </div>

          {report.inventory && (
            <div className="panel" style={{ padding:18, gridColumn:'1 / -1' }}>
              <h3 style={{ margin:'0 0 10px', fontSize:14 }}>
                <i className="fas fa-list-check" style={{ color:'#34d399', marginRight:8 }}></i>
                {report.inventory.total} éléments identifiés sur le graphique
              </h3>
              <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginBottom:12 }}>
                {Object.entries(report.inventory.parFamille).map(([k, v]) => (
                  <span key={k} className="tag" style={{ background:'rgba(96,165,250,.1)',
                    borderColor:'rgba(96,165,250,.3)', color:'#93c5fd' }}>
                    {k} · {v}
                  </span>
                ))}
              </div>
              <div tabIndex={0} role="region" aria-label="Inventaire par famille"
                style={{ display:'grid', gap:16, gridTemplateColumns:'repeat(auto-fit,minmax(250px,1fr))',
                  maxHeight:340, overflowY:'auto' }}>
                {Object.entries(report.inventory.items.reduce((acc, it) => {
                  (acc[it.famille] = acc[it.famille] || []).push(it); return acc;
                }, {})).map(([fam, list]) => (
                  <div key={fam}>
                    <div style={{ fontSize:12, color:'#93c5fd', fontWeight:600, marginBottom:6 }}>{fam}</div>
                    {list.map((it, i) => (
                      <div key={i} title={it.etat}
                        style={{ display:'flex', justifyContent:'space-between', gap:8, fontSize:12,
                          paddingBottom:4, borderBottom:'1px solid rgba(27,36,51,.4)' }}>
                        <span style={{ color:'var(--muted)' }}>{it.label}</span>
                        <span><b>{it.prix !== null ? fmt(it.prix) : '—'}</b></span>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
              <p style={{ margin:'10px 0 0', fontSize:11.5, color:'var(--dim)' }}>
                Chaque ligne est calculée depuis les bougies réelles. Survolez pour voir l'état
                (ouvert, valide, cassé, balayé…). Aucun élément deviné.
              </p>
            </div>
          )}
        </div>
      )}

      {result && <Result result={result} />}
    </>
  );
}

/* ══════════════ JOURNAL DE TRADES ══════════════ */

const TRADE_R = {
  win:  { label:'Gain',  color:'#10b981', bg:'rgba(16,185,129,.13)', icon:'fa-arrow-trend-up' },
  loss: { label:'Perte', color:'#ef4444', bg:'rgba(239,68,68,.13)',  icon:'fa-arrow-trend-down' },
  breakeven:{ label:'Neutre', color:'#94a3b8', bg:'rgba(148,163,184,.13)', icon:'fa-equals' }
};

function ResultBadge({ result, status }) {
  if (status === 'open') {
    return <span className="badge" style={{ background:'rgba(37,99,235,.14)', color:'#7cb2ff' }}>
      <i className="fas fa-hourglass-half"></i>en cours</span>;
  }
  const s = TRADE_R[result] || { label:result || '—', color:'#94a3b8', bg:'rgba(148,163,184,.13)', icon:'fa-circle' };
  return <span className="badge" style={{ background:s.bg, color:s.color }}>
    <i className={`fas ${s.icon}`}></i>{s.label}</span>;
}

// ── Journal des SIGNAUX (suivi automatique des issues) ──────────────────
// Différent du journal de trades : ici personne ne saisit rien. Chaque signal
// émis par le moteur est enregistré avec ses niveaux, puis réévalué sur les
// bougies suivantes. On voit donc si l'objectif 1 a été atteint, si le stop a
// été touché, ou si le prix est revenu au point d'entrée (BE).
function JournalSignauxPanel() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [filtre, setFiltre] = useState('tout');

  const px = p => (p === null || p === undefined || !Number.isFinite(Number(p)))
    ? '—' : (Number(p) >= 1000 ? Number(p).toFixed(2) : Number(p).toFixed(5));

  const charger = async () => {
    try {
      const r = await (await api('/journal-signaux?limite=150')).json();
      if (!r.success) throw new Error(r.error || 'lecture impossible');
      setData(r); setErr('');
    } catch (e) { setErr(e.message); }
  };
  useEffect(() => { charger(); }, []);

  const maj = async () => {
    setBusy(true);
    try {
      await api('/journal-signaux/maj', { method: 'POST' });
      await charger();
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };

  const st = data && data.stats;
  const libelle = { tp2: 'Objectif 2', tp1: 'Objectif 1', be: 'Retour entrée (BE)', sl: 'Stop touché', expire: 'Expiré', ouvert: 'En cours' };
  const teinte = { tp2: '#34d399', tp1: '#6ee7b7', be: '#fbbf24', sl: '#f87171', expire: '#94a3b8', ouvert: '#60a5fa' };

  const liste = (data && data.signaux ? data.signaux : [])
    .filter(s => filtre === 'tout' ? true : filtre === 'clos' ? s.resultat !== 'ouvert' : s.resultat === 'ouvert');

  return (
    <div className="panel" style={{ padding:'14px 18px', marginBottom:16 }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap', marginBottom:10 }}>
        <i className="fas fa-clipboard-check" style={{ color:'#60a5fa' }}></i>
        <b style={{ fontSize:13.5, color:'#fff' }}>Signaux suivis automatiquement</b>
        {st && (
          <>
            <span className="badge" style={{ fontSize:10, background:'rgba(96,165,250,.13)', color:'#93c5fd' }}>{st.total} enregistré(s)</span>
            <span className="badge" style={{ fontSize:10, background:'rgba(148,163,184,.12)', color:'var(--muted)' }}>{st.ouverts} en cours</span>
            {st.tauxReussite !== null && (
              <span className="badge" style={{ fontSize:10,
                background: st.tauxReussite >= 50 ? 'rgba(34,211,138,.14)' : 'rgba(245,158,11,.14)',
                color: st.tauxReussite >= 50 ? '#34d399' : '#fbbf24' }}>
                {st.tauxReussite} % de réussite
              </span>
            )}
            {st.rTotal !== 0 && (
              <span className="badge" style={{ fontSize:10, background:'transparent', border:'1px solid rgba(148,163,184,.3)', color: st.rTotal >= 0 ? '#34d399' : '#f87171' }}>
                {st.rTotal >= 0 ? '+' : ''}{st.rTotal} R cumulés
              </span>
            )}
          </>
        )}
        <span style={{ flex:'1 1 auto' }}></span>
        <select className="fld" aria-label="Filtrer les signaux par résultat" style={{ width:130, fontSize:12 }} value={filtre} onChange={e => setFiltre(e.target.value)}>
          <option value="tout">Tous</option>
          <option value="clos">Tranchés</option>
          <option value="ouvert">En cours</option>
        </select>
        <button className="btn ghost sm" onClick={maj} disabled={busy}>
          {busy ? <Spinner /> : <i className="fas fa-rotate"></i>} Actualiser
        </button>
      </div>

      {err && <div style={{ fontSize:12.5, color:'#fca5a5' }}>{err}</div>}

      {st && st.clos > 0 && (
        <div style={{ display:'flex', gap:14, flexWrap:'wrap', fontSize:12, color:'var(--muted)', marginBottom:10 }}>
          {['tp2','tp1','be','sl','expire'].map(k => (
            <span key={k} style={{ color: teinte[k] }}>
              <i className="fas fa-circle" style={{ fontSize:7, marginRight:5 }}></i>
              {libelle[k]} : {st.parResultat[k] || 0}
            </span>
          ))}
        </div>
      )}

      {liste.length === 0 && (
        <div style={{ fontSize:12.5, color:'var(--muted)' }}>
          Aucun signal enregistré pour l'instant. Laisse le flux « Direct » tourner : chaque signal retenu
          est enregistré avec ses niveaux, puis son issue est vérifiée automatiquement sur les bougies suivantes.
        </div>
      )}

      <div style={{ display:'grid', gap:5 }}>
        {liste.slice(0, 40).map(s => (
          <div key={s.cle} style={{ display:'flex', alignItems:'center', gap:9, flexWrap:'wrap',
            padding:'6px 9px', borderRadius:7, background:'rgba(148,163,184,.04)',
            border:`1px solid ${s.resultat === 'ouvert' ? 'rgba(96,165,250,.22)' : 'rgba(148,163,184,.13)'}` }}>
            <span className="badge" style={{ fontSize:9, background:'rgba(148,163,184,.12)', color:'var(--muted)' }}>
              {s.symbol} {s.timeframe}
            </span>
            <b style={{ fontSize:12, color:'#e2e8f0' }}>{(s.strategie || s.nom || '').slice(0, 40)}</b>
            <span className="badge" style={{ fontSize:9, background:'transparent', border:`1px solid ${s.sens === 'long' ? '#34d399' : '#f87171'}`, color: s.sens === 'long' ? '#34d399' : '#f87171' }}>
              {s.sens === 'long' ? 'ACHAT' : 'VENTE'}
            </span>
            <span style={{ fontSize:11, color: teinte[s.resultat] || 'var(--muted)', fontWeight:600 }}>
              {libelle[s.resultat] || s.resultat}
              {Number.isFinite(s.r) ? ` · ${s.r >= 0 ? '+' : ''}${s.r} R` : ''}
            </span>
            <span style={{ fontSize:10.5, color:'var(--dim)' }}>
              entrée {px(s.entree)} · stop {px(s.stop)} · obj. {(s.objectifs || []).map(px).join(' / ')}
            </span>
            {/* Ce que le modèle attendait et la taille qu'on aurait prise : sans
                ces deux chiffres, le journal est une liste de prédictions, pas un
                registre de paper-trading. */}
            {s.modele && Number.isFinite(s.modele.rAttendu) && (
              <span className="badge" style={{ fontSize:9,
                background: s.modele.rAttendu > 0 ? 'rgba(34,211,138,.12)' : 'rgba(242,84,91,.12)',
                color: s.modele.rAttendu > 0 ? '#34d399' : '#f87171' }}
                title={`R attendu au moment de l'émission (modèle v${s.modele.version})`}>
                annoncé {s.modele.rAttendu > 0 ? '+' : ''}{s.modele.rAttendu} R
                {Number.isFinite(s.r) ? ` · réel ${s.r > 0 ? '+' : ''}${s.r} R` : ''}
              </span>
            )}
            {s.risque && Number.isFinite(s.risque.taille) && (
              <span className="badge" style={{ fontSize:9, background:'rgba(96,165,250,.12)', color:'#93c5fd' }}
                title={`Taille calculée à l'émission : ${s.risque.risqueMontant} risqués (${s.risque.risquePct} % de ${s.risque.capital})`}>
                {/* 4 chiffres significatifs : « 0,1969 unité(s) », pas 0,19685039 */}
                {+Number(s.risque.taille).toPrecision(4)} unité(s) · {s.risque.risqueMontant} risqués
              </span>
            )}
            <span style={{ flex:'1 1 auto' }}></span>
            <span style={{ fontSize:10.5, color:'var(--dim)' }}>
              {s.bougiesSuivies ? `${s.bougiesSuivies} bougie(s) suivie(s)` : ''}
              {s.atteintTP1 && s.resultat === 'ouvert' ? ' · TP1 déjà touché' : ''}
            </span>
          </div>
        ))}
      </div>

      {st && Object.keys(st.parStrategie || {}).length > 0 && (
        <div style={{ marginTop:12 }}>
          <div style={{ fontSize:12, color:'var(--muted)', marginBottom:6 }}>
            <i className="fas fa-chart-simple" style={{ marginRight:6 }}></i>Résultats par stratégie / concept
          </div>
          <div style={{ display:'grid', gap:4 }}>
            {Object.entries(st.parStrategie)
              .sort((a, b) => b[1].total - a[1].total)
              .slice(0, 8)
              .map(([nom, v]) => {
                const taux = (v.gagnes + v.perdus) ? Math.round((v.gagnes / (v.gagnes + v.perdus)) * 100) : null;
                return (
                  <div key={nom} style={{ display:'flex', alignItems:'center', gap:10, fontSize:11.5 }}>
                    <span style={{ flex:'1 1 220px', color:'#e2e8f0' }}>{nom.slice(0, 52)}</span>
                    <span style={{ color:'#34d399' }}>{v.gagnes}✓</span>
                    <span style={{ color:'#f87171' }}>{v.perdus}✗</span>
                    {v.be > 0 && <span style={{ color:'#fbbf24' }}>{v.be} BE</span>}
                    <span style={{ color: (taux ?? 0) >= 50 ? '#34d399' : '#fbbf24', minWidth:44, textAlign:'right' }}>
                      {taux === null ? '—' : taux + ' %'}
                    </span>
                    <span style={{ color:'var(--dim)', minWidth:56, textAlign:'right' }}>
                      {v.r >= 0 ? '+' : ''}{v.r.toFixed(1)} R
                    </span>
                  </div>
                );
              })}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Backtest ────────────────────────────────────────────────────────────
// Le moteur rejoué sur l'historique, avec le MÊME code que le direct. C'est la
// seule réponse honnête à « est-ce que ça gagne ? » : le journal ne dit que ce
// qui s'est passé depuis qu'on l'écoute.
function BacktestPanel() {
  const [marches, setMarches] = useState([]);
  const [tf, setTf] = useState('5m');
  const [cles, setCles] = useState({ symbol: 'BTCUSDT', provider: 'binance' });
  const [pas, setPas] = useState(2);
  const [res, setRes] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  useEffect(() => {
    (async () => {
      try {
        const d = await (await api('/market/symbols')).json();
        if (!d.success) return;
        const s = d.symbols || [];
        setMarches(s);
        const crypto = s.find(x => x.provider === 'binance') || s[0];
        if (crypto) setCles({ symbol: crypto.symbol, provider: crypto.provider });
      } catch (e) {}
    })();
  }, []);

  const lancer = async () => {
    setBusy(true); setErr('');
    try {
      const q = `symbol=${encodeURIComponent(cles.symbol)}&tf=${tf}&provider=${encodeURIComponent(cles.provider)}&pas=${pas}&bougies=800&mode=auto`;
      const d = await (await api('/backtest?' + q)).json();
      if (!d.success) throw new Error(d.error || 'backtest impossible');
      setRes(d);
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };

  const r2 = x => (Number.isFinite(x) ? x.toFixed(2) : '—');
  const bloc = (titre, table) => {
    if (!table || !Object.keys(table).length) return null;
    return (
      <div style={{ marginTop:12 }}>
        <div style={{ fontSize:12, color:'var(--muted)', marginBottom:6 }}>{titre}</div>
        <div style={{ display:'grid', gap:3 }}>
          {Object.entries(table).sort((a, b) => b[1].total - a[1].total).slice(0, 8).map(([k, v]) => (
            <div key={k} style={{ display:'flex', alignItems:'center', gap:10, fontSize:11.5 }}>
              <span style={{ flex:'1 1 200px', color:'#e2e8f0' }}>{String(k).slice(0, 46)}</span>
              <span style={{ color:'var(--dim)', minWidth:52 }}>{v.total} prise(s)</span>
              <span style={{ color:'#34d399' }}>{v.gagnes}✓</span>
              <span style={{ color:'#f87171' }}>{v.perdus}✗</span>
              <span style={{ color:'#fbbf24', minWidth:30 }}>{v.be}BE</span>
              <span style={{ color: (v.tauxReussite ?? 0) >= 50 ? '#34d399' : '#fbbf24', minWidth:48, textAlign:'right' }}>
                {v.tauxReussite === null ? '—' : v.tauxReussite + ' %'}
              </span>
              <span style={{ color: v.r >= 0 ? '#34d399' : '#f87171', minWidth:60, textAlign:'right' }}>
                {v.r >= 0 ? '+' : ''}{r2(v.r)} R
              </span>
            </div>
          ))}
        </div>
      </div>
    );
  };

  return (
    <div className="panel" style={{ padding:'14px 18px', marginBottom:16 }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap', marginBottom:10 }}>
        <i className="fas fa-flask" style={{ color:'#a78bfa' }}></i>
        <b style={{ fontSize:13.5, color:'#fff' }}>Backtest — le moteur rejoué sur l'historique</b>
        <span className="badge" style={{ fontSize:10, background:'rgba(167,139,250,.14)', color:'#c4b5fd' }}>
          coût IA : 0
        </span>
      </div>
      <p style={{ margin:'0 0 12px', fontSize:12.5, color:'var(--muted)' }}>
        Chaque bougie est jugée avec le passé seulement, puis le signal est suivi jusqu'à son
        objectif, son invalidation ou son retour à l'entrée. Même code que le direct.
      </p>

      <div style={{ display:'flex', gap:9, alignItems:'center', flexWrap:'wrap' }}>
        <select className="fld" aria-label="Marché du backtest"
          style={{ width:'auto', maxWidth:'100%', fontSize:12 }}
          value={`${cles.provider}|${cles.symbol}`}
          onChange={e => {
            const [provider, symbol] = e.target.value.split('|');
            setCles({ provider, symbol });
          }}>
          {(marches.length ? marches : [{ symbol:'BTCUSDT', provider:'binance', label:'BTC / USD', providerLabel:'Binance' }])
            .map(m => (
              <option key={`${m.provider}|${m.symbol}`} value={`${m.provider}|${m.symbol}`}>
                {m.providerLabel ? `${m.providerLabel} · ` : ''}{m.label || m.symbol}
              </option>
            ))}
        </select>
        <select className="fld" aria-label="Unité de temps du backtest" style={{ width:90, fontSize:12 }} value={tf} onChange={e => setTf(e.target.value)}>
          {['1m','5m','15m','30m','1h','4h','1d'].map(t => <option key={t} value={t}>{t}</option>)}
        </select>
        <select className="fld" aria-label="Pas d'évaluation" style={{ width:150, fontSize:12 }} value={pas} onChange={e => setPas(Number(e.target.value))}>
          <option value={1}>pas 1 (précis, lent)</option>
          <option value={2}>pas 2 (recommandé)</option>
          <option value={3}>pas 3 (rapide)</option>
        </select>
        <button className="btn sm" onClick={lancer} disabled={busy}>
          {busy ? <Spinner /> : <i className="fas fa-play"></i>} Lancer le backtest
        </button>
        {res && (
          <span style={{ fontSize:11.5, color:'var(--dim)' }}>
            {res.bougies} bougies · {res.evaluations} évaluations · {res.ignoresDoublons} doublon(s) évité(s)
            {Number.isFinite(res.types) && ` · ${res.types} type(s) de configuration`}
            {Number.isFinite(res.concentrationTop3) && ` · top 3 = ${res.concentrationTop3} % des prises`}
          </span>
        )}
      </div>

      {/* Un backtest sur quelques dizaines de bougies n'est pas un résultat :
          c'est une anecdote. Le dire AU-DESSUS des chiffres, pas en bas de page —
          93 bougies en 15m, c'est 23 heures d'or, et « −0,13 R » n'y a aucun
          poids statistique. */}
      {res && res.fiable === false && (
        <div style={{ marginTop:10, fontSize:12, color:'#fbbf24', padding:'8px 10px', borderRadius:8,
          background:'rgba(245,158,11,.08)', border:'1px solid rgba(245,158,11,.25)' }}>
          <i className="fas fa-triangle-exclamation" style={{ marginRight:7 }}></i>
          <b>Échantillon trop court pour conclure.</b> {res.bougies} bougies
          {res.demandees ? ` (${res.demandees} demandées, le courtier en a rendu ${res.bougies})` : ''}
          {Number.isFinite(res.types) ? ` · ${res.types} type(s) de configuration` : ''} —
          les chiffres ci-dessous décrivent ces bougies, pas le marché. Choisis une unité
          de temps plus grande ou un historique plus long.
        </div>
      )}

      {err && <div style={{ marginTop:10, fontSize:12.5, color:'#fca5a5' }}>{err}</div>}

      {res && res.indisponible && (
        <div style={{ marginTop:10, fontSize:12.5, color:'var(--muted)' }}>{res.raison}</div>
      )}

      {res && !res.indisponible && (
        <>
          <div style={{ display:'flex', gap:22, flexWrap:'wrap', marginTop:14, fontSize:13 }}>
            <span><span style={{ color:'var(--muted)' }}>Prises </span><b>{res.clos}</b></span>
            <span><span style={{ color:'var(--muted)' }}>Objectifs </span><b style={{ color:'#34d399' }}>{res.gagnes}</b></span>
            <span><span style={{ color:'var(--muted)' }}>Stops </span><b style={{ color:'#f87171' }}>{res.perdus}</b></span>
            <span><span style={{ color:'var(--muted)' }}>BE </span><b style={{ color:'#fbbf24' }}>{res.be}</b></span>
            <span><span style={{ color:'var(--muted)' }}>Réussite </span>
              <b style={{ color: (res.tauxReussite ?? 0) >= 50 ? '#34d399' : '#fbbf24' }}>
                {res.tauxReussite === null ? '—' : res.tauxReussite + ' %'}
              </b></span>
            <span title="Gain/perte moyen par prise, en multiples du risque initial.">
              <span style={{ color:'var(--muted)' }}>Espérance </span>
              <b style={{ color: res.esperance >= 0 ? '#34d399' : '#f87171' }}>
                {res.esperance >= 0 ? '+' : ''}{r2(res.esperance)} R
              </b>
            </span>
            <span><span style={{ color:'var(--muted)' }}>Total </span>
              <b style={{ color: res.rTotal >= 0 ? '#34d399' : '#f87171' }}>
                {res.rTotal >= 0 ? '+' : ''}{r2(res.rTotal)} R
              </b></span>
            <span style={{ color:'var(--dim)' }}>{res.enCours} encore en cours (exclues)</span>
          </div>

          {/* Sur un indice synthétique, un résultat positif ne prouve rien.
              Deriv le dit lui-même : ces séries sortent d'un générateur
              aléatoire cryptographique. Afficher « +67 R » sans ce cadre
              reviendrait à vendre du bruit comme une compétence. */}
          {res.instrument && res.instrument.synthetique && (
            <div style={{ marginTop:8, fontSize:11.5, padding:'8px 10px', borderRadius:7,
              background:'rgba(239,68,68,.08)', border:'1px solid rgba(239,68,68,.35)', color:'#fca5a5' }}>
              <i className="fas fa-dice" style={{ marginRight:7 }}></i>
              <b>Instrument synthétique.</b> {res.instrument.avertissement}
            </div>
          )}

          {/* La convention de gestion partielle, dite à voix haute.
              Elle est DÉSACTIVÉE par défaut : mesuré sur 2 ans de données
              réelles, elle fabrique 71 % du résultat BTC et 139 % de celui de
              l'or — sans elle, l'or devient perdant. L'écart est chiffré ici
              pour que l'hypothèse reste visible, jamais implicite. */}
          {Number.isFinite(res.beTheorique) && res.beTheorique !== 0 && (
            <div style={{ marginTop:8, fontSize:11.5, padding:'7px 10px', borderRadius:7,
              background:'rgba(148,163,184,.06)', border:'1px solid rgba(148,163,184,.2)',
              color:'var(--dim)' }}>
              <i className="fas fa-scale-unbalanced" style={{ marginRight:7 }}></i>
              {res.gestionPartielle ? (
                <>
                  <b>Gestion partielle activée.</b> Un BE (objectif 1 touché puis retour à l'entrée)
                  est crédité de la moitié du premier objectif : <b>+{r2(res.beSomme)} R</b> sur
                  {' '}{res.be || 0} trade(s). Sans cette hypothèse : <b>{r2(res.rTotalSansGestion)} R</b>.
                </>
              ) : (
                <>
                  <b>Gestion partielle désactivée</b> — un BE vaut 0 R. Si on créditait la moitié du
                  premier objectif, le total passerait à <b>{r2(res.rTotal + res.beTheorique)} R</b>
                  {' '}(soit +{r2(res.beTheorique)} R d'hypothèse). Ce n'est pas une mesure : aucune
                  sortie partielle n'est simulée dans les frais.
                </>
              )}
            </div>
          )}

          {res.courbeR && res.courbeR.length > 1 && (() => {
            const max = Math.max(...res.courbeR.map(Math.abs), 1);
            const pts = res.courbeR;
            const pasE = Math.max(1, Math.floor(pts.length / 60));
            return (
              <div style={{ marginTop:12 }}>
                <div style={{ fontSize:12, color:'var(--muted)', marginBottom:5 }}>Capital cumulé en R</div>
                <div style={{ display:'flex', alignItems:'flex-end', gap:1, height:44,
                  padding:'0 2px', background:'rgba(148,163,184,.05)', borderRadius:6 }}>
                  {pts.filter((_, i) => i % pasE === 0 || i === pts.length - 1).map((v, i) => (
                    <span key={i} title={`${v} R`} style={{
                      flex:'1 1 auto', minWidth:1,
                      height: `${Math.max(2, (Math.abs(v) / max) * 100)}%`,
                      background: v >= 0 ? 'rgba(52,211,153,.75)' : 'rgba(248,113,113,.75)',
                      alignSelf: v >= 0 ? 'flex-end' : 'flex-start'
                    }}></span>
                  ))}
                </div>
                <div style={{ display:'flex', justifyContent:'space-between', fontSize:10.5, color:'var(--dim)', marginTop:3 }}>
                  <span>début</span><span>{r2(res.courbeR[res.courbeR.length - 1])} R</span><span>fin</span>
                </div>
              </div>
            );
          })()}

          {bloc('Par source', res.parSource)}
          {bloc('Par stratégie / concept', res.parStrategie)}
          <div style={{ marginTop:10, fontSize:11, color:'var(--dim)', lineHeight:1.6 }}>
            Une prise = un signal retenu au moment de son émission. Les signaux encore ouverts à la
            fin de l'historique sont exclus du taux. Le taux ne compte que les objectifs atteints
            face aux stops : les BE et les expirations sont affichés à part.
          </div>
        </>
      )}
    </div>
  );
}

// ── Actualités et calendrier économique ────────────────────────────────
// Le contexte extérieur du marché : ce qui se dit (dépêches) et ce qui tombe
// (annonces). Une annonce d'inflation décroche un stop en une bougie, et le
// graphique ne l'avait pas dit.
function NewsPage() {
  const [data, setData] = useState(null);
  const [marche, setMarche] = useState('tout');
  const [impact, setImpact] = useState(0);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  const charger = async (force = false) => {
    setBusy(true); setErr('');
    try {
      const q = `?marche=${marche}&impact=${impact}${force ? '&force=1' : ''}`;
      const d = await (await api('/news/panorama' + q)).json();
      if (!d.success) throw new Error(d.error || 'flux indisponible');
      setData(d);
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };
  useEffect(() => { charger(); }, [marche, impact]);

  const ilYA = ts => {
    if (!Number.isFinite(ts)) return '';
    const m = Math.round((Date.now() - ts) / 60000);
    if (m < 1) return "à l'instant";
    if (m < 60) return `il y a ${m} min`;
    const h = Math.round(m / 60);
    if (h < 24) return `il y a ${h} h`;
    return `il y a ${Math.round(h / 24)} j`;
  };
  const heure = ts => Number.isFinite(ts)
    ? new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
    : '—';
  const jourLisible = j => {
    const d = new Date(j + 'T12:00:00');
    const auj = new Date().toISOString().slice(0, 10);
    if (j === auj) return "Aujourd'hui";
    const demain = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
    if (j === demain) return 'Demain';
    return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'short' });
  };
  const teinteImpact = n => n === 3 ? '#f87171' : n === 2 ? '#fbbf24' : '#94a3b8';

  const articles = (data && data.articles) || [];
  const jours = (data && data.calendrier) || [];
  const prochaines = (data && data.prochaines24h) || [];
  const elevees = prochaines.filter(e => e.impactNiveau >= 3);

  return (
    <div style={{ display:'grid', gap:16 }}>
      <div className="panel" style={{ padding:'14px 18px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
          <i className="fas fa-newspaper" style={{ color:'#60a5fa' }}></i>
          <b style={{ fontSize:13.5, color:'#fff' }}>Actualités et calendrier économique</b>
          <span className="badge" style={{ fontSize:10, background:'rgba(52,211,153,.14)', color:'#34d399' }}
            title="Flux RSS publics et calendrier ForexFactory : aucune clé, aucun abonnement.">
            sources gratuites
          </span>
          {data && data.etat && data.etat.fluxAt && (
            <span style={{ fontSize:11, color:'var(--dim)' }}>dépêches {ilYA(data.etat.fluxAt)}</span>
          )}
          {data && data.etat && data.etat.degrade && (
            <span className="badge" style={{ fontSize:10, background:'rgba(245,158,11,.14)', color:'#fbbf24' }}>
              flux partiel — dernier état conservé
            </span>
          )}
          <span style={{ flex:'1 1 auto' }}></span>
          <button className="btn ghost sm" onClick={() => charger(true)} disabled={busy}>
            {busy ? <Spinner /> : <i className="fas fa-rotate"></i>} Actualiser
          </button>
        </div>

        {/* Ce qui peut décrocher un stop dans les 24 h : la seule ligne qui doit
            être vue avant d'ouvrir un trade. */}
        {prochaines.length > 0 && (
          <div style={{ marginTop:11, padding:'9px 12px', borderRadius:9,
            background: elevees.length ? 'rgba(248,113,113,.08)' : 'rgba(148,163,184,.06)',
            border: `1px solid ${elevees.length ? 'rgba(248,113,113,.35)' : 'rgba(148,163,184,.16)'}` }}>
            <div style={{ fontSize:12.5, color: elevees.length ? '#fca5a5' : 'var(--muted)' }}>
              <i className="fas fa-triangle-exclamation" style={{ marginRight:7 }}></i>
              <b>Dans les 24 h :</b> {prochaines.length} annonce(s)
              {elevees.length > 0 && <> dont <b style={{ color:'#f87171' }}>{elevees.length} à impact élevé</b></>}
            </div>
            <div style={{ display:'flex', gap:12, flexWrap:'wrap', marginTop:5, fontSize:11.5 }}>
              {prochaines.slice(0, 5).map((e, i) => (
                <span key={i} style={{ color:'var(--muted)' }}>
                  <span style={{ color: teinteImpact(e.impactNiveau) }}>●</span>{' '}
                  {heure(e.date)} · {e.devise || e.pays || '—'} · {e.titre.slice(0, 44)}
                </span>
              ))}
            </div>
          </div>
        )}

        <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginTop:11 }}>
          {[['tout','Tout'],['crypto','Crypto'],['forex','Forex'],['macro','Macro']].map(([id, label]) => (
            <button key={id} className="btn ghost sm" onClick={() => setMarche(id)}
              style={{ borderColor: marche === id ? 'rgba(96,165,250,.55)' : undefined,
                color: marche === id ? '#93c5fd' : undefined }}>
              {label}
            </button>
          ))}
          <span style={{ width:1, background:'rgba(148,163,184,.2)', margin:'0 4px' }}></span>
          {[[0,'Tout impact'],[2,'Moyen et +'],[3,'Élevé']].map(([n, label]) => (
            <button key={n} className="btn ghost sm" onClick={() => setImpact(n)}
              style={{ borderColor: impact === n ? 'rgba(245,158,11,.55)' : undefined,
                color: impact === n ? '#fbbf24' : undefined }}>
              {label}
            </button>
          ))}
        </div>

        {err && <div style={{ marginTop:10, fontSize:12.5, color:'#fca5a5' }}>{err}</div>}
      </div>

      <div style={{ display:'grid', gap:16, gridTemplateColumns:'repeat(auto-fit,minmax(340px,1fr))' }}>
        {/* Dépêches */}
        <div className="panel" style={{ padding:'14px 18px' }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>
            <i className="fas fa-rss" style={{ color:'#f59e0b' }}></i>
            <b style={{ fontSize:13, color:'#fff' }}>Dépêches ({articles.length})</b>
          </div>
          {articles.length === 0 && (
            <div style={{ fontSize:12.5, color:'var(--muted)' }}>
              Aucune dépêche pour ce filtre. Les flux publics répondent parfois lentement : réessaie dans un instant.
            </div>
          )}
          <div style={{ display:'grid', gap:7, maxHeight:620, overflowY:'auto' }}>
            {articles.map((a, i) => (
              <a key={i} href={a.lien} target="_blank" rel="noopener noreferrer"
                style={{ display:'block', padding:'8px 10px', borderRadius:8, textDecoration:'none',
                  background:'rgba(148,163,184,.04)', border:'1px solid rgba(148,163,184,.12)' }}>
                <div style={{ display:'flex', alignItems:'center', gap:7, flexWrap:'wrap', marginBottom:3 }}>
                  <span className="badge" style={{ fontSize:9, background:'rgba(148,163,184,.14)', color:'var(--muted)' }}>
                    {a.source}
                  </span>
                  <span style={{ fontSize:10.5, color:'var(--dim)' }}>{ilYA(a.date)}</span>
                  {a.impact && (
                    <span className="badge" style={{ fontSize:9, background:'rgba(245,158,11,.14)', color:'#fbbf24' }}
