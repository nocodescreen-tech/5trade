<!-- TradingView Lightweight Charts (Apache 2.0) : chandeliers professionnels,
     zoom et déplacement natifs. Servi localement pour rester utilisable hors ligne. -->
<script src="lightweight-charts.js?v=4.2.3"></script>
<script>
  // Filet de sécurité : si la bibliothèque locale n'a pas pu être chargée
  // (cache incomplet, fichier absent après un déploiement), on la prend sur un
  // CDN. Sans ce repli, l'écran affiche un cadre vide sans que rien n'explique
  // pourquoi — l'utilisateur croit alors que l'application est cassée.
  (function () {
    if (window.LightweightCharts) return;
    var sources = [
      // Le fichier LOCAL d'abord : l'application ne doit pas dépendre d'un CDN
      // pour afficher un graphique. Les deux suivants ne servent que si le
      // fichier local est absent ou corrompu.
      'lightweight-charts.js?v=4.2.3',
      'https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js',
      'https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js'
    ];
    var i = 0;
    (function charger() {
      if (window.LightweightCharts || i >= sources.length) {
        if (!window.LightweightCharts) console.error('Graphique : bibliothèque introuvable (local et CDN).');
        return;
      }
      var s = document.createElement('script');
      s.src = sources[i++];
      s.onload = function () {
        if (window.LightweightCharts) {
          // Prévient l'interface : le graphique peut maintenant se dessiner.
          window.dispatchEvent(new Event('lwc-pret'));
          console.info('Graphique : bibliothèque chargée depuis le CDN.');
        } else { charger(); }
      };
      s.onerror = charger;
      document.head.appendChild(s);
    })();
  })();
</script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer">
<!-- Font Awesome fallback local : si le CDN est bloqué, on charge la version minifiée servie par l'app -->
<script>
  (function(){
    // Ce script vit dans <head> : document.body n'existe pas encore au
    // premier passage. On attend le DOM, sinon appendChild lève un
    // TypeError qui tue tout le bloc et le repli ne se charge jamais.
    function verifier(){
    var link = document.querySelector('link[href*="font-awesome"]');
    if(!link || !document.body) return;
    var testIcon = document.createElement('i');
    testIcon.className = 'fas fa-chart-line';
    testIcon.style.cssText = 'position:absolute;left:-9999px';
    document.body.appendChild(testIcon);
    var loaded = window.getComputedStyle(testIcon).fontFamily.indexOf('Font Awesome') > -1;
    document.body.removeChild(testIcon);
    if(!loaded){
      var fallback = document.createElement('link');
      fallback.rel = 'stylesheet';
      fallback.href = 'font-awesome.min.css?v=6.5.1';
      fallback.crossOrigin = 'anonymous';
      document.head.appendChild(fallback);
      console.info('Font Awesome: CDN inaccessible, fallback local chargé');
    }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', verifier);
    } else {
      verifier();
    }
  })();
</script>

<style>
  :root{
    /* 5trade — tokens de design (theme sombre par defaut) */
    --bg:#070a11; --panel:#0e1420; --panel2:#111a29; --border:#1b2433;
    --txt:#e8eef7; --muted:#8a99ad;
    /* `--dim` était à #5d6b7d : 3,46:1 sur le fond, sous le minimum AA de 4,5:1
       pour du texte normal — et il sert sur des badges de 9 à 11 px. Relevé à
       #7d8b9f (5,3:1). Trouvé par l'audit axe-core, pas à l'œil. */
    --dim:#7d8b9f;
    --accent:#2563eb; --accent2:#3b82f6; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
    --radius:12px; --radius-sm:8px; --shadow:0 4px 18px -6px rgba(0,0,0,.55);
    --shadow-lg:0 12px 36px -10px rgba(0,0,0,.65);
    --focus-ring:0 0 0 3px rgba(37,99,235,.22);
    --transition:.18s cubic-bezier(.2,.8,.2,1);
  }
  /* Thème clair — bascule via [data-theme="light"] sur <html> */
  [data-theme="light"]{
    --bg:#f8fafc; --panel:#ffffff; --panel2:#f1f5f9; --border:#e2e8f0;
    --txt:#0f172a; --muted:#64748b;
    /* En clair, `--dim` à #94a3b8 donnait 2,56:1 sur blanc — pire que le thème
       sombre. Aligné sur `--muted` (4,76:1). */
    --dim:#64748b;
    --accent:#2563eb; --accent2:#3b82f6; --ok:#059669; --warn:#d97706; --bad:#dc2626;
    --shadow:0 4px 18px -6px rgba(15,23,42,.12);
    --shadow-lg:0 12px 36px -10px rgba(15,23,42,.18);
    --focus-ring:0 0 0 3px rgba(37,99,235,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  ::selection{background:rgba(37,99,235,.28)}
  /* Suppression: fond animé (aurora, grille, bruit), curseur animé, tilt 3D, glow-ring, floaty, gtext, gslide, signalPulse, bg-layer, fx-glow, fx-dot, fx-ring, fx-ripple — tout effet "vibe" */

  .shell{position:relative;z-index:1}

  /* Surfaces */
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .panel-soft{background:var(--panel2); border:1px solid var(--border); border-radius:var(--radius-sm)}

  /* Boutons — un seul style, propre, sans gradient */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent); color:#fff; border:none;
    padding:11px 20px; border-radius:var(--radius-sm); cursor:pointer;
    font-weight:600; font-size:14px; font-family:inherit;
    transition:background var(--transition), box-shadow var(--transition), transform var(--transition);
    box-shadow:var(--shadow);
  }
  .btn:hover:not(:disabled){background:var(--accent2); box-shadow:var(--shadow-lg); transform:translateY(-1px)}
  .btn:active:not(:disabled){transform:translateY(0) scale(.99)}
  .btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
  .btn.ghost{background:transparent; border:1px solid var(--border); color:var(--txt); box-shadow:none}
  .btn.ghost:hover:not(:disabled){background:rgba(37,99,235,.1); border-color:var(--accent); color:var(--accent)}
  .btn.ok{background:var(--ok)}
  .btn.ok:hover:not(:disabled){background:#059669}
  .btn.danger{background:var(--bad)}
  .btn.danger:hover:not(:disabled){background:#b91c1c}
  .btn.sm{padding:8px 14px; font-size:13px; border-radius:var(--radius-sm)}

  /* Champs */
  .fld{
    width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--bg); color:var(--txt); font-family:inherit; font-size:14px;
    transition:border-color var(--transition), box-shadow var(--transition);
  }
  .fld::placeholder{color:var(--dim)}
  .fld:focus{outline:none; border-color:var(--accent); box-shadow:var(--focus-ring)}
  textarea.fld{resize:vertical; line-height:1.55}
  label.lbl{display:block; font-size:11.5px; font-weight:600; color:var(--muted);
    letter-spacing:.04em; text-transform:uppercase; margin:12px 0 6px}

  /* Tags / badges */
  .tag{display:inline-block; font-size:11px; background:rgba(37,99,235,.12);
    /* Le texte était en `--accent` (#2563eb) : 2,4:1 sur le fond sombre, très
       en dessous du minimum AA. Bleu clair sur la même teinte de fond conserve
       l'identité visuelle et passe à 7,8:1. */
    color:#93c5fd; border:1px solid rgba(37,99,235,.35); padding:3px 9px;
    border-radius:999px; margin:2px 3px 2px 0}
  .badge{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700;
    letter-spacing:.03em; padding:4px 11px; border-radius:999px}

  /* Reveal (entree douce) */
  .reveal{opacity:0; transform:translateY(12px); transition:opacity .5s var(--transition), transform .5s var(--transition)}
  .reveal.in{opacity:1; transform:none}

  /* Loaders */
  .spin{display:inline-block; width:18px; height:18px; border-radius:50%;
    border:2.5px solid var(--border); border-top-color:var(--accent);
    animation:sp .75s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .skel{position:relative; overflow:hidden; background:var(--panel2); border-radius:var(--radius-sm)}
  .skel::after{content:''; position:absolute; inset:0; transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
    animation:shim 1.4s infinite}
  @keyframes shim{to{transform:translateX(100%)}}
  .dot-live{width:8px; height:8px; border-radius:50%; background:var(--ok); position:relative}
  .dot-live::after{content:''; position:absolute; inset:0; border-radius:50%; background:var(--ok);
    animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.7} 75%,100%{transform:scale(3.2);opacity:0}}

  /* Barre de progression */
  .bar{height:3px; background:var(--border); border-radius:9px; overflow:hidden}
  .bar > i{display:block; height:100%; background:var(--accent); border-radius:9px;
    transition:width .5s var(--transition)}

  /* Nav principale : une seule rangée, jamais de retour à la ligne.
     Les onglets se partagent la largeur ; sur écran étroit, défilement horizontal. */
  /* `.nav` sert à deux groupes d'onglets HORIZONTAUX (méthodes d'ajout de
     stratégie, navigation du tableau de bord). Sans rail, l'onglet actif
     ressemblait à un bouton isolé posé à côté des autres. Même langage que
     `.seg` : un seul contrôle, deux états. */
  .nav{display:flex; gap:4px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
    padding:4px; background:var(--bg); border:1px solid var(--border);
    border-radius:calc(var(--radius-sm) + 4px)}
  .nav::-webkit-scrollbar{display:none}
  .nav-item{flex:1 0 auto; justify-content:center; white-space:nowrap;
    display:inline-flex; align-items:center; gap:8px;
    padding:9px 16px; border-radius:var(--radius-sm); font-size:14px; font-weight:600;
    color:var(--muted); background:transparent; border:none; cursor:pointer;
    font-family:inherit; transition:color var(--transition), background var(--transition)}
  .nav-item:hover{color:var(--txt)}
  .nav-item.on{color:var(--txt); background:var(--panel2); box-shadow:inset 0 0 0 1px var(--border)}
  .nav-pill{display:none} /* plus de pilule animée */

  /* ── Contrôle segmenté (connexion / inscription) ──────────────────────
     `.nav-item` vient de la barre latérale verticale : réutilisé ici, il
     produisait une pilule décalée et un libellé qui flottait sans groupe.
     Deux choix exclusifs doivent former UN contrôle, avec un rail commun. */
  .seg{
    display:flex; gap:4px; padding:4px; background:var(--bg);
    border:1px solid var(--border); border-radius:calc(var(--radius-sm) + 4px);
  }
  .seg-item{
    flex:1; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:9px 12px; border:none; border-radius:var(--radius-sm); background:transparent;
    color:var(--muted); font-family:inherit; font-size:13.5px; font-weight:600;
    cursor:pointer; transition:background var(--transition), color var(--transition);
  }
  .seg-item:hover{color:var(--txt)}
  .seg-item.on{
    background:var(--panel2); color:var(--txt);
    box-shadow:inset 0 0 0 1px var(--border);
  }

  /* ── Focus clavier visible ────────────────────────────────────────────
     Il n'existait pas : la variable s'appelait `--focus:ring`, un nom
     impossible, donc le `box-shadow` était invalide et rien ne s'affichait.
     Sans anneau, la navigation au clavier est aveugle. */
  :where(button, a, input, select, textarea, [tabindex]):focus-visible{
    outline:2px solid var(--accent2); outline-offset:2px;
  }
  .fld:focus-visible{outline:none; border-color:var(--accent); box-shadow:var(--focus-ring)}

  /* ── Chiffres tabulaires ──────────────────────────────────────────────
     Dans un terminal de trading, les prix et les R doivent s'aligner en
     colonne. Sans ça, chaque ligne danse. */
  table, .num, .badge, .mono{font-variant-numeric:tabular-nums}

  /* Mascotte : le SVG porte width/height en dur (152x163) et occupait la
     première place de la hiérarchie sur un écran de connexion. */
  .mascot-wrap{max-width:92px; margin:0 auto 12px}
  .mascot-wrap svg{width:100%; height:auto; display:block}

  /* Mobile nav — 5 cibles, 44px min, safe-area */
  .mobile-nav{display:none}
  @media (max-width:820px){
    .nav{display:none}
    .mobile-nav{
      display:grid; grid-template-columns:repeat(5,1fr); gap:4px;
      position:fixed; bottom:0; left:0; right:0; z-index:60;
      padding:8px 10px calc(8px + env(safe-area-inset-bottom));
      background:rgba(7,10,17,.96); backdrop-filter:blur(16px);
      border-top:1px solid var(--border)
    }
    .mnav-btn{
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
      background:none; border:none; color:var(--muted); font-family:inherit;
      font-size:10.5px; font-weight:600; padding:8px 4px; border-radius:var(--radius-sm);
      cursor:pointer; min-height:44px;
      transition:color var(--transition), background var(--transition)
    }
    .mnav-btn.on{color:var(--accent); background:rgba(37,99,235,.12)}
    .mnav-btn:active{background:rgba(37,99,235,.2)}
    .pad-mobile{padding-bottom:88px}
    .mobile-plus{
      position:fixed; left:10px; right:10px;
      bottom:calc(86px + env(safe-area-inset-bottom)); z-index:61;
      display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:10px;
      border-radius:14px; background:rgba(14,20,32,.98);
      border:1px solid var(--border); box-shadow:var(--shadow-lg)
    }
    .mobile-plus button{
      display:flex; align-items:center; gap:9px; background:none; border:none;
      color:var(--muted); font-family:inherit; font-size:13px; font-weight:600;
      padding:12px; border-radius:var(--radius-sm); cursor:pointer; min-height:44px;
      transition:color var(--transition), background var(--transition)
    }
    .mobile-plus button.on,.mobile-plus button:active{
      color:var(--accent); background:rgba(37,99,235,.12)
    }
  }

  /* OTP */
  .otp-box{width:48px; height:58px; text-align:center; font-size:24px; font-weight:800;
    background:var(--bg); border:1.5px solid var(--border); border-radius:var(--radius-sm);
    color:var(--txt); transition:border-color var(--transition), box-shadow var(--transition),
    transform var(--transition); font-family:inherit}
  .otp-box:focus{outline:none; border-color:var(--accent); box-shadow:var(--focus-ring); transform:translateY(-2px)}
  .otp-box.filled{border-color:var(--ok)}

  /* ── Animations fluides (login / inscription / validation) ── */
  .otp-in{animation:otpIn .45s cubic-bezier(.2,.9,.25,1.2) both}
  @keyframes otpIn{from{opacity:0; transform:translateY(14px) scale(.9)} to{opacity:1; transform:none}}
  .modal-veil{animation:veilIn .3s ease both}
  @keyframes veilIn{from{opacity:0} to{opacity:1}}
  .modal-card{animation:modalIn .55s cubic-bezier(.2,1.15,.3,1) both}
  @keyframes modalIn{0%{opacity:0; transform:scale(.7) translateY(24px)}
    60%{opacity:1; transform:scale(1.04) translateY(-2px)} 100%{opacity:1; transform:none}}
  .auth-title{animation:titleIn .6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes titleIn{from{opacity:0; transform:translateY(-10px)} to{opacity:1; transform:none}}
  .shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)}
    50%{transform:translateX(6px)} 75%{transform:translateX(-3px)}}

  /* ── Fluidité globale : entrée de page, montée des panneaux, tactiles ── */
  html{scroll-behavior:smooth}
  .shell{animation:pageIn .5s ease both}
  @keyframes pageIn{from{opacity:0} to{opacity:1}}
  main.wrap .panel{animation:riseIn .4s cubic-bezier(.2,.9,.25,1) both}
  @keyframes riseIn{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
  .nav-item:active{transform:scale(.96)}
  .mnav-btn:active{transform:scale(.94)}

  /* ── Mascotte auth : flottement doux + bascule souple login/inscription ── */
  .mascot-bob{animation:mascotBob 5.5s ease-in-out infinite}
  @keyframes mascotBob{0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)}}
  .mascot{transition:transform .7s cubic-bezier(.3,1.2,.3,1); transform-origin:50% 100%}
  .mascot.login{transform:translateX(-10px) rotate(-2.5deg)}
  .mascot.signup{transform:translateX(10px) rotate(2.5deg)}
  .blink{animation:blink 4.8s ease-in-out infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.06)} 97.5%{transform:scaleY(1)}}

  /* ── Panneau auth : entrée fluide ── */
  .authpane{animation:paneIn .45s cubic-bezier(.2,.9,.25,1) both}
  @keyframes paneIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

  /* ── Coche de validation : apparition à ressort + anneau ── */
  .check3d{width:84px; height:84px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; background:var(--ok-bg, rgba(16,185,129,.12));
    border:2px solid var(--ok, #10b981); color:var(--ok, #10b981); font-size:32px;
    position:relative; animation:checkPop .6s cubic-bezier(.2,1.2,.3,1) both}
  @keyframes checkPop{0%{transform:scale(.4); opacity:0} 60%{transform:scale(1.06); opacity:1} 100%{transform:scale(1)}}
  .check-ring{position:absolute; inset:-7px; border-radius:50%;
    border:2px solid var(--ok, #10b981); opacity:.5; animation:ringPing 1.6s ease-out infinite}
  @keyframes ringPing{0%{transform:scale(.85); opacity:.6} 100%{transform:scale(1.25); opacity:0}}

  /* ── Divers : lissage tilt, flottement icônes, cube de chargement, halo carte ── */
  .tilt{transition:transform .25s ease-out; will-change:transform}
  .floaty{animation:floaty 5s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)}}
  .cube-wrap{perspective:300px; display:inline-block}
  .cube{width:100%; height:100%; position:relative; transform-style:preserve-3d; animation:cubeSpin 2.4s linear infinite}
  .cube b{position:absolute; inset:0; border:1.5px solid var(--accent); border-radius:3px; background:var(--accent-bg, rgba(37,99,235,.12))}
  .cube b:nth-child(1){transform:translateZ(var(--dim))}
  .cube b:nth-child(2){transform:rotateY(180deg) translateZ(var(--dim))}
  .cube b:nth-child(3){transform:rotateY(90deg) translateZ(var(--dim))}
  .cube b:nth-child(4){transform:rotateY(-90deg) translateZ(var(--dim))}
  .cube b:nth-child(5){transform:rotateX(90deg) translateZ(var(--dim))}
  .cube b:nth-child(6){transform:rotateX(-90deg) translateZ(var(--dim))}
  @keyframes cubeSpin{from{transform:rotateX(-20deg) rotateY(0)} to{transform:rotateX(-20deg) rotateY(360deg)}}
  .glow-ring{box-shadow:0 0 0 1px var(--border2, var(--border))}

  /* Drop zone */
  .drop{border:2px dashed var(--border); border-radius:var(--radius); padding:26px;
    text-align:center; cursor:pointer;
    transition:border-color var(--transition), background var(--transition), transform var(--transition);
    position:relative; overflow:hidden}
  .drop:hover{border-color:var(--accent); background:rgba(37,99,235,.05)}
  .drop.hot{border-color:var(--ok); background:rgba(16,185,129,.07); transform:scale(1.01)}

  .thumb{position:relative; border-radius:var(--radius-sm); overflow:hidden;
    border:1px solid var(--border); background:var(--bg); aspect-ratio:16/10}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s var(--transition)}
  .thumb:hover img{transform:scale(1.04)}

  /* Grilles utilitaires */
  .grid-auto{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(285px,1fr))}
  .stat-grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

  /* Scrollbar */
  ::-webkit-scrollbar{width:10px; height:10px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px; border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--dim)}

  /* Logo 5trade — SVG inline, s'adapte au thème via currentColor */
  .logo-5trade{display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--txt)}
  .logo-5trade svg{width:28px; height:28px; flex-shrink:0}
  .logo-5trade span{font-weight:800; font-size:1.15rem; letter-spacing:-.02em}
  .logo-5trade:hover span{color:var(--accent)}

  /* Icônes taille uniforme */
  .ico{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px}
  .ico-sm{width:16px; height:16px}
  .ico-lg{width:24px; height:24px}

  /* ── Responsive ── */
  .wrap{max-width:1280px;margin:0 auto;padding:22px 24px 48px;width:100%}
  .otp-box{width:min(48px,12.5vw);height:min(58px,15vw)}

  /* Grand écran : on exploite la largeur, tout tient sans scroll inutile */
  @media (min-width:1360px){
    .grid-auto{grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
    .stat-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
    .wrap{padding:26px 32px 56px}
  }
  @media (min-width:1700px){
    .wrap{max-width:1500px}
  }

  /* Tablette */
  @media (max-width:1024px){
    .wrap{padding:18px 18px 44px}
  }

  /* Mobile */
  @media (max-width:820px){
    .wrap{padding:14px 14px 96px}
    .panel{border-radius:14px}
    .stat-grid{grid-template-columns:1fr 1fr;gap:10px}
    .grid-auto{grid-template-columns:1fr;gap:12px}
    .card{padding:16px}
    header .hdr{padding:10px 14px !important}
    .auth-card{padding:22px 18px 20px !important}
    #fx-glow{display:none}
    .mascot{width:120px;height:129px}
    .btn{padding:12px 18px}
    .nav-item{padding:10px 14px}
    pre{font-size:12px !important}
  }
  @media (max-width:430px){
    .stat-grid{grid-template-columns:1fr}
    .otp-box{height:52px;font-size:20px}
  }

  /* ── Mobile : finitions haut de gamme ──
     L'essentiel est déjà là (barre au pouce, cibles de 44 px, safe-area). Ici on
     soigne ce qui se voit tout de suite sur un téléphone. */
  @media (max-width:820px){
    /* Un champ sous 16 px déclenche le zoom automatique d'iOS au focus : la page
       saute et l'utilisateur se retrouve décalé. 16 px est le seuil. */
    .fld, input, select, textarea{font-size:16px}
    /* Défilement fluide au doigt, sans entraîner toute la page. */
    .wrap{overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
    /* Panneaux : même ombre que sur ordinateur, proportionnée à l'écran. */
    .panel{box-shadow:0 12px 34px -20px rgba(0,0,0,.95)}
    /* Un tableau large défile au lieu de déformer la page. */
    table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
    /* Titres resserrés : sur un petit écran, chaque pixel vertical compte. */
    h2{font-size:19px!important}
    h3{font-size:15.5px!important}
    /* Le graphique garde une part raisonnable de l'écran. */
    .chart-mobile{height:300px!important}
    /* Boutons et champs : hauteur confortable au doigt, sans être énormes. */
    .btn{padding:10px 14px}
  }
  @media (max-width:430px){
    /* iPhone SE et similaires : encore un cran plus compact. */
    .panel{padding:12px!important}
    .chart-mobile{height:250px!important}
    .wrap{padding:10px 10px 92px}
  }
  /* Sur téléphone, la barre du bas peut recouvrir le dernier élément : on réserve
     toujours la place, même sur un écran sans encoche. */
  @media (max-width:820px){
    body{padding-bottom:env(safe-area-inset-bottom)}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
</style>
