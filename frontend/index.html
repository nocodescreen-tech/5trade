/* Graphique TradingView Lightweight Charts : chandeliers + volume + niveaux.
   Zoom, déplacement et échelle de prix sont natifs (molette, glisser-déposer). */
function PriceChart({ candles, levels, signal, height, symbol, tf }) {
  const boxRef = useRef(null);
  const api = useRef({ chart: null, series: null, vol: null, lines: [], full: true });
  // Suit le couple symbole/unité de temps : tout changement impose un
  // rechargement COMPLET de la série. Sans cela, un simple update() sur un
  // symbole dont l'échelle de prix est très différente (BTC ≈ 83 000 →
  // Volatility 75 ≈ 43 000) laissait un graphique vide.
  const keyRef = useRef(null);
  // Sans la bibliothèque, mieux vaut le dire que laisser un cadre vide.
  const [libMissing, setLibMissing] = useState(!window.LightweightCharts);
  // La bibliothèque peut arriver APRÈS le premier rendu (repli CDN) : on guette
  // sa disponibilité pour dessiner dès qu'elle est là, au lieu de rester sur un
  // cadre vide jusqu'au prochain rechargement de page.
  const [libPrete, setLibPrete] = useState(!!window.LightweightCharts);

  useEffect(() => {
    if (window.LightweightCharts) { setLibPrete(true); setLibMissing(false); return; }
    const reveil = () => {
      if (window.LightweightCharts) { setLibPrete(true); setLibMissing(false); }
    };
    window.addEventListener('lwc-pret', reveil);
    const veille = setInterval(() => {
      if (window.LightweightCharts) { setLibPrete(true); setLibMissing(false); clearInterval(veille); }
    }, 500);
    return () => { window.removeEventListener('lwc-pret', reveil); clearInterval(veille); };
  }, []);

  useEffect(() => {
    const box = boxRef.current;
    const LC = window.LightweightCharts;
    if (!box || !LC) { setLibMissing(true); return; }
    setLibMissing(false);
    const chart = LC.createChart(box, {
      layout: { background: { type: 'solid', color: '#080c14' }, textColor: '#cbd5e1', fontSize: 11,
        fontFamily: 'ui-sans-serif, system-ui, sans-serif' },
      grid: { vertLines: { color: 'rgba(148,163,184,.07)' }, horzLines: { color: 'rgba(148,163,184,.07)' } },
      crosshair: {
        mode: LC.CrosshairMode.Normal,
        vertLine: { color: 'rgba(148,163,184,.55)', width: 1, style: LC.LineStyle.Dashed, labelBackgroundColor: '#1e293b' },
        horzLine: { color: 'rgba(148,163,184,.55)', width: 1, style: LC.LineStyle.Dashed, labelBackgroundColor: '#1e293b' }
      },
      rightPriceScale: { borderColor: 'rgba(148,163,184,.18)', scaleMargins: { top: 0.08, bottom: 0.24 } },
      timeScale: { borderColor: 'rgba(148,163,184,.18)', timeVisible: true, secondsVisible: false, rightOffset: 4 },
      localization: { locale: 'fr-FR' },
      handleScroll: true, handleScale: true
    });
    const series = chart.addCandlestickSeries({
      upColor: '#22d38a', downColor: '#f2545b',
      borderUpColor: '#22d38a', borderDownColor: '#f2545b',
      wickUpColor: '#22d38a', wickDownColor: '#f2545b',
      priceLineVisible: true, priceLineColor: 'rgba(255,255,255,.4)', priceLineStyle: LC.LineStyle.Dashed
    });
    const vol = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol',
      lastValueVisible: false, priceLineVisible: false });
    chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
    api.current = { chart, series, vol, lines: [], full: true };

    // La taille ne doit jamais rester à zéro : dans un onglet en arrière-plan
    // ou un panneau pas encore disposé, clientWidth vaut 0 et le graphique
    // resterait invisible. On remesure à plusieurs moments.
    const fit = () => {
      const w = box.clientWidth, h = box.clientHeight;
      if (w > 0 && h > 0) chart.applyOptions({ width: w, height: h });
    };
    fit();
    const ro = new ResizeObserver(fit);
    ro.observe(box);
    const t1 = setTimeout(fit, 250);
    const t2 = setTimeout(fit, 1200);
    return () => {
      clearTimeout(t1); clearTimeout(t2); ro.disconnect(); chart.remove();
      api.current = { chart: null, series: null, vol: null, lines: [], full: true };
    };
  }, [libPrete]);

  // setData au premier chargement (ou après changement de symbole/timeframe),
  // puis update du seul dernier point : c'est ce qui rend le direct fluide.
  useEffect(() => {
    // Toute erreur de dessin est rattrapée ici : elle ne doit jamais remonter à
    // React et faire disparaître toute l'interface (erreur vécue).
    try {
    const { chart, series, vol } = api.current;
    if (!series || !candles || !candles.length) return;
    const sigKey = `${symbol}|${tf}`;
    if (keyRef.current !== sigKey) { api.current.full = true; keyRef.current = sigKey; }
    const toTime = c => Math.floor(c.t / 1000);
    const point = c => ({ time: toTime(c), open: c.o, high: c.h, low: c.l, close: c.c });
    const bar = c => ({ time: toTime(c), value: c.v || 0, color: c.c >= c.o ? 'rgba(34,211,138,.32)' : 'rgba(242,84,91,.32)' });
    if (api.current.full) {
      series.setData(candles.map(point));
      if (vol) vol.setData(candles.map(bar));
      api.current.chart.timeScale().fitContent();
      api.current.full = false;
      api.current.lastTime = toTime(candles[candles.length - 1]);
    } else {
      const last = candles[candles.length - 1];
      const t = toTime(last);
      // PIÈGE (erreur vécue) : après une reconnexion ou un rechargement, la
      // bougie reçue peut être PLUS ANCIENNE que le dernier point affiché. Un
      // update() lève alors « Cannot update oldest data » — une exception que
      // React ne rattrape pas, et toute l'application tombe. On recharge donc
      // la série complète dans ce cas.
      if (api.current.lastTime !== undefined && t < api.current.lastTime) {
        series.setData(candles.map(point));
        if (vol) vol.setData(candles.map(bar));
      } else {
        series.update(point(last));
        if (vol) vol.update(bar(last));
      }
      api.current.lastTime = t;
    }
    } catch (e) {
      // On repart d'un rechargement complet au prochain rendu.
      api.current.full = true;
    }
  }, [candles, symbol, tf]);

  // (Le rechargement complet au changement de symbole/timeframe est géré
  //  dans l'effet des données via keyRef — un effet séparé s'exécutait dans
  //  le mauvais ordre et laissait la série précédente à l'écran.)

  // Niveaux calculés (FVG, order blocks, swings, liquidité) en lignes de prix
  useEffect(() => {
    const { series } = api.current;
    if (!series) return;
    api.current.lines.forEach(l => { try { series.removePriceLine(l); } catch (e) {} });
    api.current.lines = (levels || []).filter(l => Number.isFinite(l.price)).map(l => {
      const color = l.side === 'support' ? 'rgba(34,211,138,.8)'
        : l.side === 'resistance' ? 'rgba(242,84,91,.8)'
        : l.side === 'liquidité' ? 'rgba(245,158,11,.75)' : 'rgba(96,165,250,.75)';
      return series.createPriceLine({ price: l.price, color, lineWidth: 1,
        lineStyle: window.LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: l.kind });
    });
  }, [levels]);

  // Repère du signal sur la bougie concernée
  useEffect(() => {
    const { series } = api.current;
    if (!series || !signal || !signal.at) return;
    const buy = signal.direction === 'BUY';
    try {
      series.setMarkers([{ time: Math.floor(signal.at / 1000),
        position: buy ? 'belowBar' : 'aboveBar',
        color: signal.status === 'confirme' ? (buy ? '#22d38a' : '#f2545b') : '#64748b',
        shape: buy ? 'arrowUp' : 'arrowDown',
        text: buy ? 'ACHAT' : 'VENTE' }]);
    } catch (e) {}
  }, [signal]);

  const reset = () => { try { api.current.chart.timeScale().fitContent(); } catch (e) {} };

  return (
    <div style={{ position: 'relative' }}>
      <div ref={boxRef} style={{ width: '100%', height, borderRadius: 10, overflow: 'hidden' }} />
      {libMissing && (
        <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center', gap: 8, textAlign: 'center',
          background: 'rgba(8,12,20,.92)', borderRadius: 10, fontSize: 13, color: '#fbbf24' }}>
          <i className="fas fa-triangle-exclamation" style={{ fontSize: 20 }}></i>
          <b>Bibliothèque de graphique non chargée</b>
          <span style={{ color: 'var(--muted)', maxWidth: 380 }}>
            La page vient d'une version en cache. Rechargez-la en forçant :
            <b> Ctrl + Maj + R</b> (ou Ctrl + F5).
          </span>
        </div>
      )}
      <button className="btn ghost sm" onClick={reset} title="Revenir au prix actuel"
        style={{ position: 'absolute', top: 8, right: 92, zIndex: 5 }}>
        <i className="fas fa-crosshairs"></i>
      </button>
    </div>
  );
}

function LiveMarket({ onToJournal }) {
  const [meta, setMeta] = useState({ symbols: [], timeframes: ['1m', '5m', '15m', '1h'] });
  const [symbol, setSymbol] = useState('BTCUSDT');
  const [provider, setProvider] = useState('binance');
  const [tf, setTf] = useState('5m');
  const [candles, setCandles] = useState([]);
  const [status, setStatus] = useState(null);
  const [report, setReport] = useState(null);
  const [result, setResult] = useState(null);
  const [live, setLive] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [ticks, setTicks] = useState(0);          // preuve visible que ça bouge
  const [lastUpdate, setLastUpdate] = useState(null);
  const [signal, setSignal] = useState(null);      // verdict en direct
  // Mode d'analyse : 'auto' (l'app combine toutes les règles) ou 'manuel'
  // (uniquement les règles d'une stratégie choisie dans la base).
  const [mode, setMode] = useState('auto');
  // Profondeur d'historique affichée. 1000 est le plafond réel des sources
  // (vérifié : Binance et Deriv R_75 en fournissent 1000, soit 83 h en 5 min).
  const [profondeur, setProfondeur] = useState(300);
  // Vue du graphique : 'app' (nos niveaux calculés) ou 'tradingview' (widget officiel).
  const [vue, setVue] = useState('app');
  // Une ou PLUSIEURS stratégies choisies : leurs règles se cumulent.
  const [strategiesChoisies, setStrategiesChoisies] = useState([]);
  const [choixOuvert, setChoixOuvert] = useState(false);
  const [filtreProfil, setFiltreProfil] = useState('');
  const [profils, setProfils] = useState([]);

  // Alignement multi-timeframes : le verdict n'est confirmé que si les unités
  // de temps racontent la même histoire. C'est la vue « sniper ».
  const [confluence, setConfluence] = useState(null);

  // Profils : quelles règles chaque stratégie de la base active. Sert au mode
  // manuel (on choisit sa stratégie) et affiche le détail des seuils.
  useEffect(() => {
    (async () => {
      try {
        const r = await api('/strategies/profiles');
        const d = await r.json();
        if (d.success) setProfils(d.profils || []);
      } catch (e) {}
    })();
  }, []);

  // Alignement multi-timeframes : interrogé au chargement, au changement de
  // marché ou de stratégie, puis rafraîchi régulièrement. Le nombre d'unités
  // examinées vient de la stratégie choisie quand il y en a une.
  useEffect(() => {
    if (!symbol) return;
    let vivant = true;
    const charger = async () => {
      try {
        const params = `symbol=${encodeURIComponent(symbol)}&tf=${tf}&provider=${provider}&mode=${mode}`
          + (mode === 'manuel' && strategiesChoisies.length
            ? '&strategies=' + encodeURIComponent(strategiesChoisies.join(',')) : '');
        const r = await api(`/signals/confluence?${params}`);
        const d = await r.json();
        if (vivant && d.success) setConfluence(d);
      } catch (e) { /* l'absence d'alignement ne doit jamais casser la page */ }
    };
    setConfluence(null);
    charger();
    const it = setInterval(charger, 60000);
    return () => { vivant = false; clearInterval(it); };
  }, [symbol, tf, provider, mode, strategiesChoisies.join(',')]);

  const [tick, setTick] = useState(null);          // dernier tick BRUT (prix réel)
  const [tickRate, setTickRate] = useState(0);     // ticks par seconde
  const tickPrec = useRef(null);                   // pour la couleur (hausse/baisse)
  const [alerts, setAlerts] = useState([]);        // derniers signaux reçus
  const [big, setBig] = useState(false);           // graphique agrandi
  const [offline, setOffline] = useState(false);   // données servies du cache

  useEffect(() => {
    (async () => {
      try {
        const m = await (await api('/market/symbols')).json();
        if (m.success) {
          setMeta({ symbols: m.symbols, timeframes: m.timeframes });
          if (m.symbols[0]) setSymbol(prev => prev || m.symbols[0].symbol);
        }
        const s = await (await api('/market/status')).json();
        if (s.success) setStatus(s);
      } catch {}
    })();
  }, []);

  // Changement de marché : on VIDE la série immédiatement.
  // Sans ça, le graphique recevait les bougies du symbole PRÉCÉDENT avec la
  // nouvelle étiquette (BTC à 84 200 affiché sous « Or / USD »), puis un simple
  // update() au lieu d'un rechargement complet — le graphique semblait donc
  // « ne pas bouger » alors qu'il montrait l'ancien marché.
  useEffect(() => {
    setCandles([]);
    setReport(null);
    setSignal(null);
    setTicks(0);
  }, [symbol, tf, provider]);

  const load = useCallback(async () => {
    setErr('');
    try {
      const r = await (await api(`/market/candles?symbol=${encodeURIComponent(symbol)}&tf=${tf}&count=${profondeur}&provider=${provider}`)).json();
      if (!r.success) throw new Error(r.error || 'chargement impossible');
      setCandles(r.candles);
      setOffline(!!r.offline);
      const st = await (await api(`/market/structure?symbol=${encodeURIComponent(symbol)}&tf=${tf}&provider=${provider}`)).json();
      if (st.success) setReport(st.report);
      if (st.offline) setOffline(true);
    } catch (e) {
      const m = String(e.message || e);
      // « Pas assez de bougies » = presque toujours un marché fermé (week-end,
      // hors séance). Un message technique ne sert à rien : on explique quoi faire.
      setErr(/Pas assez de bougies/i.test(m)
        ? `${m} — ce marché est probablement FERMÉ (week-end ou hors séance). Les indices synthétiques (Volatility) et les cryptos cotent 24 h/24 : essayez-en un.`
        : m);
    }
  }, [symbol, tf, provider, mode, strategiesChoisies.join(','), profondeur]);

  useEffect(() => { load(); }, [load]);

  // Suivi en direct (SSE) : la bougie en cours est mise à jour en continu
  useEffect(() => {
    setLive(false);
    const es = new EventSource(`/api/market/stream?symbol=${encodeURIComponent(symbol)}&tf=${tf}&provider=${provider}`);
    es.addEventListener('hello', () => setLive(true));
    es.addEventListener('candle', ev => {
      try {
        const c = JSON.parse(ev.data);
        setCandles(prev => {
          if (!prev.length) return [c];
          const last = prev[prev.length - 1];
          if (last.t === c.t) return [...prev.slice(0, -1), c];
          if (c.t > last.t) return [...prev, c].slice(-400);
          return prev;
        });
        setTicks(t => t + 1);
        setLastUpdate(Date.now());
      } catch {}
    });
    es.addEventListener('error', () => setLive(false));
    return () => es.close();
  }, [symbol, tf, provider]);

  // Flux de TICKS bruts : le prix réel, transaction par transaction. Le flux de
  // bougies ne dit qu'un OHLC en cours ; ici on voit le marché battre.
  useEffect(() => {
    if (!symbol) return;
    setTick(null); setTickRate(0); tickPrec.current = null;
    const es = new EventSource(`/api/market/ticks?symbol=${encodeURIComponent(symbol)}&provider=${provider}`);
    let recus = 0;
    es.addEventListener('tick', ev => {
      try {
        const t = JSON.parse(ev.data);
        // On fige le prix précédent DANS le tick : comparer avec une référence
        // déjà écrasée donnait une couleur toujours neutre.
        setTick({ ...t, prec: tickPrec.current });
        tickPrec.current = t.prix;
        recus++;
      } catch (e) {}
    });
    // Toute source n'a pas de flux de ticks (COMEX par exemple) : on n'affiche rien.
    es.addEventListener('error', () => {});
    const compteur = setInterval(() => { setTickRate(recus); recus = 0; }, 1000);
    return () => { clearInterval(compteur); es.close(); };
  }, [symbol, provider]);

  // Signaux en direct : le serveur n'émet que sur CHANGEMENT de verdict,
  // donc un signal reçu = un vrai changement, pas du bruit.
  useEffect(() => {
    setSignal(null);
    const es = new EventSource(`/api/signals/stream?symbol=${encodeURIComponent(symbol)}&tf=${tf}&provider=${provider}`
      + `&mode=${mode}${mode === 'manuel' && strategiesChoisies.length ? '&strategies=' + encodeURIComponent(strategiesChoisies.join(',')) : ''}`);
    es.addEventListener('signal', ev => {
      try {
        const v = JSON.parse(ev.data);
        setSignal(v);
        if (v.status === 'confirme') {
          // Alerte sonore légère impossible sans interaction : on marque visuellement.
          setAlerts(prev => [{ ...v, receivedAt: Date.now() }, ...prev].slice(0, 8));
        }
      } catch {}
    });
    return () => es.close();
  }, [symbol, tf, provider]);

  const analyser = async () => {
    setBusy(true); setErr('');
    try {
      const r = await (await api('/market/analyze', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ symbol, tf, provider, maxStrategies: 3 })
      })).json();
      if (!r.success) throw new Error(r.error || 'analyse impossible');
      setResult(r);
      if (r.analysis && r.analysis.levels) {
        setReport(prev => ({ ...(prev || {}), levels: r.analysis.levels, summary: r.analysis.summary }));
      }
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };

  const last = candles.length ? candles[candles.length - 1] : null;
  const prev = candles.length > 1 ? candles[candles.length - 2] : null;
  const change = last && prev && prev.c ? ((last.c - prev.c) / prev.c) * 100 : null;
  const fmt = p => (p === null || p === undefined ? '—' : p >= 1000 ? p.toFixed(2) : p.toFixed(5));

  return (
    <>
      <div className="panel" style={{ padding:'14px 16px', marginBottom:16, display:'flex',
        gap:10, alignItems:'center', flexWrap:'wrap' }}>
        <select className="fld" style={{ width:250 }} value={`${provider}|${symbol}`}
          onChange={e=>{ const [pv, sy] = e.target.value.split('|'); setProvider(pv); setSymbol(sy); }}>
          {Object.entries(meta.symbols.reduce((acc, s) => {
            const k = s.providerLabel || 'Marchés';
            (acc[k] = acc[k] || []).push(s);
            return acc;
          }, {})).map(([label, list]) => (
            <optgroup key={label} label={label}>
              {list.map(s => (
                <option key={`${s.provider}|${s.symbol}`} value={`${s.provider}|${s.symbol}`}>
                  {s.tv ? `${s.tv} — ${s.label}` : s.label}
                </option>
              ))}
            </optgroup>
          ))}
        </select>
        <select className="fld" style={{ width:100 }} value={tf} onChange={e=>setTf(e.target.value)}>
          {meta.timeframes.map(t => <option key={t} value={t}>{t}</option>)}
        </select>
        <select className="fld" style={{ width:118 }} value={profondeur}
          onChange={e=>setProfondeur(Number(e.target.value))}
          title="Nombre de bougies chargées. 1000 est le maximum que les sources fournissent (83 h en 5 min).">
          {[150, 300, 500, 1000].map(n => <option key={n} value={n}>{n} bougies</option>)}
        </select>
        <select className="fld" style={{ width:150 }} value={mode} onChange={e=>setMode(e.target.value)}
          title="Auto : l'app combine toutes les règles. Manuel : uniquement les règles d'une stratégie de ta base.">
          <option value="auto">Analyse auto</option>
          <option value="manuel">Ma stratégie</option>
        </select>
        {mode === 'manuel' && (
          <div style={{ position:'relative' }}>
            <button className="btn ghost sm" onClick={() => setChoixOuvert(o => !o)}
              title="Choisir une ou plusieurs stratégies : leurs règles se cumulent.">
              <i className="fas fa-list-check"></i>
              Stratégies ({strategiesChoisies.length})
            </button>
            {choixOuvert && (
              <div className="panel" style={{ position:'absolute', zIndex:60, top:'115%', left:0, width:360,
                maxHeight:340, overflowY:'auto', padding:12, boxShadow:'0 12px 30px rgba(0,0,0,.5)' }}>
                <input className="fld" placeholder="Filtrer…" value={filtreProfil}
                  onChange={e => setFiltreProfil(e.target.value)}
                  style={{ width:'100%', marginBottom:8 }} />
                <div style={{ display:'flex', gap:6, marginBottom:8 }}>
                  <button className="btn ghost sm" onClick={() => setStrategiesChoisies(profils.map(p => p.id))}>
                    Tout
                  </button>
                  <button className="btn ghost sm" onClick={() => setStrategiesChoisies([])}>Aucune</button>
                  <span style={{ marginLeft:'auto', fontSize:11.5, color:'var(--dim)', alignSelf:'center' }}>
                    {profils.length} disponible(s)
                  </span>
                </div>
                {profils
                  .filter(p => !filtreProfil || String(p.titre || '').toLowerCase().includes(filtreProfil.toLowerCase()))
                  .map(p => (
                    <label key={p.id} style={{ display:'flex', gap:8, alignItems:'center',
                      padding:'5px 2px', fontSize:12.5, cursor:'pointer' }}>
                      <input type="checkbox" checked={strategiesChoisies.includes(p.id)}
                        onChange={() => setStrategiesChoisies(l =>
                          l.includes(p.id) ? l.filter(x => x !== p.id) : [...l, p.id])} />
                      <span style={{ flex:1 }}>{p.titre}</span>
                      <span className="tag" style={{ fontSize:10.5 }} title={p.motif}>
                        {p.regles.join('+')}
                      </span>
                    </label>
                  ))}
                {!profils.length && (
                  <div style={{ fontSize:12, color:'var(--dim)' }}>Aucune stratégie dans la base.</div>
                )}
              </div>
            )}
          </div>
        )}
        <span className="badge" style={{ background: live ? 'rgba(16,185,129,.13)' : 'rgba(245,158,11,.13)',
          color: live ? '#34d399' : '#f59e0b' }}>
          <span className="dot-live"></span>{live ? 'direct' : 'connexion…'}
        </span>
        {lastUpdate && (
          <span className="badge" style={{ background:'rgba(148,163,184,.1)', color:'var(--muted)' }}>
            <i className="fas fa-arrows-rotate" style={{ marginRight:5 }}></i>
            {ticks} maj · {new Date(lastUpdate).toLocaleTimeString('fr-FR')}
          </span>
        )}
        {/* Source du symbole AFFICHÉ, pas du fournisseur par défaut */}
        {(() => {
          const cur = meta.symbols.find(s => s.symbol === symbol && s.provider === provider);
          return cur ? (
            <span className="badge" style={{ background:'rgba(148,163,184,.1)', color:'var(--muted)' }}
              title={cur.tv ? `Identique a ${cur.tv} sur TradingView` : cur.providerLabel}>
              <i className="fas fa-server"></i>{cur.tv || cur.providerLabel}
            </span>
          ) : null;
        })()}
        {offline && (
          <span className="badge" style={{ background:'rgba(245,158,11,.15)', color:'#fbbf24' }}
            title="Réseau indisponible : les bougies proviennent du cache local. L'analyse reste utilisable.">
            <i className="fas fa-plug-circle-xmark" style={{ marginRight:5 }}></i>hors ligne (cache)
          </span>
        )}
        <span style={{ flex:'1 1 auto' }}></span>
        {(() => {
          const cur = meta.symbols.find(s => s.symbol === symbol && s.provider === provider);
          if (!cur || !cur.tv) return null;
          return (
            <>
              <button className="btn ghost sm" onClick={() => setVue(v => v === 'app' ? 'tradingview' : 'app')}
                title={vue === 'app'
                  ? `Afficher ${cur.tv} avec le graphique TradingView officiel`
                  : 'Revenir au graphique de l\'app (niveaux calculés et signal)'}>
                <i className={`fas ${vue === 'app' ? 'fa-tv' : 'fa-chart-line'}`}></i>
                {vue === 'app' ? 'Vue TradingView' : 'Vue app'}
              </button>
              <a className="btn ghost sm" target="_blank" rel="noopener noreferrer"
                href={`https://fr.tradingview.com/chart/?symbol=${encodeURIComponent(cur.tv)}`}
                title={`Ouvrir ${cur.tv} sur le site TradingView`}>
                <i className="fas fa-arrow-up-right-from-square"></i>Site
              </a>
            </>
          );
        })()}
        <button className="btn ghost sm" onClick={()=>setBig(b => !b)}
          title={big ? 'Réduire le graphique' : 'Agrandir le graphique'}>
          <i className={`fas ${big ? 'fa-compress' : 'fa-expand'}`}></i>{big ? 'Réduire' : 'Agrandir'}
        </button>
        <button className="btn ghost sm" onClick={load} title="Recharger l'historique">
          <i className="fas fa-rotate"></i>
        </button>
        {signal && signal.status !== 'neutre' && (
          <button className="btn ghost sm" onClick={() => onToJournal && onToJournal({
            pair: symbol,
            direction: signal.direction === 'BUY' ? 'BUY' : 'SELL',
            entry: signal.levels && signal.levels.entry !== null ? signal.levels.entry
              : (tick ? tick.prix : null),
            sl: signal.levels ? signal.levels.stop : null,
            tp: signal.levels ? signal.levels.target1 : null,
            timeframe: tf,
            provider,
            providerLabel: (meta.symbols.find(s => s.symbol === symbol && s.provider === provider) || {}).providerLabel || provider,
            signalStatus: signal.status,
            signalStrength: signal.strength,
            strategyIds: (signal.strategies || []).map(s => s.id).filter(Boolean),
            notes: `Signal ${signal.status} ${signal.direction} — ${signal.summary}`
          })}
            title="Ouvrir le journal avec ce signal déjà rempli : marché, entrée, invalidation, objectif, stratégies">
            <i className="fas fa-floppy-disk"></i>Enregistrer ce signal
          </button>
        )}
        <button className="btn" onClick={analyser} disabled={busy}>
          {busy ? <Spinner/> : <><i className="fas fa-bolt"></i>Analyser maintenant</>}
        </button>
      </div>

      {/* ── Signal en direct : quelle stratégie s'applique, achat ou vente ── */}
      <div className="panel" style={{
        padding:'14px 18px', marginBottom:16,
        borderColor: signal && signal.status === 'confirme'
          ? (signal.direction === 'BUY' ? 'rgba(34,211,138,.55)' : 'rgba(242,84,91,.55)') : undefined,
        animation: signal && signal.status === 'confirme' ? 'signalPulse 1.6s ease-out 2' : undefined
      }}>
        <div style={{ display:'flex', alignItems:'center', gap:12, flexWrap:'wrap' }}>
          <i className="fas fa-bolt" style={{ color:'#f59e0b' }}></i>
          <b style={{ fontSize:14, color:'#fff' }}>Signal en direct</b>
          {signal && signal.mode === 'manuel' && signal.strategieAppliquee && (
            <span className="badge" style={{ background:'rgba(167,139,250,.14)', color:'#c4b5fd' }}
              title={`Verdict limité aux règles de cette stratégie : ${signal.strategieAppliquee.regles.join(', ')}`}>
              <i className="fas fa-book"></i>{signal.strategieAppliquee.titre}
            </span>
          )}
          {signal && signal.mode === 'auto' && (
            <span className="badge" style={{ background:'rgba(148,163,184,.1)', color:'var(--muted)' }}
              title={`Analyse automatique : toutes les règles (${(signal.reglesActives || []).join(', ')})`}>
              <i className="fas fa-wand-magic-sparkles"></i>auto
            </span>
          )}
          {!signal && <span style={{ fontSize:13, color:'var(--muted)' }}>en attente du premier verdict…</span>}
          {signal && (<>
            <span className="badge" style={{
              background: signal.status === 'confirme'
                ? (signal.direction === 'BUY' ? 'rgba(34,211,138,.18)' : 'rgba(242,84,91,.18)')
                : 'rgba(148,163,184,.12)',
              color: signal.status === 'confirme'
                ? (signal.direction === 'BUY' ? '#34d399' : '#f87171') : 'var(--muted)'
            }}>
              {signal.direction === 'BUY' ? 'ACHAT' : signal.direction === 'SELL' ? 'VENTE' : 'NEUTRE'}
              {signal.status === 'confirme' ? ' CONFIRMÉ' : signal.status === 'surveiller' ? ' à surveiller' : ''}
            </span>
            <span style={{ fontSize:12.5, color:'var(--muted)' }}>
              {signal.confirmations} règle(s) · force {(signal.strength * 100).toFixed(0)} %
              {signal.trend ? ` · tendance ${signal.trend}` : ''}
            </span>
            <span style={{ flex:'1 1 auto' }}></span>
            <span style={{ fontSize:11.5, color:'var(--dim)' }}>
              bougie clôturée {signal.at ? new Date(signal.at).toLocaleTimeString('fr-FR') : ''}
            </span>
          </>)}
        </div>

        {signal && signal.rules && signal.rules.length > 0 && (
          <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginTop:10 }}>
            {signal.rules.map((r, i) => (
              <span key={i} className="tag" title={r.detail} style={{
                background: r.direction === 'BUY' ? 'rgba(34,211,138,.12)' : 'rgba(242,84,91,.12)',
                borderColor: r.direction === 'BUY' ? 'rgba(34,211,138,.4)' : 'rgba(242,84,91,.4)',
                color: r.direction === 'BUY' ? '#6ee7b7' : '#fca5a5'
              }}>
                {r.rule} · {r.name}
              </span>
            ))}
          </div>
        )}

        {/* Détails du signal : niveaux, scénarios des deux sens, conditions.
            Rien n'est masqué sous prétexte que le verdict n'est pas encore
            confirmé — c'est justement là qu'on a besoin du plan. */}
        {signal && (
          <div style={{ marginTop:12, display:'grid', gap:10 }}>
            {signal.levels && Number.isFinite(signal.levels.entry) && (
              <div style={{ display:'flex', gap:18, flexWrap:'wrap', fontSize:13 }}>
                <span><span style={{ color:'var(--muted)' }}>Entrée </span><b>{fmt(signal.levels.entry)}</b></span>
                <span><span style={{ color:'var(--muted)' }}>Invalidation </span>
                  <b style={{ color:'#f87171' }}>{fmt(signal.levels.stop)}</b></span>
                <span><span style={{ color:'var(--muted)' }}>Objectif 1 </span>
                  <b style={{ color:'#34d399' }}>{fmt(signal.levels.target1)}</b></span>
                <span><span style={{ color:'var(--muted)' }}>Objectif 2 </span>
                  <b style={{ color:'#34d399' }}>{fmt(signal.levels.target2)}</b></span>
              </div>
            )}

            {signal.missing && signal.missing.length > 0 && (
              <div style={{ fontSize:12.5, color:'#fbbf24' }}>
                <i className="fas fa-circle-info" style={{ marginRight:6 }}></i>
                Pour confirmer : {signal.missing.join(' · ')}
              </div>
            )}

            {signal.biais && (
              <div style={{ fontSize:12.5, color:'var(--muted)' }}>
                <i className="fas fa-compass" style={{ marginRight:6,
                  color: signal.biais === 'haussier' ? '#34d399' : signal.biais === 'baissier' ? '#f87171' : 'var(--dim)' }}></i>
                Biais <b style={{ color: signal.biais === 'haussier' ? '#34d399'
                  : signal.biais === 'baissier' ? '#f87171' : '#e2e8f0' }}>{signal.biais}</b> — {signal.raisonBiais}
              </div>
            )}

            {signal.scenarios && (
              <div style={{ display:'grid', gap:8, gridTemplateColumns:'repeat(auto-fit,minmax(270px,1fr))' }}>
                {[['bullish', 'ACHAT', '#34d399', 'fa-arrow-trend-up'],
                  ['bearish', 'VENTE', '#f87171', 'fa-arrow-trend-down']].map(([k, lab, col, ico]) => {
                  const s = signal.scenarios[k];
                  if (!s) return null;
                  const privilegie = s.priorite === 'principale';
                  return (
                    <div key={k} style={{ border: privilegie ? `1px solid ${col}55` : '1px solid rgba(27,36,51,.7)',
                      background: privilegie ? `${col}0d` : 'transparent',
                      borderRadius:8, padding:'10px 12px', opacity: privilegie ? 1 : 0.75 }}>
                      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between',
                        fontSize:12.5, color:col, fontWeight:600, marginBottom:6 }}>
                        <span><i className={`fas ${ico}`} style={{ marginRight:6 }}></i>Scénario {lab}</span>
                        <span className="tag" style={{ fontSize:10.5,
                          background: privilegie ? `${col}22` : 'rgba(148,163,184,.1)',
                          color: privilegie ? col : 'var(--dim)',
                          borderColor: privilegie ? `${col}55` : 'rgba(148,163,184,.25)' }}>
                          {privilegie ? 'privilégié' : 'alternatif'}
                        </span>
                      </div>
                      <div style={{ fontSize:12, color:'var(--muted)', lineHeight:1.6 }}>
                        <div><b style={{ color:'#cbd5e1' }}>Déclencheur</b> : {s.trigger}</div>
                        <div><b style={{ color:'#cbd5e1' }}>Contexte</b> : {s.context}</div>
                        <div style={{ marginTop:6 }}>
                          entrée <b style={{ color:'#e2e8f0' }}>{fmt(s.entry)}</b>
                          {' · '}invalidation <b style={{ color:'#f87171' }}>{fmt(s.stop)}</b>
                          {' · '}objectifs <b style={{ color:'#34d399' }}>{fmt(s.target1)}</b> / {fmt(s.target2)}
                        </div>
                        {s.objectifProche && (
                          <div style={{ marginTop:5, color:'#fbbf24', fontSize:11.5 }}>
                            <i className="fas fa-bullseye" style={{ marginRight:5 }}></i>
                            cible la plus proche : {s.objectifProche}
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {signal.checklist && (
              <div style={{ display:'flex', gap:8, flexWrap:'wrap', fontSize:12 }}>
                {signal.checklist.map(c => (
                  <span key={c.key} className="tag" title={c.detail}
                    style={{ background: c.ok ? 'rgba(34,211,138,.1)' : 'rgba(148,163,184,.08)',
                      borderColor: c.ok ? 'rgba(34,211,138,.35)' : 'rgba(148,163,184,.25)',
                      color: c.ok ? '#6ee7b7' : 'var(--muted)' }}>
                    <i className={`fas ${c.ok ? 'fa-circle-check' : 'fa-circle-minus'}`} style={{ marginRight:5 }}></i>
                    {c.label}
                  </span>
                ))}
              </div>
            )}
          </div>
        )}

        {signal && signal.strategies && signal.strategies.length > 0 && (
          <div style={{ marginTop:12 }}>
            <div style={{ fontSize:12, color:'var(--muted)', marginBottom:6 }}>
              <i className="fas fa-book" style={{ marginRight:6 }}></i>Stratégies de ta base qui s'appliquent
            </div>
            <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
              {signal.strategies.map(s => (
                <span key={s.id} className="tag" title={`${s.type} · pertinence ${s.relevanceScore}`}>
                  {s.title.slice(0, 46)}
                </span>
              ))}
            </div>
          </div>
        )}

        {/* Alignement multi-timeframes : le signal n'est confirmé que si les
            unités de temps racontent la même histoire. C'est la vue « sniper ». */}
        {confluence && confluence.confluence && (
          <div className="panel" style={{ padding:'12px 14px', marginTop:12 }}>
            <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8, flexWrap:'wrap' }}>
              <b style={{ fontSize:13 }}>
                <i className="fas fa-crosshairs" style={{ marginRight:6, color:'#fbbf24' }}></i>
                Alignement des unités de temps
              </b>
              <span className="badge" style={{
                background: confluence.confluence.aligne ? 'rgba(16,185,129,.14)' : 'rgba(245,158,11,.14)',
                color: confluence.confluence.aligne ? '#34d399' : '#fbbf24' }}>
                {confluence.confluence.aligne ? 'ALIGNÉ' : 'NON ALIGNÉ'}
                {' · '}{confluence.confluence.nbAlignes}/{confluence.confluence.detail.length}
                {' · seuil '}{confluence.confluence.seuilAlignes}
              </span>
              {confluence.strategieAppliquee && (
                <span className="badge" style={{ background:'rgba(96,165,250,.1)', color:'#93c5fd' }}
                  title={confluence.strategieAppliquee.titre}>
                  {(confluence.strategieAppliquee.nombre || 1)} stratégie(s)
                  {confluence.strategieAppliquee.style ? ` · ${confluence.strategieAppliquee.style}` : ''}
                </span>
              )}
            </div>
            <div style={{ display:'grid', gap:6 }}>
              {confluence.confluence.detail.map(t => (
                <div key={t.tf} style={{ display:'flex', alignItems:'center', gap:10, fontSize:12.5 }}>
                  <b style={{ width:46 }}>{t.tf}</b>
                  <span style={{ width:70, color: t.tendance === 'bullish' ? '#34d399'
                    : t.tendance === 'bearish' ? '#f87171' : '#f59e0b' }}>{t.tendance}</span>
                  <span style={{ flex:1, color:'var(--muted)' }}>
                    {t.status}{t.direction && t.direction !== 'NEUTRE' ? ' · ' + t.direction : ''}
                    {t.regles && t.regles.length ? ' · ' + t.regles.join('+') : ''}
                  </span>
                  <i className={`fas ${t.confirme ? 'fa-circle-check' : 'fa-circle-minus'}`}
                    style={{ color: t.confirme ? '#34d399' : 'var(--muted)' }}></i>
                </div>
              ))}
            </div>
            <p style={{ margin:'8px 0 0', fontSize:11.5, color:'var(--dim)' }}>
              {confluence.confluence.motif} — le signal n'est confirmé que si ce seuil est atteint.
            </p>
          </div>
        )}

        {alerts.length > 0 && (
          <details style={{ marginTop:12 }}>
            <summary style={{ fontSize:12, color:'var(--muted)', cursor:'pointer' }}>
              Signaux confirmés reçus depuis l'ouverture ({alerts.length})
            </summary>
            <div style={{ marginTop:8, display:'grid', gap:6 }}>
              {alerts.map((a, i) => (
                <div key={i} style={{ display:'flex', justifyContent:'space-between', gap:10, fontSize:12.5 }}>
                  <span style={{ color: a.direction === 'BUY' ? '#6ee7b7' : '#fca5a5' }}>
                    {a.direction === 'BUY' ? 'ACHAT' : 'VENTE'} · force {(a.strength * 100).toFixed(0)} %
                    · {(a.rules || []).map(r => r.name).join(' + ')}
                  </span>
                  <span style={{ color:'var(--dim)' }}>
                    {new Date(a.receivedAt).toLocaleTimeString('fr-FR')}
                  </span>
                </div>
              ))}
            </div>
          </details>
        )}
      </div>

      {err && (
        <div className="panel" style={{ padding:'12px 16px', marginBottom:16,
          borderColor:'rgba(239,68,68,.45)', color:'#fca5a5', fontSize:13 }}>
          <i className="fas fa-triangle-exclamation" style={{ marginRight:8 }}></i>{err}
        </div>
      )}

      <div className="panel" style={{ padding:18, marginBottom:16 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline',
          flexWrap:'wrap', gap:10, marginBottom:10 }}>
          <div style={{ display:'flex', alignItems:'baseline', gap:12 }}>
            <b style={{ fontSize:20, color:'#fff' }}>{fmt(last && last.c)}</b>
            {change !== null && (
              <span style={{ fontSize:13, color: change >= 0 ? '#34d399' : '#f87171' }}>
                <i className={`fas ${change >= 0 ? 'fa-caret-up' : 'fa-caret-down'}`} style={{marginRight:4}}></i>
                {change >= 0 ? '+' : ''}{change.toFixed(3)} %
              </span>
            )}
            {last && <span style={{ fontSize:12, color:'var(--muted)' }}>
              O {fmt(last.o)} · H {fmt(last.h)} · L {fmt(last.l)}
            </span>}
          </div>
          <span style={{ fontSize:12, color:'var(--muted)' }}>
            {report ? `${report.candles} bougies · ATR ${report.atr14}` : ''}
          </span>
        </div>
        {tick && (
          <div style={{ display:'flex', alignItems:'baseline', gap:12, margin:'4px 0 10px', flexWrap:'wrap' }}>
            <span style={{ fontSize:24, fontWeight:800, letterSpacing:'-0.5px',
              fontVariantNumeric:'tabular-nums',
              color: tick.prec === null || tick.prec === undefined ? '#e2e8f0'
                : tick.prix > tick.prec ? '#34d399'
                : tick.prix < tick.prec ? '#f87171' : '#e2e8f0' }}>
              {fmt(tick.prix)}
            </span>
            <span className="badge" style={{ background:'rgba(16,185,129,.12)', color:'#34d399' }}
              title="Ticks bruts reçus de la source, par seconde. C'est le marché qui bat, pas une bougie reconstruite.">
              <span className="dot-live"></span>{tickRate} tick/s
            </span>
            <span style={{ fontSize:11.5, color:'var(--dim)' }}>
              tick réel · {new Date(tick.t).toLocaleTimeString('fr-FR')} · source {tick.source}
            </span>
          </div>
        )}

        {vue === 'app' ? (
          <PriceChart candles={candles} levels={report ? report.levels : []} signal={signal}
            height={big ? 620 : 430} symbol={symbol} tf={tf} />
        ) : (
          <TradingViewChart
            symbole={(meta.symbols.find(s => s.symbol === symbol && s.provider === provider) || {}).tv}
            tf={tf} height={big ? 620 : 430} />
        )}
        <p style={{ margin:'8px 0 0', fontSize:11.5, color:'var(--dim)' }}>
          {vue === 'app'
            ? <>Vue app — molette = zoom, glisser = déplacer, double-clic = revenir au prix. Bougies en UTC.
                Zones vertes = support/OB/FVG haussier, rouges = baissier, orange = liquidité.
                Les niveaux tracés sont calculés par l'app.</>
            : <>Vue TradingView officielle — tous leurs outils (dessin, indicateurs, fuseaux, comparaison).
                Le signal et les niveaux de l'app restent affichés au-dessus.</>}
        </p>
      </div>

      {report && (
        <div style={{ display:'grid', gap:14, gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))', marginBottom:16 }}>
          <div className="panel" style={{ padding:18 }}>
            <h3 style={{ margin:'0 0 10px', fontSize:14 }}>
              <i className="fas fa-sitemap" style={{ color:'#60a5fa', marginRight:8 }}></i>Structure calculée
            </h3>
            <div style={{ fontSize:13, display:'grid', gap:7 }}>
              <div style={{ display:'flex', justifyContent:'space-between' }}>
                <span style={{ color:'var(--muted)' }}>Tendance</span>
                <b style={{ color: report.structure.trend === 'bullish' ? '#34d399'
                  : report.structure.trend === 'bearish' ? '#f87171' : '#f59e0b' }}>{report.structure.trend}</b>
              </div>
              {report.structure.event && (
                <div style={{ display:'flex', justifyContent:'space-between' }}>
                  <span style={{ color:'var(--muted)' }}>{report.structure.event.type}</span>
                  <b>{fmt(report.structure.event.level)} <span style={{color:'var(--dim)'}}>({report.structure.event.direction})</span></b>
                </div>
              )}
              {report.premiumDiscount && (<>
                <div style={{ display:'flex', justifyContent:'space-between' }}>
                  <span style={{ color:'var(--muted)' }}>Range</span>
                  <b>{fmt(report.premiumDiscount.low)} – {fmt(report.premiumDiscount.high)}</b>
                </div>
                <div style={{ display:'flex', justifyContent:'space-between' }}>
                  <span style={{ color:'var(--muted)' }}>Position</span>
                  <b style={{ color: report.premiumDiscount.position === 'premium' ? '#f87171' : '#34d399' }}>
                    {report.premiumDiscount.position}</b>
                </div>
              </>)}
              {report.sessions && (<>
                <div style={{ display:'flex', justifyContent:'space-between' }}>
                  <span style={{ color:'var(--muted)' }}>Session</span>
                  <b>{report.sessions.sessionCourante}</b>
                </div>
                <div style={{ display:'flex', justifyContent:'space-between' }}>
                  <span style={{ color:'var(--muted)' }}>Kill zone</span>
                  <b style={{ color: report.sessions.killZone === 'aucune en ce moment' ? 'var(--muted)' : '#fbbf24' }}>
                    {report.sessions.killZone}</b>
                </div>
              </>)}
              <div style={{ display:'flex', justifyContent:'space-between' }}>
                <span style={{ color:'var(--muted)' }}>Récent</span>
                <span style={{ fontSize:12 }}>
                  {(report.structure.recent || []).map(r => `${r.label} ${fmt(r.price)}`).join(' · ') || '—'}
                </span>
              </div>
              {(report.displacements || []).length > 0 && (
                <div style={{ display:'flex', justifyContent:'space-between' }}>
                  <span style={{ color:'var(--muted)' }}>Déplacements</span>
                  <span style={{ fontSize:12 }}>
                    {report.displacements.slice(-3).map(d => `${d.direction} ${d.multiple}×`).join(' · ')}
                  </span>
                </div>
              )}
            </div>
          </div>

          <div className="panel" style={{ padding:18 }}>
            <h3 style={{ margin:'0 0 10px', fontSize:14 }}>
              <i className="fas fa-wave-square" style={{ color:'#f472b6', marginRight:8 }}></i>
              Fibonacci &amp; périodes de référence
            </h3>
            <div style={{ fontSize:12.5, display:'grid', gap:6 }}>
              {report.fibLevels ? (
                <>
                  <div style={{ color:'var(--muted)', fontSize:12, marginBottom:2 }}>
                    dernier swing {report.fibLevels.sens}
                  </div>
                  {Object.entries(report.fibLevels.levels).map(([k, v]) => (
                    <div key={k} style={{ display:'flex', justifyContent:'space-between' }}>
                      <span style={{ color:'var(--muted)' }}>Retracement {k}</span>
                      <b>{fmt(v)}</b>
                    </div>
                  ))}
                </>
              ) : <span style={{ color:'var(--dim)' }}>Swing insuffisant</span>}
              {report.previousLevels && Object.entries(report.previousLevels).map(([k, v]) => (
                <div key={k} style={{ display:'flex', justifyContent:'space-between' }}>
                  <span style={{ color:'var(--muted)' }}>{k}</span><b>{fmt(v)}</b>
                </div>
              ))}
              {(report.breakers || []).length > 0 && (
                <div style={{ marginTop:6 }}>
                  <div style={{ color:'var(--muted)', fontSize:12, marginBottom:3 }}>Breakers (zones retournées)</div>
                  {report.breakers.slice(-3).map((b, i) => (
                    <div key={i} style={{ display:'flex', justifyContent:'space-between' }}>
                      <span style={{ color:'var(--muted)' }}>{b.type}</span>
                      <b>{fmt(b.low)}–{fmt(b.high)}</b>
                    </div>
                  ))}
                </div>
              )}
              {(report.sweeps || []).length > 0 && (
                <div style={{ marginTop:6 }}>
                  <div style={{ color:'var(--muted)', fontSize:12, marginBottom:3 }}>Balayages de liquidité</div>
                  {report.sweeps.slice(-3).map((s, i) => (
                    <div key={i} style={{ display:'flex', justifyContent:'space-between' }}>
                      <span style={{ color:'var(--muted)' }}>{s.type} ({s.depth} %)</span>
                      <b>{fmt(s.level)}</b>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div className="panel" style={{ padding:18 }}>
            <h3 style={{ margin:'0 0 10px', fontSize:14 }}>
              <i className="fas fa-ruler-combined" style={{ color:'#a78bfa', marginRight:8 }}></i>
              {report.levels.length} niveaux exploitables
            </h3>
            <div style={{ maxHeight:210, overflowY:'auto', display:'grid', gap:6 }}>
              {report.levels.map((l, i) => (
                <div key={i} style={{ display:'flex', justifyContent:'space-between', gap:10, fontSize:12.5,
                  paddingBottom:5, borderBottom:'1px solid rgba(27,36,51,.5)' }}>
                  <span style={{ color:'var(--muted)' }}>{l.kind}</span>
                  <span>
                    <b>{fmt(l.price)}</b>
                    {l.zone && <span style={{ color:'var(--dim)', marginLeft:6 }}>{fmt(l.zone[0])}–{fmt(l.zone[1])}</span>}
                  </span>
                </div>
              ))}
            </div>
          </div>

          {report.inventory && (
            <div className="panel" style={{ padding:18, gridColumn:'1 / -1' }}>
              <h3 style={{ margin:'0 0 10px', fontSize:14 }}>
                <i className="fas fa-list-check" style={{ color:'#34d399', marginRight:8 }}></i>
                {report.inventory.total} éléments identifiés sur le graphique
              </h3>
              <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginBottom:12 }}>
                {Object.entries(report.inventory.parFamille).map(([k, v]) => (
                  <span key={k} className="tag" style={{ background:'rgba(96,165,250,.1)',
                    borderColor:'rgba(96,165,250,.3)', color:'#93c5fd' }}>
                    {k} · {v}
                  </span>
                ))}
              </div>
              <div style={{ display:'grid', gap:16, gridTemplateColumns:'repeat(auto-fit,minmax(250px,1fr))',
                maxHeight:340, overflowY:'auto' }}>
                {Object.entries(report.inventory.items.reduce((acc, it) => {
                  (acc[it.famille] = acc[it.famille] || []).push(it); return acc;
                }, {})).map(([fam, list]) => (
                  <div key={fam}>
                    <div style={{ fontSize:12, color:'#93c5fd', fontWeight:600, marginBottom:6 }}>{fam}</div>
                    {list.map((it, i) => (
                      <div key={i} title={it.etat}
                        style={{ display:'flex', justifyContent:'space-between', gap:8, fontSize:12,
                          paddingBottom:4, borderBottom:'1px solid rgba(27,36,51,.4)' }}>
                        <span style={{ color:'var(--muted)' }}>{it.label}</span>
                        <span><b>{it.prix !== null ? fmt(it.prix) : '—'}</b></span>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
              <p style={{ margin:'10px 0 0', fontSize:11.5, color:'var(--dim)' }}>
                Chaque ligne est calculée depuis les bougies réelles. Survolez pour voir l'état
                (ouvert, valide, cassé, balayé…). Aucun élément deviné.
              </p>
            </div>
          )}
        </div>
      )}

      {result && <Result result={result} />}
    </>
  );
}

/* ══════════════ JOURNAL DE TRADES ══════════════ */

const TRADE_R = {
  win:  { label:'Gain',  color:'#10b981', bg:'rgba(16,185,129,.13)', icon:'fa-arrow-trend-up' },
  loss: { label:'Perte', color:'#ef4444', bg:'rgba(239,68,68,.13)',  icon:'fa-arrow-trend-down' },
  breakeven:{ label:'Neutre', color:'#94a3b8', bg:'rgba(148,163,184,.13)', icon:'fa-equals' }
};

function ResultBadge({ result, status }) {
  if (status === 'open') {
    return <span className="badge" style={{ background:'rgba(37,99,235,.14)', color:'#7cb2ff' }}>
      <i className="fas fa-hourglass-half"></i>en cours</span>;
  }
  const s = TRADE_R[result] || { label:result || '—', color:'#94a3b8', bg:'rgba(148,163,184,.13)', icon:'fa-circle' };
  return <span className="badge" style={{ background:s.bg, color:s.color }}>
    <i className={`fas ${s.icon}`}></i>{s.label}</span>;
}

function Journal({ prefill, onPrefillUsed, strategies = [] }) {
  const [trades, setTrades] = useState([]);
  const [stats, setStats] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [form, setForm] = useState({ pair:'', direction:'BUY', entry:'', sl:'', tp:'', size:'', notes:'' });
  const [closing, setClosing] = useState({});
  const [picked, setPicked] = useState([]);            // stratégies liées au trade
  const [originId, setOriginId] = useState(null);      // analyse d'origine
  const [filter, setFilter] = useState({ q:'', result:'all' });
  // Contexte de marché attaché au trade : d'où vient le prix, sur quelle unité
  // de temps, et quel signal était en cours. Sans ça, les statistiques ne
  // peuvent pas dire sur QUEL marché on gagne.
  const [market, setMarket] = useState({ timeframe:'', provider:'', providerLabel:'', signalStatus:'', signalStrength:null });

  // Une seule façon de dessiner une ligne de statistique : barre de réussite,
  // compte et PnL. Évite que chaque tableau réinvente la sienne.
  const StatRow = ({ s }) => (
    <div style={{ display:'flex', alignItems:'center', gap:12, flexWrap:'wrap' }}>
      <span style={{ flex:'1 1 220px', fontSize:13, color:'#fff' }}>{s.label}</span>
      <span style={{ width:160, height:8, background:'rgba(148,163,184,.18)', borderRadius:99, overflow:'hidden' }}>
        <span style={{ display:'block', height:'100%', width:`${s.winRate || 0}%`,
          background: (s.winRate || 0) >= 50 ? '#10b981' : '#f59e0b' }}></span>
      </span>
      <span style={{ fontSize:12.5, color:'var(--muted)', minWidth:150, textAlign:'right' }}>
        {s.wins}/{s.trades} · {s.winRate === null ? '—' : s.winRate + ' %'}
        {s.pnl ? <> · PnL {n6(s.pnl)}</> : null}
      </span>
    </div>
  );

  // Report d'un plan vers le journal (bouton « Enregistrer ce trade » / « ce signal »)
  useEffect(() => {
    if (!prefill) return;
    setForm(f => ({
      ...f,
      pair: prefill.pair || f.pair,
      direction: prefill.direction || f.direction,
      entry: prefill.entry !== undefined && prefill.entry !== null ? String(prefill.entry) : f.entry,
      sl: prefill.sl !== undefined && prefill.sl !== null ? String(prefill.sl) : f.sl,
      tp: prefill.tp !== undefined && prefill.tp !== null ? String(prefill.tp) : f.tp,
      notes: prefill.notes || f.notes
    }));
    setMarket({
      timeframe: prefill.timeframe || '',
      provider: prefill.provider || '',
      providerLabel: prefill.providerLabel || '',
      signalStatus: prefill.signalStatus || '',
      signalStrength: prefill.signalStrength !== undefined ? prefill.signalStrength : null
    });
    setPicked(prefill.strategyIds || []);
    setOriginId(prefill.originAnalysisId || null);
    setFilter({ q:'', result:'all' });
    setErr('');
    if (onPrefillUsed) onPrefillUsed();
  }, [prefill]);

  const load = async () => {
    try {
      const r = await api('/trades');
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Chargement impossible');
      setTrades(d.trades || []); setStats(d.stats || null); setErr('');
    } catch (e) { setErr(e.message); }
    finally { setLoading(false); }
  };
  useEffect(() => { load(); }, []);

  const create = async (e) => {
    e.preventDefault();
    setBusy(true); setErr('');
    try {
      const r = await api('/trades', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ ...form, strategyIds: picked, originAnalysisId: originId,
          timeframe: market.timeframe, provider: market.provider,
          providerLabel: market.providerLabel, signalStatus: market.signalStatus,
          signalStrength: market.signalStrength })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Création refusée');
      setForm({ pair:'', direction:'BUY', entry:'', sl:'', tp:'', size:'', notes:'' });
      setPicked([]); setOriginId(null);
      setMarket({ timeframe:'', provider:'', providerLabel:'', signalStatus:'', signalStrength:null });
      await load();
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };

  const doClose = async (id) => {
    const c = closing[id] || {};
    if (c.exit === undefined || c.exit === '') { setErr('Renseigne le prix de sortie pour clôturer'); return; }
    setBusy(true); setErr('');
    try {
      const payload = { action:'close', exit:c.exit };
      if (c.pnl !== undefined && c.pnl !== '') payload.pnl = c.pnl;
      const r = await api(`/trades/${id}`, {
        method:'PATCH', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload)
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Clôture refusée');
      setClosing(s => { const n = { ...s }; delete n[id]; return n; });
      await load();
    } catch (e) { setErr(e.message); }
    finally { setBusy(false); }
  };

  const del = async (id) => { await api(`/trades/${id}`, { method:'DELETE' }); load(); };

  const n2 = v => (v === null || v === undefined ? '—' : Number(v).toFixed(2));
  const n6 = v => (v === null || v === undefined ? '—' : Number(v).toFixed(v % 1 === 0 ? 0 : 4));

  // Filtre local : recherche par paire/notes + résultat
  const matches = t => {
    const q = filter.q.trim().toLowerCase();
    if (q && !`${t.pair} ${t.notes || ''}`.toLowerCase().includes(q)) return false;
    if (filter.result === 'all') return true;
    if (filter.result === 'open') return t.status === 'open';
    return t.status === 'closed' && t.result === filter.result;
  };
  const open = trades.filter(t => t.status === 'open' && matches(t));
  const closed = trades.filter(t => t.status === 'closed' && matches(t));
  const filtered = filter.q.trim() !== '' || filter.result !== 'all';

  const stratTitle = id => (strategies.find(s => s.id === id) || {}).title || id;

  if (loading) return <div className="panel" style={{ padding:22 }}><Skeleton h={120} /></div>;

  return (
    <>
      <div className="stat-grid" style={{ marginBottom:18 }}>
        <StatTile icon="fa-receipt" label="Trades enregistrés" value={stats?.total || 0} color="#60a5fa" delay={0} />
        <StatTile icon="fa-bullseye" label="Taux de réussite" value={stats?.winRate ?? 0} decimals={1} suffix=" %" color="#34d399" delay={70} />
        <StatTile icon="fa-scale-balanced" label="PnL cumulé" value={stats?.pnlTotal ?? 0} decimals={2} color="#f59e0b" delay={140} />
        <StatTile icon="fa-wave-square" label="RR moyen" value={stats?.rrAvg ?? 0} decimals={2} color="#a78bfa" delay={210} />
      </div>

      {stats && (stats.wins > 0 || stats.losses > 0) && (
        <div className="panel" style={{ padding:'14px 18px', marginBottom:16, display:'flex',
          flexWrap:'wrap', gap:18, alignItems:'center', fontSize:13 }}>
          <span style={{ color:'#34d399' }}><i className="fas fa-check" style={{marginRight:6}}></i>{stats.wins} gain(s)</span>
          <span style={{ color:'#ef4444' }}><i className="fas fa-xmark" style={{marginRight:6}}></i>{stats.losses} perte(s)</span>
          <span style={{ color:'var(--muted)' }}><i className="fas fa-equals" style={{marginRight:6}}></i>{stats.breakeven} neutre(s)</span>
          <span style={{ color:'var(--muted)' }}><i className="fas fa-layer-group" style={{marginRight:6}}></i>{stats.open} en cours</span>
          {stats.streak && (

      <div className="panel" style={{ padding:20, marginBottom:16 }}>
        <h3 style={{ margin:'0 0 14px', fontSize:15 }}>Trades clôturés <span className="badge" style={{ marginLeft:8 }}>{closed.length}</span></h3>
        {closed.length === 0 ? (

            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13, minWidth:640 }}>

                  <tr key={t.id} style={{ borderTop:'1px solid var(--border)' }}>

                    <td style={{ padding:'9px 10px', color:'var(--muted)' }}>{t.direction}</td>
                    <td style={{ padding:'9px 10px', textAlign:'right' }}>{n6(t.entry)}</td>
                    <td style={{ padding:'9px 10px', textAlign:'right' }}>{n6(t.exit)}</td>
                    <td style={{ padding:'9px 10px', textAlign:'right',
                      color: t.rr > 0 ? '#34d399' : t.rr < 0 ? '#f87171' : 'var(--muted)' }}>{n2(t.rr)}</td>
                    <td style={{ padding:'9px 10px', textAlign:'right',
                      color: t.pnl > 0 ? '#34d399' : t.pnl < 0 ? '#f87171' : 'var(--muted)' }}>{n6(t.pnl)}</td>
                    <td style={{ padding:'9px 10px' }}><ResultBadge result={t.result} status={t.status} /></td>
                    <td style={{ padding:'9px 10px', textAlign:'right' }}>

        )}

      {stats && stats.byStrategy && stats.byStrategy.length > 0 && (
        <div className="panel" style={{ padding:20 }}>
          <h3 style={{ margin:'0 0 14px', fontSize:15 }}>Réussite par stratégie</h3>
          <div style={{ display:'grid', gap:10 }}>
            {stats.byStrategy.map(s => <StatRow key={s.key} s={s} />)}

      )}

      {stats && stats.byMarket && stats.byMarket.length > 0 && (
        <div className="panel" style={{ padding:20 }}>
          <h3 style={{ margin:'0 0 6px', fontSize:15 }}>Réussite par marché</h3>
          <p style={{ margin:'0 0 14px', fontSize:12, color:'var(--dim)' }}>

          </p>

            <>
              <h3 style={{ margin:'20px 0 10px', fontSize:15 }}>Par source de données</h3>

    </>
  );
