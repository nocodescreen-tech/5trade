# hostless.yaml — infrastructure as code pour Hostless Cloud
# https://docs.hostless.cloud/app/hostlessfile
#
# Deux contraintes réelles de l'offre gratuite, apprises à la validation :
#   1. les dépendances vivent dans api/, pas à la racine → sans `build.command`,
#      Railpack n'installe que la racine (vide) et le serveur démarre sans express ;
#   2. l'allocation gratuite est mutualisée (0,5 vCPU / 1 Gio) et la base en
#      consomme une part. Un fichier trop gourmand est refusé AVANT le build :
#      « This would use more than your free allowance ».
# Valeurs volontairement basses ; à augmenter seulement en pay-as-you-go.
build:
  system: auto
  command: "npm --prefix api ci --omit=dev"
  min_cpu: 0.1
  max_cpu: 0.25
  min_memory: 256
  max_memory: 512

start_command: "node api/server.js"

# /healthz touche réellement PostgreSQL : un 503 signale une vraie panne.
health_check:
  type: http
  http_path: /healthz
  interval_in_seconds: 30

scaling:
  trigger: http_requests
  min_cpu: 0.05
  max_cpu: 0.25
  min_memory: 128
  max_memory: 384
  min_replicas: 1
  max_replicas: 1
  max_http_requests_per_replica: 50
