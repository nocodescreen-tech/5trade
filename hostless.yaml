# hostless.yaml — infrastructure as code pour Hostless Cloud
# https://docs.hostless.cloud/app/hostlessfile
#
# Hostless construit depuis Git : les dépendances vivent dans api/, pas à la
# racine. Sans ce fichier, le build auto installe la racine (vide) et le serveur
# démarre sans express. On déclare donc explicitement la commande de build.
build:
  system: auto
  command: "npm --prefix api ci --omit=dev"
  min_cpu: 0.5
  max_cpu: 1
  min_memory: 512
  max_memory: 1024

start_command: "node api/server.js"

# /healthz touche réellement PostgreSQL : un 503 signale une vraie panne.
health_check:
  type: http
  http_path: /healthz
  interval_in_seconds: 30

scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 256
  max_memory: 512
  min_replicas: 1
  max_replicas: 1
  max_http_requests_per_replica: 100
